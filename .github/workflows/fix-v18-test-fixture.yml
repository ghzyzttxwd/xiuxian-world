name: Fix V1.8 regression fixture
on:
  push:
    branches: ["main"]
    paths: ["FIX_V18_TEST_FIXTURE.trigger"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/regression-v18.mjs')
          s=p.read_text(encoding='utf-8')
          old="inherit.player.spiritStones=80;inherit.player.insight=8;inherit.player.relicFragments=5;inherit.player.nascentEssence=0;inherit.player.nascentFailures=0;inherit.flags={};"
          new="inherit.player.spiritStones=80;inherit.player.insight=8;inherit.player.relicFragments=5;inherit.player.qi=430;inherit.player.hp=560;inherit.player.nascentEssence=0;inherit.player.nascentFailures=0;inherit.flags={};"
          if old not in s: raise SystemExit('fixture anchor missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/regression-v18.mjs
          git commit -m 'test: give V1.8 high-spell fixture enough qi [skip ci]'
          git push origin HEAD:main
