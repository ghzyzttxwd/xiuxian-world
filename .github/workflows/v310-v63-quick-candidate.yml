name: V3.10 V63 combined candidate quick gate

on:
  push:
    branches: ["v310-v63-final-candidate"]
    paths:
      - ".github/workflows/v310-v63-quick-candidate.yml"
      - "tools/build-v310-balance-v6.cjs"
      - "tests/regression-v310-v38-pill-effects.mjs"
      - "tools/fullrun-v310-no-recharge-v61.mjs"
      - "tools/fullrun-v310-no-recharge-v62.mjs"
      - "V310_V63_QUICK.trigger"

permissions:
  contents: read

concurrency:
  group: v310-v63-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable V3.9 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1

      - name: Validate combined V63 surface
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v310-balance-v6.cjs
          node --check tools/fullrun-v310-no-recharge-v61.mjs
          node --check tools/fullrun-v310-no-recharge-v62.mjs
          node tests/regression-v310-v38-pill-effects.mjs
          node --check src/game-v310.js
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tools/build-v310-balance-v6.cjs > V310_V63_BUILD.log
          node tests/regression-v310-resource-utility.mjs
          grep -q 'V310_BUILD_V6_PASS' V310_V63_BUILD.log
          grep -q 'V310_FULLRUN_V61_LIVE_TRIBULATION_ENTRY' tools/fullrun-v310-no-recharge-v61.mjs
          grep -q 'V310_FULLRUN_V62_ESCAPE_GUARD' tools/fullrun-v310-no-recharge-v62.mjs
          grep -q 'if(fleeAttempts===2)' tools/fullrun-v310-no-recharge-v62.mjs
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||!b.changes?.some(x=>String(x).includes('V38 high-tier pill effects')))throw new Error('V63 V6 build report mismatch');console.log('V310_V63_QUICK_GATE_PASS '+JSON.stringify({source_sha256:b.source_sha256,v6PillFix:true,v61LiveTribulation:true,v62EscapeGuard:true}))"

      - name: Upload V63 quick evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-v63-quick-candidate
          path: |
            BUILD_V310_BALANCE.json
            V310_RESOURCE_UTILITY_AUDIT.json
            V310_V63_BUILD.log
          if-no-files-found: ignore
          retention-days: 14
