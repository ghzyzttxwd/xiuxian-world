name: V1.7 core realm validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V17_CORE_REALM.trigger"
      - "tools/build-v17-core-realm.cjs"
      - "tests/regression-v17.mjs"
      - ".github/workflows/v17-core-realm.yml"
  push:
    branches: ["main"]
    paths: ["V17_CORE_REALM.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v17-core-realm-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V1.6 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V16_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='1601'||s.game_version!=='1.6.0'||s.location_count!==12||s.route_count!==20||s.save_schema_version!==13) throw new Error('V1.6 build 1601 baseline is not verified');
          JS
      - name: Build V1.7 core-realm source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v17-core-realm.cjs
          node --check src/game-v17.js
          node - <<'JS'
          const b=require('./BUILD_V17_CORE_REALM.json');
          if(b.status!=='PASS'||b.gameplay_version!=='1.7.0'||b.build!=='1701'||b.realm_count!==18||b.location_count!==12||b.route_count!==20||b.save_schema_version!==14) throw new Error('V1.7 build report mismatch');
          JS
          grep -q "const VERSION='1.7.0'" src/game-v17.js
          grep -q 'const SAVE_SCHEMA_VERSION=14' src/game-v17.js
          grep -q "name:'金丹后期'" src/game-v17.js
          grep -q 'majorBreakthroughRequirements' src/game-v17.js
          grep -q 'craftCoreEssence' src/game-v17.js
          grep -q 'realmSuppressionMultiplier' src/game-v17.js
          grep -q '玄阴丹煞' src/game-v17.js
      - name: Run V1.7 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v17.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v17:
    if: github.event_name == 'push'
    needs: validate-v17
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v17-core-realm.cjs
          node --check src/game-v17.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v17.mjs
      - name: Switch runtime shell to V1.7 build 1701
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V1.7 结丹金丹长线加载器 · build 1701
          (()=>{
            const fail=(e)=>{
              console.error(e);
              document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>';
            };
            try{
              window.__TAIXUAN_BUILD__={engineeringVersion:'1.7.0',gameplayVersion:'1.7.0',build:'1701',milestone:'core-realm-ladder',source:'src/game-v17.js',legacyPatchChain:false};
              document.title='太玄界 · 修仙大世界 V1.7';
              const script=document.createElement('script');
              script.src='./src/game-v17.js?v=1701';
              script.async=false;
              script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V1.7 直接源码运行时未完成初始化'))};
              script.onerror=()=>fail(new Error('V1.7 游戏核心加载失败：src/game-v17.js'));
              document.head.appendChild(script);
            }catch(e){fail(e)}
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V1.6','太玄界 · 修仙大世界 V1.7'),
            ('修仙大世界 · V1.6','修仙大世界 · V1.7'),
            ('V1.6 · 行旅路线与途中风险','V1.7 · 结丹与金丹长线'),
            ('修为圆满后不会自动升境；首页会出现“尝试突破”，破境需要 3 日并承担失败风险。','修为圆满后仍需主动破境。普通小境界沿用 3 日突破；筑基圆满后的结丹与凝结金丹属于大境界突破，需要结丹灵髓、悟道点和更长闭关时间，失败会伤根基并损寿元。'),
            ('./app.js?v=1601','./app.js?v=1701'),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v1.7.0-core-realm-1701';
          const CORE=['./','./index.html?v=1701','./style.css','./app.js?v=1701','./src/game-v17.js?v=1701','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=1701'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V1.7.0 · 结丹与金丹长线（build 1701）**

          ## 正式运行结构

          ```text
          index.html
            -> app.js
            -> src/game-v17.js
          ```

          浏览器继续直接加载可读源码，不恢复历史补丁运行时或 `eval`。

          ## V1.7 境界长线

          在 V1.6 的十二地域与 20 条行旅路线基础上，境界从筑基后期继续扩展：

          - 筑基圆满
          - 结丹境
          - 金丹初期
          - 金丹中期
          - 金丹后期

          普通小境界继续使用原有主动突破。筑基圆满→结丹、结丹→金丹改为独立的大境界规则：

          - 结丹需要 3 份结丹灵髓、2 点悟道，闭关 12 日；
          - 凝结金丹需要 2 份结丹灵髓、3 点悟道，闭关 9 日；
          - 必须无伤才能尝试；
          - 材料在开始冲关时真实消耗；
          - 失败会回退修为、加重伤势、损失寿元并积累破境感悟；
          - 结丹成功将寿元下限提升到 300，金丹成功提升到 500；
          - 旧筑基存档迁移后寿元下限补到 150。

          ## 结丹资源与高境界世界

          - 筑基后期可在赤霞谷、落星矿脉、古河遗迹淬炼结丹灵髓；
          - 每份灵髓消耗灵草 4、兽材 2、灵石 6，推进 2 日；
          - 深层地区新增筑基、结丹、金丹级敌人，其中部分会掉落结丹灵髓；
          - NPC 不再被锁死在炼气八层，可继续沿完整境界表成长；
          - 战斗加入境界压制，跨多个小境界时攻防差距会真实进入伤害公式。

          ## 存档兼容

          V1.7 增加持久化字段 `coreEssence` 与 `coreFailures`，因此 `saveSchemaVersion` 从 13 升至 14。旧 schema 2→13 迁移链完整保留，并新增 13→14 迁移；schema 15+ 的未来存档仍拒绝加载且绝不覆盖。

          ## 已有系统

          十二地域生态、20 条行旅路线、途中风险、战斗、宗门、坊市经济、炼丹、法器、NPC 恩怨、洞府、轮回、动态秘境、宗门大战全部保留。

          ## 工程与发布

          - `main`：唯一开发源。
          - `gh-pages`：公开部署产物。
          - `tools/build-v17-core-realm.cjs`：由 V1.6 正式源码生成 V1.7 境界长线源码。
          - `tests/regression-v17.mjs`：境界链、大境界材料门槛、成功/失败寿元、境界压制、V1.6 存档迁移及既有系统回归。
          - `.github/workflows/v17-core-realm.yml`：PR 只验证；main trigger 才发布并进行公网重新下载、源码哈希和 headless 回归。
          - V6 App 图标继续做 SHA-256 回归，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v17.js?v=1701' app.js
          grep -q 'src/game-v17.js?v=1701' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'v13-patch.js' app.js
          ! grep -q 'eval' app.js
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v17.mjs
      - name: Commit V1.7 source and shell to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v17.js BUILD_V17_CORE_REALM.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: V1.7 core realm ladder [skip ci]'
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V1.7 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v17.js /tmp/pages/src/game-v17.js
          cp BUILD_V17_CORE_REALM.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v17.js BUILD_V17_CORE_REALM.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish V1.7 core realm ${RELEASE_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=1701&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=1701&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v17.js?v=1701&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=1701&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" -eq 1 ] \
              && grep -q 'V1.7' /tmp/public-index.html \
              && grep -q 'src/game-v17.js?v=1701' /tmp/public-app.js \
              && grep -q "const VERSION='1.7.0'" /tmp/public-game.js \
              && grep -q 'const SAVE_SCHEMA_VERSION=14' /tmp/public-game.js \
              && grep -q "name:'金丹后期'" /tmp/public-game.js \
              && grep -q 'majorBreakthroughRequirements' /tmp/public-game.js \
              && grep -q 'craftCoreEssence' /tmp/public-game.js \
              && grep -q 'src/game-v17.js?v=1701' /tmp/public-sw.js \
              && ! grep -q 'bundle2' /tmp/public-app.js \
              && ! grep -q 'eval' /tmp/public-app.js \
              && [ "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512" ] \
              && [ "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192" ]; then break; fi
            test "$i" -lt 60 || { echo 'public V1.7 assets did not converge'; exit 1; }
            sleep 5
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/public-manifest.json'))
          assert m['display']=='standalone'
          assert m['short_name']=='太玄界'
          assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          assert all(x['purpose']=='any' for x in m['icons'])
          PY
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v17.mjs
          LOCAL_SHA=$(node -p "require('./BUILD_V17_CORE_REALM.json').source_sha256")
          PUBLIC_SHA=$(sha256sum /tmp/public-game.js | awk '{print $1}')
          test "$LOCAL_SHA" = "$PUBLIC_SHA"
      - name: Record and serve V1.7 public PASS
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(node -p "require('./BUILD_V17_CORE_REALM.json').source_sha256")
          cd /tmp/pages
          cat > PUBLIC_V17_STATUS.json <<JSON
          {"status":"PASS","game_version":"1.7.0","build":"1701","milestone":"core-realm-ladder","verified_commit":"${RELEASE_SHA}","source_sha256":"${SOURCE_SHA}","realm_count":18,"location_count":12,"route_count":20,"save_schema_version":14,"stage":"public-pass","checks":["V1.6 public baseline PASS","V1.7 source build","筑基圆满至金丹后期 realm ladder","结丹灵髓 crafting and high-enemy drops","结丹 and 金丹 material gates","major breakthrough failure injury/lifespan cost","realm lifespan milestones","realm suppression combat","NPC long-term realm progression","V1.6 travel/regional regression","schema 13 to 14 migration","future-save overwrite guard","public asset HTTP 200","public source hash equality","public headless regression","standalone manifest","V6 icon hash regression"]}
          JSON
          git add PUBLIC_V17_STATUS.json
          git commit -m 'chore: record V1.7 public PASS [skip ci]'
          git push origin HEAD:gh-pages
          for i in $(seq 1 60); do
            if curl -fsSL "https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V17_STATUS.json?x=${RELEASE_SHA}-${i}" -o /tmp/public-v17-status.json \
              && RELEASE_SHA="$RELEASE_SHA" node -e "const s=require('/tmp/public-v17-status.json');if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='1701'||s.realm_count!==18||s.save_schema_version!==14||s.verified_commit!==process.env.RELEASE_SHA)process.exit(1)"; then break; fi
            test "$i" -lt 60 || { echo 'PUBLIC_V17_STATUS not served'; exit 1; }
            sleep 5
          done
      - name: Sync verified V1.7 PASS back to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/public-v17-status.json PUBLIC_V17_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V17_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync verified V1.7 public PASS to main [skip ci]'
            git push origin HEAD:main
          fi
