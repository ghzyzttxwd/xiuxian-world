name: Phase 8 Round2 Audit

on:
  push:
    branches: ["phase8-round2-audit"]
    paths:
      - "PHASE8_ROUND2.trigger"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-round2-audit
      - name: Run human-navigation progression audit
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/playtest-phase8-round2.mjs
          test -s PHASE8_ROUND2_REPORT.json
      - name: Commit round2 report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE8_ROUND2_REPORT.json
          git commit -m 'test: record phase 8 round2 audit [skip ci]'
          git push origin HEAD:phase8-round2-audit
