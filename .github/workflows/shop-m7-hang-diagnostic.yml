name: Shop M7 Hang Diagnostic
on:
  push:
    paths:
      - '.github/workflows/shop-m7-hang-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jsdom
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
      - name: Instrument M7 sections and run with hard timeout
        run: |
          set -euo pipefail
          python - <<'PY'
          p='shop-m7-final-regression.js'
          s=open(p,encoding='utf-8').read()
          for n in range(1,9):
              marker=f'// {n})'
              s=s.replace(marker, f"console.log('M7_ENTER_{n}');\n{marker}", 1)
          s += "\nconsole.log('M7_SCRIPT_RETURN'); process.exit(0);\n"
          open('shop-m7-final-regression.instrumented.js','w',encoding='utf-8').write(s)
          PY
          node --check shop-m7-final-regression.instrumented.js
          timeout 120s node shop-m7-final-regression.instrumented.js
