name: Phase 8 Fast Audit

on:
  push:
    branches: ["phase8-fast-audit"]
    paths:
      - "PHASE8_FAST.trigger"

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-fast-audit
      - name: Run nine human-like routes
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cp tests/playtest-phase8.mjs tests/playtest-phase8-fast.mjs
          sed -i 's/for(let i=0;i<12;i++)/for(let i=0;i<3;i++)/' tests/playtest-phase8-fast.mjs
          sed -i "s/phase:'8-baseline'/phase:'8-fast-audit'/" tests/playtest-phase8-fast.mjs
          PHASE8_REPORT=PHASE8_FAST_REPORT.json node tests/playtest-phase8-fast.mjs
          rm tests/playtest-phase8-fast.mjs
          test -s PHASE8_FAST_REPORT.json
      - name: Commit fast report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE8_FAST_REPORT.json
          git commit -m 'test: record phase 8 fast audit [skip ci]'
          git push origin HEAD:phase8-fast-audit
