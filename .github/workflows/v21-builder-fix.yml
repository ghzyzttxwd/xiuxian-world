name: One-shot V2.1 builder cleanup
on:
  push:
    branches: ["main"]
    paths: ["V21_BUILDER_FIX.trigger"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix builder syntax and no-op gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v21-dao-paths.cjs')
          s=p.read_text(encoding='utf-8')
          reps={
          "id==='flame'?.90:id==='spirit'?.88:1":"id==='flame'?0.90:id==='spirit'?0.88:1",
          "id==='sword'?.96:id==='body'?.82:1":"id==='sword'?0.96:id==='body'?0.82:1",
          "id==='body'?.80:id==='spirit'?.94:id==='flame'?1.08:id==='sword'?.97:1":"id==='body'?0.80:id==='spirit'?0.94:id==='flame'?1.08:id==='sword'?0.97:1",
          "id==='body'?1.32:id==='spirit'?.92:id==='flame'?.94:1":"id==='body'?1.32:id==='spirit'?0.92:id==='flame'?0.94:1",
          "id==='spirit'?1.28:id==='flame'?1.12:id==='body'?.86:1":"id==='spirit'?1.28:id==='flame'?1.12:id==='body'?0.86:1",
          "must('function renderCombat(){', 'function renderCombat(){','render combat anchor');\n":""
          }
          for old,new in reps.items():
              if old not in s: raise SystemExit('missing cleanup anchor: '+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          node --check tools/build-v21-dao-paths.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-v21-dao-paths.cjs
          git commit -m 'fix: clean V2.1 dao path builder [skip ci]'
          git push origin HEAD:main
