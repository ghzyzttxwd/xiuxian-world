name: V1.6 travel routes validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V16_TRAVEL.trigger"
      - "tools/build-v16-travel.cjs"
      - "tests/regression-v16.mjs"
      - ".github/workflows/v16-travel.yml"
  push:
    branches: ["main"]
    paths: ["V16_TRAVEL.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v16-travel-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V1.5 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V15_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='1501'||s.game_version!=='1.5.0'||s.location_count!==12||s.save_schema_version!==13) throw new Error('V1.5 build 1501 baseline is not verified');
          JS
      - name: Build V1.6 travel source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v16-travel.cjs
          node --check src/game-v16.js
          node - <<'JS'
          const b=require('./BUILD_V16_TRAVEL.json');
          if(b.status!=='PASS'||b.gameplay_version!=='1.6.0'||b.build!=='1601'||b.location_count!==12||b.route_count!==20||b.save_schema_version!==13) throw new Error('V1.6 build report mismatch');
          JS
          grep -q "const VERSION='1.6.0'" src/game-v16.js
          grep -q 'TRAVEL_ROUTES' src/game-v16.js
          grep -q 'guarded-caravan' src/game-v16.js
          grep -q 'resolveTravelEncounter' src/game-v16.js
          grep -q 'data-route' src/game-v16.js
      - name: Run V1.6 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v16.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v16:
    if: github.event_name == 'push'
    needs: validate-v16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v16-travel.cjs
          node --check src/game-v16.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v16.mjs
      - name: Switch runtime shell to V1.6 build 1601
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V1.6 行旅路线加载器 · build 1601
          (()=>{
            const fail=(e)=>{
              console.error(e);
              document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>';
            };
            try{
              window.__TAIXUAN_BUILD__={engineeringVersion:'1.6.0',gameplayVersion:'1.6.0',build:'1601',milestone:'travel-routes-risk',source:'src/game-v16.js',legacyPatchChain:false};
              document.title='太玄界 · 修仙大世界 V1.6';
              const script=document.createElement('script');
              script.src='./src/game-v16.js?v=1601';
              script.async=false;
              script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V1.6 直接源码运行时未完成初始化'))};
              script.onerror=()=>fail(new Error('V1.6 游戏核心加载失败：src/game-v16.js'));
              document.head.appendChild(script);
            }catch(e){fail(e)}
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V1.5','太玄界 · 修仙大世界 V1.6'),
            ('修仙大世界 · V1.5','修仙大世界 · V1.6'),
            ('V1.5 · 十二地域与区域生态','V1.6 · 行旅路线与途中风险'),
            ('./app.js?v=1501','./app.js?v=1601'),
            ('十二片地域由道路相连；危险、特产、势力、敌人与秘境活跃度都会随地区变化，赶路仍会真实推进世界时间。','十二片地域继续存在；部分目的地已有多条路线可选，天数、路费、地区危险、伤势与势力关系会共同决定途中风险，赶路可能遭遇战斗或见闻。'),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v1.6.0-travel-routes-1601';
          const CORE=['./','./index.html?v=1601','./style.css','./app.js?v=1601','./src/game-v16.js?v=1601','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=1601'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V1.6.0 · 行旅路线与途中风险（build 1601）**

          ## 正式运行结构

          ```text
          index.html
            -> app.js
            -> src/game-v16.js
          ```

          浏览器继续直接加载可读源码，不恢复历史补丁运行时或 `eval`。

          ## V1.6 行旅系统

          V1.5 的 12 地域完整保留。V1.6 把“赶路只扣天数”升级为真实路线选择：

          - 全图建立 20 条具体行旅路线；
          - 临江城→云梦泽、临江城→苍梧郡城存在不同路线选择；
          - 不同路线有独立天数、基础风险、路线类型、控制势力和路费；
          - 青云宗弟子走青云控制路线风险降低，进入血刀门活动路线风险上升；
          - 重伤与宗门冲突紧张度会提高特定路线风险；
          - 付费护送/商船路线用灵石换更低风险或更短时间；
          - 途中可能遭遇真实战斗；
          - 也可能触发水路采药、荒野兽材、遗迹感悟、商旅酬谢、沿途传闻等见闻；
          - 地图按钮直接展示路线名、耗时、风险和路费。

          ## 存档兼容

          V1.6 没有增加持久化字段，继续使用 `saveSchemaVersion = 13` 和 `xiuxian_world_v02`。V1.4.1 建立的 schema 2→13 迁移和未来版本存档保护继续保留。

          ## 已有系统

          十二地域生态、战斗、宗门、坊市经济、炼丹、法器、NPC 恩怨、主动破境、洞府、轮回、动态秘境、宗门大战全部保留。

          ## 工程与发布

          - `main`：唯一开发源。
          - `gh-pages`：公开部署产物。
          - `tools/build-v16-travel.cjs`：由 V1.5 正式源码生成 V1.6 行旅源码。
          - `tests/regression-v16.mjs`：路线、风险、路费、V1.5 地域生态及存档兼容回归。
          - `.github/workflows/v16-travel.yml`：PR 只验证；main trigger 才发布并进行公网重新下载、源码哈希和 headless 回归。
          - V6 App 图标继续做 SHA-256 回归，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v16.js?v=1601' app.js
          grep -q 'src/game-v16.js?v=1601' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'v13-patch.js' app.js
          ! grep -q 'eval' app.js
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v16.mjs
      - name: Commit V1.6 source and shell to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v16.js BUILD_V16_TRAVEL.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: V1.6 travel routes and road risk [skip ci]'
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V1.6 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v16.js /tmp/pages/src/game-v16.js
          cp BUILD_V16_TRAVEL.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v16.js BUILD_V16_TRAVEL.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish V1.6 travel routes ${RELEASE_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=1601&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=1601&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v16.js?v=1601&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=1601&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" -eq 1 ] \
              && grep -q 'V1.6' /tmp/public-index.html \
              && grep -q 'src/game-v16.js?v=1601' /tmp/public-app.js \
              && grep -q "const VERSION='1.6.0'" /tmp/public-game.js \
              && grep -q 'TRAVEL_ROUTES' /tmp/public-game.js \
              && grep -q 'guarded-caravan' /tmp/public-game.js \
              && grep -q 'src/game-v16.js?v=1601' /tmp/public-sw.js \
              && ! grep -q 'bundle2' /tmp/public-app.js \
              && ! grep -q 'eval' /tmp/public-app.js \
              && [ "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512" ] \
              && [ "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192" ]; then break; fi
            test "$i" -lt 60 || { echo 'public V1.6 assets did not converge'; exit 1; }
            sleep 5
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/public-manifest.json'))
          assert m['display']=='standalone'
          assert m['short_name']=='太玄界'
          assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          assert all(x['purpose']=='any' for x in m['icons'])
          PY
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v16.mjs
          LOCAL_SHA=$(node -p "require('./BUILD_V16_TRAVEL.json').source_sha256")
          PUBLIC_SHA=$(sha256sum /tmp/public-game.js | awk '{print $1}')
          test "$LOCAL_SHA" = "$PUBLIC_SHA"
      - name: Record and serve V1.6 public PASS
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(node -p "require('./BUILD_V16_TRAVEL.json').source_sha256")
          cd /tmp/pages
          cat > PUBLIC_V16_STATUS.json <<JSON
          {"status":"PASS","game_version":"1.6.0","build":"1601","milestone":"travel-routes-risk","verified_commit":"${RELEASE_SHA}","source_sha256":"${SOURCE_SHA}","location_count":12,"route_count":20,"save_schema_version":13,"stage":"public-pass","checks":["V1.5 public baseline PASS","V1.6 source build","20 concrete travel routes","alternate route choices","route time and fees","regional/faction/injury/tension risk","real travel combat encounters","travel resource and rumor events","V1.5 regional ecology regression","current-schema save upgrade","future-save overwrite guard","public asset HTTP 200","public source hash equality","public headless regression","standalone manifest","V6 icon hash regression"]}
          JSON
          git add PUBLIC_V16_STATUS.json
          git commit -m 'chore: record V1.6 public PASS [skip ci]'
          git push origin HEAD:gh-pages
          for i in $(seq 1 60); do
            if curl -fsSL "https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V16_STATUS.json?x=${RELEASE_SHA}-${i}" -o /tmp/public-v16-status.json \
              && RELEASE_SHA="$RELEASE_SHA" node -e "const s=require('/tmp/public-v16-status.json');if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='1601'||s.route_count!==20||s.verified_commit!==process.env.RELEASE_SHA)process.exit(1)"; then break; fi
            test "$i" -lt 60 || { echo 'PUBLIC_V16_STATUS not served'; exit 1; }
            sleep 5
          done
      - name: Sync verified V1.6 PASS back to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/public-v16-status.json PUBLIC_V16_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V16_STATUS.json
          git commit -m 'chore: sync verified V1.6 public PASS to main [skip ci]'
          git push origin HEAD:main
