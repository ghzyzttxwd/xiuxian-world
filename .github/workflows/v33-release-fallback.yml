name: V3.3 release fallback

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V33_RELEASE_FINAL.trigger"
      - ".github/workflows/v33-release-fallback.yml"

permissions:
  contents: write

concurrency:
  group: taixuan-v33-release-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact V3.3 release machinery
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v33-alchemy-materials.cjs
          node --check src/game-v33.js
          test "$(sha256sum src/game-v33.js | awk '{print $1}')" = "f478196139011917072db71697bb306e2de105d5be1abdb1e0d71820be88d425"
          node -e "const b=require('./BUILD_V33_ALCHEMY_MATERIALS.json');if(b.status!=='PASS'||b.gameplay_version!=='3.3.0'||b.build!=='3301'||b.save_schema_version!==30||b.content_registry_version!==4||b.counts.materials!==48||b.counts.named_materials!==40||b.counts.recipes!==24||b.counts.pills!==24)throw new Error('V3.3 build mismatch')"
          node --check tools/release-v33-assets.cjs
          bash -n tools/verify-v33-public.sh
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs
          node tests/regression-v32.mjs
          node tests/regression-v33.mjs
          node tools/release-v33-assets.cjs
          grep -q "gameplayVersion:'3.3.0'" app.js
          grep -q 'src/game-v33.js?v=3301' app.js
          grep -q 'V3.3 · 炼丹材料资源闭环' index.html
          grep -q 'taixuan-v3.3.0-alchemy-material-loop-3301' sw.js
          ! grep -q 'eval' app.js
          ! grep -q 'bundle2' app.js
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v33-final:
    if: github.head_ref == 'v33-release-final-run'
    needs: validate-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact main release base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Reconfirm immutable main base and build runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node tools/build-v33-alchemy-materials.cjs
          node --check src/game-v33.js
          test "$(sha256sum src/game-v33.js | awk '{print $1}')" = "f478196139011917072db71697bb306e2de105d5be1abdb1e0d71820be88d425"
          node tools/release-v33-assets.cjs
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs
          node tests/regression-v32.mjs
          node tests/regression-v33.mjs
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

      - name: Commit exact V3.3 runtime to main
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main "$BASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v33.js BUILD_V33_ALCHEMY_MATERIALS.json app.js index.html sw.js
          git commit -m "feat: V3.3 alchemy material loop [skip ci]"
          git push origin HEAD:main
          echo "runtime_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish exact V3.3 runtime to gh-pages
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp index.html app.js sw.js BUILD_V33_ALCHEMY_MATERIALS.json /tmp/pages/
          cp src/game-v33.js /tmp/pages/src/game-v33.js
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js sw.js BUILD_V33_ALCHEMY_MATERIALS.json src/game-v33.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish V3.3 alchemy material loop ${RUNTIME_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Verify actual GitHub Pages
        id: public
        shell: bash
        env:
          BASE_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set +e
          ATTEMPTS=36 bash tools/verify-v33-public.sh
          rc=$?
          set -e
          public_ok=$(cat /tmp/V33_PUBLIC_OK 2>/dev/null || echo false)
          echo "public_ok=$public_ok" >> "$GITHUB_OUTPUT"
          echo "verifier_rc=$rc"
          cat /tmp/V33_PUBLIC_DIAGNOSTIC.txt || true
          exit 0

      - name: Persist V3.3 diagnostic on failure
        if: steps.public.outputs.public_ok != 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          cp /tmp/V33_PUBLIC_DIAGNOSTIC.txt /tmp/pages/PUBLIC_V33_DIAGNOSTIC.txt
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V33_DIAGNOSTIC.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: record V3.3 public diagnostic ${RUNTIME_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Stop failed public release
        if: steps.public.outputs.public_ok != 'true'
        shell: bash
        run: exit 1

      - name: Record V3.3 public PASS on gh-pages
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          cd /tmp/pages
          git rm -f --ignore-unmatch PUBLIC_V33_DIAGNOSTIC.txt >/dev/null 2>&1 || true
          RUNTIME_SHA="$RUNTIME_SHA" node -e "const fs=require('fs');const s={status:'PASS',game_version:'3.3.0',build:'3301',milestone:'alchemy-material-loop',verified_commit:process.env.RUNTIME_SHA,source_sha256:'f478196139011917072db71697bb306e2de105d5be1abdb1e0d71820be88d425',save_schema_version:30,content_registry_version:4,material_count:48,named_material_count:40,recipe_count:24,pill_count:24,stage:'public-pass',transport:'same-repo-pr-fallback',checks:['PR39 V3.3 validation PASS and closed unmerged','fallback workflow validation PASS and closed unmerged','schema29 to schema30 migration','legacy four pills and eight material fields preserved','40 named materials plus eight compatibility materials','24 recipes and pill items','recipe acquisition by realm location and cost','four pill quality grades','alchemy success and failure','pill toxicity and short-term tolerance','toxicity world-time decay','map gathering and named enemy drops','temporary combat and breakthrough buffs','high-risk burst downside','high-tier nascent and deification pills','limited lifespan pill','actual GitHub Pages HTTP 200','public V3.3 markers','public source SHA equality','public V3.3 headless regression','standalone manifest','V6 icon hash regression']};fs.writeFileSync('PUBLIC_V33_STATUS.json',JSON.stringify(s)+'\n')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V33_STATUS.json
          git commit -m "chore: record V3.3 public PASS ${RUNTIME_SHA} [skip ci]"
          git push origin HEAD:gh-pages

      - name: Verify PASS is actually reachable from Pages
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          visible=0
          for i in $(seq 1 60); do
            if curl -fsSL "https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V33_STATUS.json?verify=${RUNTIME_SHA}-${i}" -o /tmp/live-v33-status.json; then
              if RUNTIME_SHA="$RUNTIME_SHA" node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/live-v33-status.json','utf8'));if(s.status!=='PASS'||s.stage!=='public-pass'||s.game_version!=='3.3.0'||s.build!=='3301'||s.save_schema_version!==30||s.verified_commit!==process.env.RUNTIME_SHA)process.exit(1)" && cmp -s /tmp/live-v33-status.json /tmp/pages/PUBLIC_V33_STATUS.json; then visible=1; break; fi
            fi
            sleep 5
          done
          test "$visible" = 1

      - name: Sync exact PASS to main
        if: steps.public.outputs.public_ok == 'true'
        id: final_main
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          git checkout -B main origin/main
          cp /tmp/pages/PUBLIC_V33_STATUS.json PUBLIC_V33_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V33_STATUS.json
          git commit -m "chore: record V3.3 public PASS ${RUNTIME_SHA} [skip ci]"
          git push origin HEAD:main
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Final V3.3 delta guard
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
          FINAL_SHA: ${{ steps.final_main.outputs.final_sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$RUNTIME_SHA" "$FINAL_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'PUBLIC_V33_STATUS.json'
          cmp -s PUBLIC_V33_STATUS.json /tmp/pages/PUBLIC_V33_STATUS.json
          echo "V33_PUBLIC_TERMINAL_PASS $RUNTIME_SHA -> $FINAL_SHA"
