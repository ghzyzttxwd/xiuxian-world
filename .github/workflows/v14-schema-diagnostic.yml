name: V1.4 schema diagnostic

on:
  pull_request:
    branches: ["main"]
    paths: ["V14_SCHEMA_DIAG.trigger"]
  push:
    branches: ["main"]
    paths: ["V14_SCHEMA_DIAG.trigger"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build consolidated runtime
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v13-source.cjs
          node --check src/game-v13.js
          grep -q "const SAVE_SCHEMA_VERSION=13" src/game-v13.js
          grep -q "const SAVE_MIGRATIONS=" src/game-v13.js
      - name: Unified gameplay and save migration regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v14.mjs
