name: Verify V0.8 via registered runner

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v08:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Verify repository V0.8 chain
        shell: bash
        run: |
          set -euo pipefail
          echo 'repo-start' > V08_FINAL_STAGE.txt
          node --check app.js
          for v in 03 04 05 06 07 08; do node --check "v${v}-patch.js"; done
          grep -q 'V0.8' index.html
          grep -q '__TAIXUAN_PATCH_V08__' app.js
          grep -q 'taixuan-v0.8.0-relations-patch0801' sw.js
          grep -q '"status":"PASS"' PUBLIC_V08_PRE_STATUS.json
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08'])vm.runInContext(fs.readFileSync(`v${v}-patch.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');for(const v of ['03','04','05','06','07','08'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);
          for(const s of ["const VERSION='0.8.0'",'giftNPC','discussDaoNPC','sparNPC','askNPCForHelp','processSocialEvents','data-gift-herb'])assert(src.includes(s),`missing ${s}`);fs.writeFileSync('/tmp/v08.js',src);
          JS
          node /tmp/apply.cjs
          node --check /tmp/v08.js
          echo 'repo-pass' > V08_FINAL_STAGE.txt

      - name: Verify public V0.8 deployment
        shell: bash
        run: |
          set -euo pipefail
          echo 'public-start' > V08_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}index.html?verify=${GITHUB_SHA}" -o /tmp/index.html || ok=0
            curl -fsSL "${BASE}app.js?verify=${GITHUB_SHA}" -o /tmp/app.js || ok=0
            for v in 03 04 05 06 07 08; do curl -fsSL "${BASE}v${v}-patch.js?verify=${GITHUB_SHA}" -o "/tmp/v${v}.js" || ok=0; done
            curl -fsSL "${BASE}sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?verify=${GITHUB_SHA}" -o /tmp/manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?verify=${GITHUB_SHA}" -o /tmp/icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?verify=${GITHUB_SHA}" -o /tmp/icon192.png || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'V0.8' /tmp/index.html && grep -q '人情与恩怨闭环' /tmp/index.html && grep -q '__TAIXUAN_PATCH_V08__' /tmp/app.js && grep -q 'giftNPC' /tmp/v08.js && grep -q 'taixuan-v0.8.0-relations-patch0801' /tmp/sw.js && [ "$(sha256sum /tmp/icon512.png|awk '{print $1}')" = "$EXPECT512" ] && [ "$(sha256sum /tmp/icon192.png|awk '{print $1}')" = "$EXPECT192" ]; then break; fi
            test "$i" -lt 60 || exit 1
            sleep 5
          done
          node --check /tmp/app.js
          for v in 03 04 05 06 07 08; do node --check "/tmp/v${v}.js"; done
          rm -f /tmp/pub.b64
          for i in $(seq -w 1 24); do curl -fsSL "${BASE}bundle2/c${i}.b64?verify=${GITHUB_SHA}" >> /tmp/pub.b64; done
          tr -d '\n\r' < /tmp/pub.b64 | base64 -d > /tmp/pub-v02.js
          cat > /tmp/pub-apply.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08'])vm.runInContext(fs.readFileSync(`/tmp/v${v}.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/pub-v02.js','utf8');for(const v of ['03','04','05','06','07','08'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);assert(src.includes("const VERSION='0.8.0'"));assert(src.includes('processSocialEvents'));fs.writeFileSync('/tmp/pub-v08.js',src);
          JS
          node /tmp/pub-apply.cjs
          node --check /tmp/pub-v08.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > public-smoke.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('/tmp/index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;dom.window.eval(fs.readFileSync('/tmp/pub-v08.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);api.newGame('公网关系烟测');const s=api.getState();assert.equal(s.version,'0.8.0');assert(s.npcs.some(n=>n.known));assert(dom.window.document.getElementById('npcList').innerHTML.length>0);assert(fs.readFileSync('/tmp/pub-v08.js','utf8').includes('data-gift-herb'));console.log('PUBLIC_RELATIONS_SMOKE_PASS');
          JS
          node public-smoke.mjs
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m['display']=='standalone' and m['short_name']=='太玄界'
          assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          PY
          echo 'public-pass' > V08_FINAL_STAGE.txt

      - name: Record PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.8.0\",\"milestone\":\"relations-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V08_FINAL_STAGE.txt)\",\"checks\":[\"repository V0.2->V0.8 patch chain\",\"V0.8 syntax\",\"public V0.8 index\",\"public loader\",\"six public patches\",\"public service worker\",\"public runtime rebuild\",\"public relationship headless smoke\",\"standalone manifest\",\"V6 icon hash regression\",\"prerelease relationship gameplay PASS\"]}" > PUBLIC_V08_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V08_STATUS.json
          git commit -m 'chore: record V0.8 public verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V08_FINAL_STAGE.txt 2>/dev/null || echo 'unknown')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.8.0\",\"milestone\":\"relations-loop\",\"stage\":\"${stage}\"}" > PUBLIC_V08_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V08_STATUS.json
          git commit -m 'chore: record V0.8 public verification failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
