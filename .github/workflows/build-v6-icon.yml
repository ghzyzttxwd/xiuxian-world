name: Verify V1.1 legacy prerelease

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v11-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V1.1 candidate from real runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V11_PRE_STAGE.txt
          for v in 03 04 05 06 07 08 09 10 11; do node --check "v${v}-patch.js"; done
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v11.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08','09','10','11'])vm.runInContext(fs.readFileSync(`v${v}-patch.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');for(const v of ['03','04','05','06','07','08','09','10','11'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);
          for(const s of ["const VERSION='1.1.0'",'legacyGainThisLife','ensureLegacyDeathRecorded','reincarnate','renderLegacy','birthDay','totalDeaths','轮回传承已经开启'])assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';assert(src.includes(needle));src=src.replace(needle,"combatAction,load,legacyGainThisLife,ensureLegacyDeathRecorded,reincarnate,renderLegacy};\nboot();");fs.writeFileSync('/tmp/v11-test.js',src);
          JS
          node /tmp/apply-v11.cjs
          node --check /tmp/v11-test.js
          echo 'build-pass' > V11_PRE_STAGE.txt

      - name: Headless legacy regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'gameplay-start' > V11_PRE_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v11.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;dom.window.eval(fs.readFileSync('/tmp/v11-test.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);
          api.newGame('早夭测试');let s=api.getState();assert.equal(s.version,'1.1.0');assert.equal(s.legacy.merit,0);assert.equal(s.legacy.cycles,0);let mod=s;mod.flags.dead=true;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());assert.equal(api.ensureLegacyDeathRecorded(),0);s=api.getState();assert.equal(s.legacy.merit,0,'early death farmed merit');assert.equal(s.legacy.totalDeaths,1);api.ensureLegacyDeathRecorded();s=api.getState();assert.equal(s.legacy.totalDeaths,1,'death was recorded twice');
          api.newGame('成果测试');mod=api.getState();mod.player.realmIndex=6;mod.player.reputation=45;mod.player.kills=17;mod.player.retreatSessions=4;mod.player.spiritStones=99;mod.player.herbs=50;mod.player.dwellingTier=3;mod.world.casualties=777;mod.npcs[0].name='传承见证人';mod.flags.dead=true;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());const gain=api.ensureLegacyDeathRecorded();assert.equal(gain,9);s=api.getState();assert.equal(s.legacy.merit,9);assert.equal(s.legacy.bestRealm,6);assert.equal(s.legacy.totalDeaths,1);api.ensureLegacyDeathRecorded();assert.equal(api.getState().legacy.merit,9,'merit doubled on repeated death render');
          api.reincarnate('root');s=api.getState();assert.equal(s.flags.dead,undefined);assert.equal(s.legacy.cycles,1);assert.equal(s.legacy.merit,4);assert(s.player.rootIndex>=2);assert.equal(s.player.realmIndex,0);assert.equal(s.player.progress,0);assert.equal(s.player.dwellingTier,0);assert.equal(s.player.spiritStones,3);assert.equal(s.world.casualties,777);assert.equal(s.npcs[0].name,'传承见证人');
          mod=s;mod.flags.dead=true;mod.flags.legacyRecorded=true;mod.legacy.merit=10;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.reincarnate('resource');s=api.getState();assert.equal(s.legacy.merit,7);assert.equal(s.player.spiritStones,12);assert.equal(s.player.herbs,6);
          mod=s;mod.flags.dead=true;mod.flags.legacyRecorded=true;mod.legacy.merit=10;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.reincarnate('insight');s=api.getState();assert.equal(s.legacy.merit,7);assert.equal(s.player.insight,2);assert.equal(s.player.manualProf,20);
          api.newGame('迁移测试');const legacy=api.getState();delete legacy.player.birthDay;delete legacy.legacy;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));assert(api.load());s=api.getState();assert.equal(s.player.birthDay,1);assert.equal(s.legacy.cycles,0);assert.equal(s.legacy.merit,0);assert.equal(s.legacy.totalDeaths,0);
          console.log('V11_LEGACY_PASS');
          JS
          set +e
          node test-v11.mjs > V11_PRE_DEBUG.txt 2>&1
          rc=$?
          set -e
          cat V11_PRE_DEBUG.txt
          test "$rc" -eq 0
          echo 'gameplay-pass' > V11_PRE_STAGE.txt

      - name: Record prerelease PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"1.1.0\",\"milestone\":\"legacy-prerelease\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V11_PRE_STAGE.txt)\",\"checks\":[\"V0.2->V1.1 patch chain\",\"V1.1 syntax\",\"lifespan message updated\",\"early death gives zero merit\",\"death reward idempotent\",\"meaningful life merit formula\",\"root rebirth cost and minimum root\",\"world continuity across rebirth\",\"old assets reset\",\"resource inheritance\",\"insight inheritance\",\"legacy save migration\"]}" > PUBLIC_V11_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V11_PRE_STATUS.json
          git commit -m 'chore: record V1.1 prerelease verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record prerelease FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V11_PRE_STAGE.txt 2>/dev/null || echo 'unknown')
          debug=$(tail -c 5000 V11_PRE_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"1.1.0\",\"milestone\":\"legacy-prerelease\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V11_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V11_PRE_STATUS.json
          git commit -m 'chore: record V1.1 prerelease failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
