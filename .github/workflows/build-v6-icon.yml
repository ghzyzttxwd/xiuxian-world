name: Verify V1.2 prerelease secret realm

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v12-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V1.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'build' > V12_PRE_STAGE.txt
          : > V12_PRE_DEBUG.txt
          node --check v12-patch.js
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/build-v12.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08','09','10','11','12'])vm.runInContext(fs.readFileSync(`v${v}-patch.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');
          for(const v of ['03','04','05','06','07','08','09','10','11','12'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);
          for(const s of ["const VERSION='1.2.0'",'spawnSecretRealm','updateSecretRealm','enterSecretRealm','claimSecretRealmCore','decipherRelic','renderSecretRealm','onSecretRealmCombatWin'])assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';assert(src.includes(needle));
          src=src.replace(needle,"combatAction,load,spawnSecretRealm,updateSecretRealm,currentSecretRealm,secretRealmGuardian,secretRealmPrepare,enterSecretRealm,onSecretRealmCombatWin,claimSecretRealmCore,decipherRelic,renderSecretRealm,tickOneDay,advanceDays};\nboot();");
          fs.writeFileSync('/tmp/v12.js',src);
          JS
          node /tmp/build-v12.cjs >> V12_PRE_DEBUG.txt 2>&1
          node --check /tmp/v12.js >> V12_PRE_DEBUG.txt 2>&1
          echo 'build-pass' > V12_PRE_STAGE.txt

      - name: Gameplay regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'gameplay' > V12_PRE_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > v12-pre.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');
          const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;
          dom.window.eval(fs.readFileSync('/tmp/v12.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);api.newGame('V12秘境验收');
          let s=api.getState();assert.equal(s.version,'1.2.0');assert.equal(s.player.secretRealmClears,0);assert.equal(s.player.relicFragments,0);assert.equal(s.world.secretRealm,null);assert.equal(s.world.secretRealmCount,0);
          let r=api.spawnSecretRealm();s=api.getState();assert(r&&s.world.secretRealm);assert.equal(s.world.secretRealmCount,1);assert(s.world.secretRealm.closeDay>s.world.secretRealm.openDay);
          // 迁移/地点/阶段
          s.player.location=s.world.secretRealm.location;s.player.realmIndex=Math.max(4,s.world.secretRealm.threat);dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(s));assert(api.load());
          // 外围采药消耗一天且不可重复
          const d0=api.getState().time.day;api.secretRealmPrepare('forage');s=api.getState();assert.equal(s.world.secretRealm.foraged,true);const herbsAfter=s.player.herbs;api.secretRealmPrepare('forage');assert.equal(api.getState().player.herbs,herbsAfter);
          // 破阵 -> 守关阶段
          api.secretRealmPrepare('careful');s=api.getState();assert.equal(s.world.secretRealm.stage,1);
          const guard=api.secretRealmGuardian(s.world.secretRealm);assert.equal(guard.secretRealmGuardian,true);api.onSecretRealmCombatWin(guard);s=api.getState();assert.equal(s.world.secretRealm.stage,2);
          // 核心机缘
          const beforeFrag=s.player.relicFragments,beforeInsight=s.player.insight,beforeClears=s.player.secretRealmClears;api.claimSecretRealmCore();s=api.getState();assert.equal(s.world.secretRealm.cleared,true);assert(s.player.relicFragments>beforeFrag);assert.equal(s.player.insight,beforeInsight+1);assert.equal(s.player.secretRealmClears,beforeClears+1);
          // 残片参悟
          s.player.relicFragments=3;const mp=s.player.manualProf,ins=s.player.insight;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(s));assert(api.load());api.decipherRelic();s=api.getState();assert.equal(s.player.relicFragments,0);assert.equal(s.player.insight,ins+1);assert.equal(s.player.manualProf,mp+30);
          // 秘境过期关闭并安排下一次
          r=api.spawnSecretRealm();s=api.getState();if(!s.world.secretRealm){s.world.nextSecretRealmDay=1;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(s));assert(api.load());r=api.spawnSecretRealm();s=api.getState();}
          s.world.secretRealm.closeDay=1;s.time.year=2;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(s));assert(api.load());api.updateSecretRealm();s=api.getState();assert.equal(s.world.secretRealm,null);assert(s.world.nextSecretRealmDay>0);
          // 旧档迁移
          const old=JSON.parse(JSON.stringify(s));delete old.player.secretRealmClears;delete old.player.relicFragments;delete old.world.secretRealm;delete old.world.nextSecretRealmDay;delete old.world.secretRealmCount;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(old));assert(api.load());s=api.getState();assert.equal(s.player.secretRealmClears,0);assert.equal(s.player.relicFragments,0);assert('secretRealm' in s.world);assert(s.world.nextSecretRealmDay!=null);assert.equal(s.world.secretRealmCount,0);
          console.log('V12_PRERELEASE_PASS');
          JS
          node v12-pre.mjs >> V12_PRE_DEBUG.txt 2>&1
          echo 'gameplay-pass' > V12_PRE_STAGE.txt

      - name: Record PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"1.2.0\",\"milestone\":\"secret-realm\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V12_PRE_STAGE.txt)\",\"checks\":[\"V0.2->V1.2 patch chain\",\"V1.2 syntax\",\"secret realm spawn/expiry\",\"forage anti-repeat\",\"guardian integration\",\"core reward\",\"relic decipher\",\"old save migration\"]}" > PUBLIC_V12_PRE_STATUS.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add PUBLIC_V12_PRE_STATUS.json;git commit -m 'chore: record V1.2 prerelease PASS [skip ci]' || true;git push origin HEAD:gh-pages

      - name: Record FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V12_PRE_STAGE.txt 2>/dev/null || echo unknown);debug=$(tail -c 6000 V12_PRE_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""');printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"1.2.0\",\"milestone\":\"secret-realm\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V12_PRE_STATUS.json;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add PUBLIC_V12_PRE_STATUS.json;git commit -m 'chore: record V1.2 prerelease FAIL [skip ci]' || true;git push origin HEAD:gh-pages || true
