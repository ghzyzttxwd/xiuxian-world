name: Verify V0.6 alchemy prerelease

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v06-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V0.6 candidate from real runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V06_PRE_STAGE.txt
          for f in v03-patch.js v04-patch.js v05-patch.js v06-patch.js; do node --check "$f"; done
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v06.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['v03-patch.js','v04-patch.js','v05-patch.js','v06-patch.js'])vm.runInContext(fs.readFileSync(f,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');
          src=ctx.window.__TAIXUAN_PATCH_V03__(src);src=ctx.window.__TAIXUAN_PATCH_V04__(src);src=ctx.window.__TAIXUAN_PATCH_V05__(src);src=ctx.window.__TAIXUAN_PATCH_V06__(src);
          for(const s of ["const VERSION='0.6.0'",'ALCHEMY_RECIPES','alchemyProf','alchemyBatches','qiPills','brewAlchemy','useQiPill','renderAlchemy'])assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';
          assert(src.includes(needle),'test api hook missing');
          src=src.replace(needle,"combatAction,load,brewAlchemy,useQiPill,useHealingPill,alchemyChance};\nboot();");
          fs.writeFileSync('/tmp/v06-test.js',src);
          console.log('V06_BUILD_PASS',src.length);
          JS
          node /tmp/apply-v06.cjs
          node --check /tmp/v06-test.js
          echo 'build-pass' > V06_PRE_STAGE.txt

      - name: Headless alchemy gameplay regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'gameplay-start' > V06_PRE_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v06.mjs <<'JS'
          import fs from 'fs';
          import assert from 'assert';
          import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');
          const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});
          dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});
          dom.window.console=console;
          dom.window.eval(fs.readFileSync('/tmp/v06-test.js','utf8'));
          const api=dom.window.__TAIXUAN_TEST__;assert(api,'test API missing');
          api.newGame('炼丹测试者');
          let s=api.getState();
          assert.equal(s.version,'0.6.0');
          assert.equal(s.player.alchemyProf,0);assert.equal(s.player.alchemyBatches,0);assert.equal(s.player.qiPills,0);

          let boosted=api.getState();
          boosted.player.herbs=80;boosted.player.spiritStones=80;boosted.player.alchemyProf=300;boosted.player.realmIndex=1;boosted.player.sect='青云宗';boosted.player.sectRank='内门弟子';boosted.player.hp=1;boosted.player.injury=2;boosted.player.qi=0;
          dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(boosted));assert(api.load(),'boosted load failed');
          s=api.getState();
          const startHerbs=s.player.herbs,startStones=s.player.spiritStones,startBatches=s.player.alchemyBatches,startProf=s.player.alchemyProf;
          for(let i=0;i<10&&api.getState().player.healingPills===0;i++)api.brewAlchemy('healing');
          s=api.getState();assert(s.player.healingPills>0,'healing recipe never succeeded');assert(s.player.herbs<startHerbs&&s.player.spiritStones<startStones,'alchemy did not consume materials');assert(s.player.alchemyBatches>startBatches,'batch count did not increase');assert(s.player.alchemyProf>startProf,'alchemy proficiency did not grow');
          const healBefore=s.player.healingPills,injBefore=s.player.injury,hpBefore=s.player.hp;api.useHealingPill();s=api.getState();assert.equal(s.player.healingPills,healBefore-1);assert.equal(s.player.injury,injBefore-1);assert(s.player.hp>hpBefore,'healing pill did not restore hp');

          for(let i=0;i<10&&api.getState().player.qiPills===0;i++)api.brewAlchemy('qi');
          s=api.getState();assert(s.player.qiPills>0,'qi recipe never succeeded');const qiPillsBefore=s.player.qiPills,qiBefore=s.player.qi;api.useQiPill();s=api.getState();assert.equal(s.player.qiPills,qiPillsBefore-1);assert(s.player.qi>qiBefore,'qi pill did not restore qi');

          const legacy=api.getState();for(const k of ['alchemyProf','alchemyBatches','qiPills'])delete legacy.player[k];dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));assert(api.load(),'legacy V0.5 load failed');s=api.getState();assert.equal(s.player.alchemyProf,0);assert.equal(s.player.alchemyBatches,0);assert.equal(s.player.qiPills,0);
          console.log('V06_GAMEPLAY_PASS',JSON.stringify({alchemyProf:s.player.alchemyProf,batches:s.player.alchemyBatches,qiPills:s.player.qiPills}));
          JS
          set +e
          node test-v06.mjs > V06_PRE_DEBUG.txt 2>&1
          rc=$?
          set -e
          cat V06_PRE_DEBUG.txt
          test "$rc" -eq 0
          echo 'gameplay-pass' > V06_PRE_STAGE.txt

      - name: Record prerelease PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.6.0\",\"milestone\":\"alchemy-prerelease\",\"stage\":\"$(cat V06_PRE_STAGE.txt)\",\"checks\":[\"V0.2->V0.3->V0.4->V0.5->V0.6 chain\",\"V0.6 syntax\",\"material consumption\",\"alchemy proficiency growth\",\"healing recipe\",\"healing pill consumes and heals\",\"qi recipe\",\"qi pill restores qi\",\"legacy alchemy migration\"]}" > PUBLIC_V06_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V06_PRE_STATUS.json
          git commit -m 'chore: record V0.6 prerelease verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record prerelease FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V06_PRE_STAGE.txt 2>/dev/null || echo 'unknown')
          debug=$(tail -c 3000 V06_PRE_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.6.0\",\"milestone\":\"alchemy-prerelease\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V06_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V06_PRE_STATUS.json
          git commit -m 'chore: record V0.6 prerelease failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
