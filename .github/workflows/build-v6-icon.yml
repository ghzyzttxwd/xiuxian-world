name: Verify V1.0 dwelling prerelease

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v10-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V1.0 candidate from real runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V10_PRE_STAGE.txt
          for v in 03 04 05 06 07 08 09 10; do node --check "v${v}-patch.js"; done
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v10.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08','09','10'])vm.runInContext(fs.readFileSync(`v${v}-patch.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');for(const v of ['03','04','05','06','07','08','09','10'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);
          for(const s of ["const VERSION='1.0.0'",'DWELLINGS','buildOrUpgradeDwelling','retreatSevenDays','plantHerbPlot','harvestHerbPlot','dwellingCultivationMultiplier','renderDwelling'])assert(src.includes(s),`missing ${s}`);
          assert(src.includes('*dwellingCultivationMultiplier()'),'daily cultivation is not wired to dwelling multiplier');
          const needle='combatAction};\nboot();';assert(src.includes(needle));src=src.replace(needle,"combatAction,load,buildOrUpgradeDwelling,retreatSevenDays,plantHerbPlot,harvestHerbPlot,dwellingCultivationMultiplier,renderDwelling};\nboot();");fs.writeFileSync('/tmp/v10-test.js',src);
          JS
          node /tmp/apply-v10.cjs
          node --check /tmp/v10-test.js
          echo 'build-pass' > V10_PRE_STAGE.txt

      - name: Headless dwelling regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'gameplay-start' > V10_PRE_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v10.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;dom.window.eval(fs.readFileSync('/tmp/v10-test.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);api.newGame('洞府测试者');let s=api.getState();assert.equal(s.version,'1.0.0');assert.equal(s.player.dwellingTier,0);assert.equal(s.player.herbPlotSeeded,false);assert.equal(s.player.retreatSessions,0);
          let mod=api.getState();mod.player.location='青石镇';mod.player.spiritStones=120;mod.player.beastMaterials=20;mod.player.herbs=20;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());const stoneBefore=api.getState().player.spiritStones;api.buildOrUpgradeDwelling();s=api.getState();assert.equal(s.player.dwellingTier,1);assert.equal(s.player.dwellingLocation,'青石镇');assert.equal(s.player.spiritStones,stoneBefore-15);assert(Math.abs(api.dwellingCultivationMultiplier()-1.08)<1e-9);
          mod=api.getState();mod.player.location='临江城';dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());assert.equal(api.dwellingCultivationMultiplier(),1,'dwelling bonus should require being home');mod=api.getState();mod.player.location='青石镇';mod.player.progress=0;mod.player.injury=0;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.retreatSevenDays();s=api.getState();assert(s.player.progress>0,'retreat gave no cultivation');assert.equal(s.player.retreatSessions,1);
          mod=api.getState();mod.player.herbs=20;mod.player.spiritStones=100;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());const herbsBefore=api.getState().player.herbs,stonesBefore=api.getState().player.spiritStones;api.plantHerbPlot();s=api.getState();assert.equal(s.player.herbPlotSeeded,true);assert.equal(s.player.herbs,herbsBefore-2);assert.equal(s.player.spiritStones,stonesBefore-1);const seededHerbs=s.player.herbs;api.harvestHerbPlot();s=api.getState();assert.equal(s.player.herbPlotSeeded,true,'early harvest should not clear plot');assert.equal(s.player.herbs,seededHerbs,'early harvest changed herbs');api.advanceDays(10);api.harvestHerbPlot();s=api.getState();assert.equal(s.player.herbPlotSeeded,false);assert(s.player.herbs>seededHerbs,'mature plot did not yield herbs');
          mod=api.getState();mod.player.spiritStones=120;mod.player.beastMaterials=20;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.buildOrUpgradeDwelling();s=api.getState();assert.equal(s.player.dwellingTier,2);assert.equal(s.player.beastMaterials,16,'tier2 did not consume beast materials');
          api.newGame('迁移测试');const legacy=api.getState();delete legacy.player.dwellingTier;delete legacy.player.dwellingLocation;delete legacy.player.herbPlotReady;delete legacy.player.herbPlotSeeded;delete legacy.player.retreatSessions;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));assert(api.load());s=api.getState();assert.equal(s.player.dwellingTier,0);assert.equal(s.player.dwellingLocation,null);assert.equal(s.player.herbPlotSeeded,false);assert.equal(s.player.retreatSessions,0);
          console.log('V10_DWELLING_PASS');
          JS
          set +e
          node test-v10.mjs > V10_PRE_DEBUG.txt 2>&1
          rc=$?
          set -e
          cat V10_PRE_DEBUG.txt
          test "$rc" -eq 0
          echo 'gameplay-pass' > V10_PRE_STAGE.txt

      - name: Record prerelease PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"1.0.0\",\"milestone\":\"dwelling-prerelease\",\"stage\":\"$(cat V10_PRE_STAGE.txt)\",\"checks\":[\"V0.2->V1.0 patch chain\",\"V1.0 syntax\",\"dwelling build consumes resources\",\"dwelling location lock\",\"daily cultivation multiplier wired\",\"seven-day retreat grants growth\",\"herb plot seed cost\",\"early harvest blocked\",\"mature herb harvest\",\"tier2 beast material cost\",\"legacy dwelling migration\"]}" > PUBLIC_V10_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V10_PRE_STATUS.json
          git commit -m 'chore: record V1.0 prerelease verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record prerelease FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V10_PRE_STAGE.txt 2>/dev/null || echo 'unknown')
          debug=$(tail -c 5000 V10_PRE_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"1.0.0\",\"milestone\":\"dwelling-prerelease\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V10_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V10_PRE_STATUS.json
          git commit -m 'chore: record V1.0 prerelease failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
