name: Verify V0.5 via registered runner

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Verify repository V0.5 chain
        shell: bash
        run: |
          set -euo pipefail
          echo 'repo-start' > V05_FINAL_STAGE.txt
          node --check app.js
          for f in v03-patch.js v04-patch.js v05-patch.js; do node --check "$f"; done
          grep -q 'id="marketInfo"' index.html
          grep -q 'id="marketActions"' index.html
          grep -q '__TAIXUAN_PATCH_V05__' app.js
          grep -q 'taixuan-v0.5.0-market-patch0501' sw.js
          grep -q '"status":"PASS"' PUBLIC_V05_PRE_STATUS.json
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['v03-patch.js','v04-patch.js','v05-patch.js'])vm.runInContext(fs.readFileSync(f,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');src=ctx.window.__TAIXUAN_PATCH_V03__(src);src=ctx.window.__TAIXUAN_PATCH_V04__(src);src=ctx.window.__TAIXUAN_PATCH_V05__(src);
          for(const s of ["const VERSION='0.5.0'",'renderMarket','marketTrade','useHealingPill','healingPills'])assert(src.includes(s),`missing ${s}`);fs.writeFileSync('/tmp/v05.js',src);
          JS
          node /tmp/apply.cjs
          node --check /tmp/v05.js
          echo 'repo-pass' > V05_FINAL_STAGE.txt

      - name: Verify public V0.5 deployment
        shell: bash
        run: |
          set -euo pipefail
          echo 'public-start' > V05_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}index.html?verify=${GITHUB_SHA}" -o /tmp/index.html || ok=0
            curl -fsSL "${BASE}app.js?verify=${GITHUB_SHA}" -o /tmp/app.js || ok=0
            curl -fsSL "${BASE}v03-patch.js?verify=${GITHUB_SHA}" -o /tmp/v03.js || ok=0
            curl -fsSL "${BASE}v04-patch.js?verify=${GITHUB_SHA}" -o /tmp/v04.js || ok=0
            curl -fsSL "${BASE}v05-patch.js?verify=${GITHUB_SHA}" -o /tmp/v05patch.js || ok=0
            curl -fsSL "${BASE}sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?verify=${GITHUB_SHA}" -o /tmp/manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?verify=${GITHUB_SHA}" -o /tmp/icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?verify=${GITHUB_SHA}" -o /tmp/icon192.png || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'V0.5' /tmp/index.html && grep -q 'id="marketInfo"' /tmp/index.html && grep -q '__TAIXUAN_PATCH_V05__' /tmp/app.js && grep -q 'marketTrade' /tmp/v05patch.js && grep -q 'taixuan-v0.5.0-market-patch0501' /tmp/sw.js && [ "$(sha256sum /tmp/icon512.png|awk '{print $1}')" = "$EXPECT512" ] && [ "$(sha256sum /tmp/icon192.png|awk '{print $1}')" = "$EXPECT192" ]; then break; fi
            test "$i" -lt 60 || exit 1
            sleep 5
          done
          node --check /tmp/app.js
          for f in /tmp/v03.js /tmp/v04.js /tmp/v05patch.js; do node --check "$f"; done
          rm -f /tmp/pub.b64
          for i in $(seq -w 1 24); do curl -fsSL "${BASE}bundle2/c${i}.b64?verify=${GITHUB_SHA}" >> /tmp/pub.b64; done
          tr -d '\n\r' < /tmp/pub.b64 | base64 -d > /tmp/pub-v02.js
          cat > /tmp/pub-apply.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['/tmp/v03.js','/tmp/v04.js','/tmp/v05patch.js'])vm.runInContext(fs.readFileSync(f,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/pub-v02.js','utf8');src=ctx.window.__TAIXUAN_PATCH_V03__(src);src=ctx.window.__TAIXUAN_PATCH_V04__(src);src=ctx.window.__TAIXUAN_PATCH_V05__(src);assert(src.includes("const VERSION='0.5.0'"));assert(src.includes('renderMarket'));fs.writeFileSync('/tmp/pub-v05.js',src);
          JS
          node /tmp/pub-apply.cjs
          node --check /tmp/pub-v05.js
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m['display']=='standalone' and m['short_name']=='太玄界'
          assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          PY
          echo 'public-pass' > V05_FINAL_STAGE.txt

      - name: Record PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.5.0\",\"milestone\":\"market-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V05_FINAL_STAGE.txt)\",\"checks\":[\"repository V0.2->V0.3->V0.4->V0.5 chain\",\"V0.5 syntax\",\"market UI nodes\",\"public V0.5 index\",\"public loader\",\"public patches\",\"public service worker\",\"public runtime rebuild\",\"standalone manifest\",\"V6 icon hash regression\",\"prerelease market gameplay PASS\"]}" > PUBLIC_V05_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V05_STATUS.json
          git commit -m 'chore: record V0.5 public verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V05_FINAL_STAGE.txt 2>/dev/null || echo 'unknown')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.5.0\",\"milestone\":\"market-loop\",\"stage\":\"${stage}\"}" > PUBLIC_V05_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V05_STATUS.json
          git commit -m 'chore: record V0.5 public verification failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
