name: Verify V0.5 market prerelease

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v05-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V0.5 candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V05_STAGE.txt
          node --check v03-patch.js
          node --check v04-patch.js
          node --check v05-patch.js
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v05.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['v03-patch.js','v04-patch.js','v05-patch.js'])vm.runInContext(fs.readFileSync(f,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');src=ctx.window.__TAIXUAN_PATCH_V03__(src);src=ctx.window.__TAIXUAN_PATCH_V04__(src);src=ctx.window.__TAIXUAN_PATCH_V05__(src);
          for(const s of ["const VERSION='0.5.0'",'marketPrices','marketTrade','useHealingPill','renderMarket','healingPills','tradeVolume'])assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';assert(src.includes(needle),'test api hook missing');
          src=src.replace(needle,"combatAction,load,marketPrices,marketTrade,useHealingPill};\nboot();");fs.writeFileSync('/tmp/v05-test.js',src);
          JS
          node /tmp/apply-v05.cjs
          node --check /tmp/v05-test.js
          echo 'gameplay-start' > V05_STAGE.txt

      - name: Headless market regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v05.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script src="\.\/app\.js[^"]*"><\/script>/,'');
          const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;
          dom.window.eval(fs.readFileSync('/tmp/v05-test.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api,'test API missing');api.newGame('坊市测试者');
          let s=api.getState();assert.equal(s.version,'0.5.0');assert.equal(s.player.healingPills,0);assert.equal(s.player.tradeVolume,0);
          for(let i=0;i<12;i++)api.action('work');api.travel('青石镇');api.travel('临江城');s=api.getState();
          const price=api.marketPrices();assert(price.herbBuy>price.herbSell,'buy/sell spread allows arbitrage');
          const stones0=s.player.spiritStones,herbs0=s.player.herbs;api.marketTrade('buyHerb',1);s=api.getState();assert.equal(s.player.herbs,herbs0+1);assert.equal(s.player.spiritStones,stones0-price.herbBuy);
          const stones1=s.player.spiritStones;api.marketTrade('sellHerb',1);s=api.getState();assert.equal(s.player.spiritStones,stones1+price.herbSell);
          while(api.getState().player.spiritStones<price.pillBuy)api.action('work');api.marketTrade('buyPill',1);s=api.getState();assert.equal(s.player.healingPills,1);
          const damaged=api.getState();damaged.player.hp=1;damaged.player.injury=2;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(damaged));assert(api.load());api.useHealingPill();s=api.getState();assert.equal(s.player.healingPills,0);assert.equal(s.player.injury,1);assert(s.player.hp>1);
          const legacy=api.getState();delete legacy.player.healingPills;delete legacy.player.tradeVolume;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));assert(api.load());s=api.getState();assert.equal(s.player.healingPills,0);assert.equal(s.player.tradeVolume,0);
          console.log('V05_MARKET_PASS',JSON.stringify({prices:price,stones:s.player.spiritStones,herbs:s.player.herbs}));
          JS
          node test-v05.mjs
          echo 'gameplay-pass' > V05_STAGE.txt

      - name: Record PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.5.0\",\"milestone\":\"market-prerelease\",\"stage\":\"$(cat V05_STAGE.txt)\",\"checks\":[\"V0.2->V0.3->V0.4->V0.5 chain\",\"V0.5 syntax\",\"buy-sell spread\",\"buy herb\",\"sell herb\",\"buy healing pill\",\"pill consumes and heals injury\",\"legacy market migration\"]}" > PUBLIC_V05_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V05_PRE_STATUS.json
          git commit -m 'chore: record V0.5 prerelease verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V05_STAGE.txt 2>/dev/null || echo 'unknown')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.5.0\",\"milestone\":\"market-prerelease\",\"stage\":\"${stage}\"}" > PUBLIC_V05_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V05_PRE_STATUS.json
          git commit -m 'chore: record V0.5 prerelease failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
