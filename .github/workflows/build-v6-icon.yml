name: Verify V1.1 build 1104 final

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Repository quick checks
        shell: bash
        run: |
          set -euo pipefail
          echo 'repo-check' > V11_FINAL_STAGE.txt
          : > V11_FINAL_DEBUG.txt
          node --check app.js
          for v in 03 04 05 06 07 08 09 10 11; do node --check "v${v}-patch.js"; done
          grep -q 'app.js?v=1104' index.html
          grep -q 'v11-patch.js?v=1104' app.js
          grep -q 'taixuan-v1.1.0-legacy-patch1104' sw.js
          grep -q 'NPC世界模拟不得污染玩家关系' v11-patch.js
          echo 'repo-pass' > V11_FINAL_STAGE.txt

      - name: Wait for public 1104 assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'public-assets' > V11_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          ready=0
          for i in $(seq 1 60); do
            curl -fsSL "${BASE}index.html?verify=${GITHUB_SHA}" -o /tmp/index.html || true
            curl -fsSL "${BASE}app.js?verify=${GITHUB_SHA}" -o /tmp/app.js || true
            curl -fsSL "${BASE}v11-patch.js?verify=${GITHUB_SHA}" -o /tmp/v11.js || true
            curl -fsSL "${BASE}sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js || true
            if grep -q 'app.js?v=1104' /tmp/index.html 2>/dev/null && grep -q 'v11-patch.js?v=1104' /tmp/app.js 2>/dev/null && grep -q 'NPC世界模拟不得污染玩家关系' /tmp/v11.js 2>/dev/null && grep -q 'taixuan-v1.1.0-legacy-patch1104' /tmp/sw.js 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            { echo 'PUBLIC_1104_NOT_READY'; grep -n 'app.js?v=' /tmp/index.html 2>/dev/null | tail -1 || true; grep -n 'v11-patch.js?v=' /tmp/app.js 2>/dev/null || true; head -1 /tmp/sw.js 2>/dev/null || true; } >> V11_FINAL_DEBUG.txt
            exit 1
          fi
          echo 'public-assets-pass' > V11_FINAL_STAGE.txt

      - name: Rebuild public runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'public-runtime' > V11_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          for v in 03 04 05 06 07 08 09 10; do curl -fsSL "${BASE}v${v}-patch.js?verify=${GITHUB_SHA}" -o "/tmp/v${v}.js"; done
          rm -f /tmp/pub.b64
          for i in $(seq -w 1 24); do curl -fsSL "${BASE}bundle2/c${i}.b64?verify=${GITHUB_SHA}" >> /tmp/pub.b64; done
          tr -d '\n\r' < /tmp/pub.b64 | base64 -d > /tmp/pub-v02.js
          cat > /tmp/pub-build.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08','09','10','11'])vm.runInContext(fs.readFileSync(`/tmp/v${v}.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/pub-v02.js','utf8');
          for(const v of ['03','04','05','06','07','08','09','10','11'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);
          assert(src.includes("const VERSION='1.1.0'"));
          assert(src.includes('reincarnate'));
          assert(src.includes('renderLegacy'));
          const needle='combatAction};\nboot();';assert(src.includes(needle));
          src=src.replace(needle,"combatAction,load,ensureLegacyDeathRecorded,reincarnate,renderLegacy};\nboot();");
          fs.writeFileSync('/tmp/pub-v11.js',src);
          JS
          node /tmp/pub-build.cjs >> V11_FINAL_DEBUG.txt 2>&1
          node --check /tmp/pub-v11.js >> V11_FINAL_DEBUG.txt 2>&1
          echo 'public-runtime-pass' > V11_FINAL_STAGE.txt

      - name: Public reincarnation smoke
        shell: bash
        run: |
          set -euo pipefail
          echo 'reincarnation-smoke' > V11_FINAL_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > public-v11.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('/tmp/index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');
          const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});
          dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;
          dom.window.eval(fs.readFileSync('/tmp/pub-v11.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);
          api.newGame('公网1104');let mod=api.getState();mod.player.realmIndex=6;mod.player.reputation=45;mod.player.kills=17;mod.player.retreatSessions=4;mod.world.casualties=888;mod.npcs[0].name='公网见证人';mod.npcs[0].relation=88;mod.npcs[0].grudge=77;mod.npcs[0].lastHelpMonth=9;mod.flags.dead=true;
          dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());assert.equal(api.ensureLegacyDeathRecorded(),9);api.renderLegacy();assert(dom.window.document.querySelector('[data-reincarnate="plain"]'));
          api.reincarnate('plain');const s=api.getState();assert.equal(s.legacy.cycles,1);assert.equal(s.world.casualties,888);assert.equal(s.npcs[0].name,'公网见证人');assert.equal(s.npcs[0].relation,0);assert.equal(s.npcs[0].grudge,0);assert.equal(s.npcs[0].lastHelpMonth,0);assert.equal(s.player.realmIndex,0);assert.equal(s.player.spiritStones,3);console.log('PUBLIC_V11_1104_PASS');
          JS
          node public-v11.mjs >> V11_FINAL_DEBUG.txt 2>&1
          echo 'reincarnation-pass' > V11_FINAL_STAGE.txt

      - name: Manifest and icon regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'manifest-icons' > V11_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          curl -fsSL "${BASE}manifest-v6.webmanifest?verify=${GITHUB_SHA}" -o /tmp/manifest.json
          curl -fsSL "${BASE}icon-v6-512.png?verify=${GITHUB_SHA}" -o /tmp/icon512.png
          curl -fsSL "${BASE}icon-v6-192.png?verify=${GITHUB_SHA}" -o /tmp/icon192.png
          python3 - <<'PY'
          import json,hashlib
          m=json.load(open('/tmp/manifest.json'));assert m['display']=='standalone' and m['short_name']=='太玄界';assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          assert hashlib.sha256(open('/tmp/icon512.png','rb').read()).hexdigest()=='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          assert hashlib.sha256(open('/tmp/icon192.png','rb').read()).hexdigest()=='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          PY
          echo 'public-pass' > V11_FINAL_STAGE.txt

      - name: Record PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"1.1.0\",\"build\":\"1104\",\"milestone\":\"legacy-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V11_FINAL_STAGE.txt)\",\"checks\":[\"repository 1104\",\"public 1104 assets\",\"nine-patch runtime rebuild\",\"death and reincarnation smoke\",\"world continuity\",\"social reset\",\"manifest\",\"V6 icon hash regression\"]}" > PUBLIC_V11_STATUS.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add PUBLIC_V11_STATUS.json;git commit -m 'chore: record V1.1 build 1104 PASS [skip ci]';git push origin HEAD:gh-pages

      - name: Record FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V11_FINAL_STAGE.txt 2>/dev/null || echo unknown);debug=$(tail -c 6000 V11_FINAL_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""');printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"1.1.0\",\"build\":\"1104\",\"milestone\":\"legacy-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V11_STATUS.json;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add PUBLIC_V11_STATUS.json;git commit -m 'chore: record V1.1 build 1104 FAIL [skip ci]' || true;git push origin HEAD:gh-pages || true
