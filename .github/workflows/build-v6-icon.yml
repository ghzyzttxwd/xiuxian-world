name: Verify V1.1 build 1104

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Repository and gameplay regression
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'repo-gameplay' > V11_FINAL_STAGE.txt
          : > V11_FINAL_DEBUG.txt
          node --check app.js
          for v in 03 04 05 06 07 08 09 10 11; do node --check "v${v}-patch.js"; done
          grep -q 'id="legacyBox"' index.html
          grep -q 'app.js?v=1104' index.html
          grep -q 'v11-patch.js?v=1104' app.js
          grep -q 'taixuan-v1.1.0-legacy-patch1104' sw.js
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/build-v11.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const v of ['03','04','05','06','07','08','09','10','11'])vm.runInContext(fs.readFileSync(`v${v}-patch.js`,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');for(const v of ['03','04','05','06','07','08','09','10','11'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);
          for(const s of ["const VERSION='1.1.0'",'legacyGainThisLife','reincarnate','renderLegacy','轮回传承已经开启','n.lastRevengeDay=0'])assert(src.includes(s),`missing ${s}`);
          assert(!src.includes('后续版本会加入夺舍、转世与传承'));assert(!src.includes('if(rand()<.01){const other=pick(state.npcs.filter(x=>x.id!==n.id&&x.alive))'),'NPC simulation still mutates player social state');
          const needle='combatAction};\nboot();';assert(src.includes(needle));src=src.replace(needle,"combatAction,load,legacyGainThisLife,ensureLegacyDeathRecorded,reincarnate,renderLegacy};\nboot();");fs.writeFileSync('/tmp/v11-current.js',src);
          JS
          node /tmp/build-v11.cjs >> V11_FINAL_DEBUG.txt 2>&1
          node --check /tmp/v11-current.js >> V11_FINAL_DEBUG.txt 2>&1
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > regression-v11.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;dom.window.eval(fs.readFileSync('/tmp/v11-current.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);
          api.newGame('V11回归');let mod=api.getState();mod.player.realmIndex=6;mod.player.reputation=45;mod.player.kills=17;mod.player.retreatSessions=4;mod.player.spiritStones=99;mod.world.casualties=777;mod.npcs[0].name='传承见证人';mod.npcs[0].relation=88;mod.npcs[0].grudge=77;mod.npcs[0].lastGiftDay=9;mod.npcs[0].lastDaoDay=8;mod.npcs[0].lastSparDay=7;mod.npcs[0].lastHelpMonth=6;mod.npcs[0].lastRevengeDay=5;mod.flags.dead=true;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());assert.equal(api.ensureLegacyDeathRecorded(),9);assert.equal(api.ensureLegacyDeathRecorded(),0);api.reincarnate('plain');let s=api.getState();assert.equal(s.legacy.cycles,1);assert.equal(s.world.casualties,777);assert.equal(s.npcs[0].name,'传承见证人');for(const k of ['relation','grudge','lastGiftDay','lastDaoDay','lastSparDay','lastHelpMonth','lastRevengeDay'])assert.equal(s.npcs[0][k],0,k+' leaked/drifted');assert.equal(s.player.realmIndex,0);assert.equal(s.player.spiritStones,3);
          mod=s;mod.flags.dead=true;mod.flags.legacyRecorded=true;mod.legacy.merit=10;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.reincarnate('resource');s=api.getState();assert.equal(s.legacy.merit,7);assert.equal(s.player.spiritStones,12);assert.equal(s.player.herbs,6);
          mod=s;mod.flags.dead=true;mod.flags.legacyRecorded=true;mod.legacy.merit=10;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.reincarnate('root');s=api.getState();assert.equal(s.legacy.merit,5);assert(s.player.rootIndex>=2);console.log('V11_1104_REGRESSION_PASS');
          JS
          node regression-v11.mjs >> V11_FINAL_DEBUG.txt 2>&1
          echo 'repo-gameplay-pass' > V11_FINAL_STAGE.txt

      - name: Public assets sync
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'public-assets' > V11_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          ready=0
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}index.html?verify=${GITHUB_SHA}" -o /tmp/index.html || ok=0
            curl -fsSL "${BASE}app.js?verify=${GITHUB_SHA}" -o /tmp/app.js || ok=0
            for v in 03 04 05 06 07 08 09 10 11; do curl -fsSL "${BASE}v${v}-patch.js?verify=${GITHUB_SHA}" -o "/tmp/v${v}.js" || ok=0; done
            curl -fsSL "${BASE}sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?verify=${GITHUB_SHA}" -o /tmp/manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?verify=${GITHUB_SHA}" -o /tmp/icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?verify=${GITHUB_SHA}" -o /tmp/icon192.png || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'app.js?v=1104' /tmp/index.html && grep -q 'v11-patch.js?v=1104' /tmp/app.js && grep -q 'NPC世界模拟不得污染玩家关系' /tmp/v11.js && grep -q 'taixuan-v1.1.0-legacy-patch1104' /tmp/sw.js; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            { echo 'PUBLIC_ASSET_SYNC_TIMEOUT'; grep -n 'app.js?v=' /tmp/index.html | tail -1 || true; grep -n 'v11-patch.js?v=' /tmp/app.js || true; head -1 /tmp/sw.js || true; } >> V11_FINAL_DEBUG.txt
            exit 1
          fi
          echo 'public-assets-pass' > V11_FINAL_STAGE.txt

      - name: Public runtime and reincarnation smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'public-runtime' > V11_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          rm -f /tmp/pub.b64
          for i in $(seq -w 1 24); do curl -fsSL "${BASE}bundle2/c${i}.b64?verify=${GITHUB_SHA}" >> /tmp/pub.b64; done
          tr -d '\n\r' < /tmp/pub.b64 | base64 -d > /tmp/pub-v02.js
          cat > /tmp/pub-build.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);for(const v of ['03','04','05','06','07','08','09','10','11'])vm.runInContext(fs.readFileSync(`/tmp/v${v}.js`,'utf8'),ctx);let src=fs.readFileSync('/tmp/pub-v02.js','utf8');for(const v of ['03','04','05','06','07','08','09','10','11'])src=ctx.window[`__TAIXUAN_PATCH_V${v}__`](src);assert(src.includes("const VERSION='1.1.0'"));assert(!src.includes('if(rand()<.01){const other=pick(state.npcs.filter(x=>x.id!==n.id&&x.alive))');const needle='combatAction};\nboot();';assert(src.includes(needle));src=src.replace(needle,"combatAction,load,ensureLegacyDeathRecorded,reincarnate,renderLegacy};\nboot();");fs.writeFileSync('/tmp/pub-v11.js',src);
          JS
          node /tmp/pub-build.cjs >> V11_FINAL_DEBUG.txt 2>&1
          node --check /tmp/pub-v11.js >> V11_FINAL_DEBUG.txt 2>&1
          npm init -y >/dev/null 2>&1; npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > public-v11.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';const html=fs.readFileSync('/tmp/index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;dom.window.eval(fs.readFileSync('/tmp/pub-v11.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);api.newGame('公网1104');let mod=api.getState();mod.player.realmIndex=6;mod.player.reputation=45;mod.player.kills=17;mod.player.retreatSessions=4;mod.world.casualties=888;mod.npcs[0].relation=88;mod.npcs[0].grudge=77;mod.npcs[0].lastHelpMonth=9;mod.flags.dead=true;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(mod));assert(api.load());api.renderLegacy();assert(dom.window.document.querySelector('[data-reincarnate="plain"]'));api.reincarnate('plain');const s=api.getState();assert.equal(s.world.casualties,888);assert.equal(s.npcs[0].relation,0);assert.equal(s.npcs[0].grudge,0);assert.equal(s.npcs[0].lastHelpMonth,0);console.log('PUBLIC_V11_1104_PASS');
          JS
          node public-v11.mjs >> V11_FINAL_DEBUG.txt 2>&1
          echo 'public-runtime-pass' > V11_FINAL_STAGE.txt

      - name: Manifest and icons
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'manifest-icons' > V11_FINAL_STAGE.txt
          python3 - <<'PY'
          import json,hashlib
          m=json.load(open('/tmp/manifest.json'));assert m['display']=='standalone' and m['short_name']=='太玄界';assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          assert hashlib.sha256(open('/tmp/icon512.png','rb').read()).hexdigest()=='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          assert hashlib.sha256(open('/tmp/icon192.png','rb').read()).hexdigest()=='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          PY
          echo 'public-pass' > V11_FINAL_STAGE.txt

      - name: Record PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"1.1.0\",\"build\":\"1104\",\"milestone\":\"legacy-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V11_FINAL_STAGE.txt)\",\"checks\":[\"current repository gameplay regression\",\"NPC simulation social isolation\",\"public 1104 assets\",\"nine public patches\",\"public runtime rebuild\",\"death/reincarnation smoke\",\"paid inheritance smoke\",\"manifest\",\"V6 icon hash regression\"]}" > PUBLIC_V11_STATUS.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add PUBLIC_V11_STATUS.json;git commit -m 'chore: record V1.1 build 1104 PASS [skip ci]';git push origin HEAD:gh-pages

      - name: Record FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V11_FINAL_STAGE.txt 2>/dev/null || echo unknown);debug=$(tail -c 6000 V11_FINAL_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""');printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"1.1.0\",\"build\":\"1104\",\"milestone\":\"legacy-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V11_STATUS.json;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add PUBLIC_V11_STATUS.json;git commit -m 'chore: record V1.1 build 1104 FAIL [skip ci]' || true;git push origin HEAD:gh-pages || true
