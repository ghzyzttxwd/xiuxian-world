name: Verify V0.7 gear prerelease

on:
  push:
    branches: ["gh-pages"]
    paths: ["BUILD_V6.trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v07-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V0.7 candidate from real runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V07_PRE_STAGE.txt
          for f in v03-patch.js v04-patch.js v05-patch.js v06-patch.js v07-patch.js; do node --check "$f"; done
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v07.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['v03-patch.js','v04-patch.js','v05-patch.js','v06-patch.js','v07-patch.js'])vm.runInContext(fs.readFileSync(f,'utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');src=ctx.window.__TAIXUAN_PATCH_V03__(src);src=ctx.window.__TAIXUAN_PATCH_V04__(src);src=ctx.window.__TAIXUAN_PATCH_V05__(src);src=ctx.window.__TAIXUAN_PATCH_V06__(src);src=ctx.window.__TAIXUAN_PATCH_V07__(src);
          for(const s of ["const VERSION='0.7.0'",'GEAR_ITEMS','beastMaterials','gearOwned','equippedGear','gearAtk','gearDef','gearHp','gearQi','forgeGear','onGearCombatWin','+gearAtk()','-gearDef()'])assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';assert(src.includes(needle),'test api hook missing');src=src.replace(needle,"combatAction,load,forgeGear,equipGear,onGearCombatWin,gearAtk,gearDef,gearHp,gearQi};\nboot();");fs.writeFileSync('/tmp/v07-test.js',src);
          JS
          node /tmp/apply-v07.cjs
          node --check /tmp/v07-test.js
          echo 'build-pass' > V07_PRE_STAGE.txt

      - name: Headless gear gameplay regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'gameplay-start' > V07_PRE_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v07.mjs <<'JS'
          import fs from 'fs';import assert from 'assert';import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="\.\/app\.js[^>]*><\/script>/,'');const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});dom.window.console=console;dom.window.eval(fs.readFileSync('/tmp/v07-test.js','utf8'));const api=dom.window.__TAIXUAN_TEST__;assert(api);api.newGame('法器测试者');let s=api.getState();assert.equal(s.version,'0.7.0');assert.equal(s.player.beastMaterials,0);assert.deepEqual(s.player.gearOwned,[]);
          let boosted=api.getState();boosted.player.beastMaterials=50;boosted.player.spiritStones=100;boosted.player.realmIndex=2;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(boosted));assert(api.load());
          api.forgeGear('qinggang');s=api.getState();assert(s.player.gearOwned.includes('qinggang'));assert.equal(s.player.equipped.weapon,'qinggang');assert.equal(api.gearAtk(),5);
          api.forgeGear('xuantie');s=api.getState();assert(s.player.gearOwned.includes('xuantie'));assert.equal(s.player.equipped.armor,'xuantie');assert.equal(api.gearDef(),4);
          const hpBeforeBase=s.player.hp;api.forgeGear('juling');s=api.getState();assert(s.player.gearOwned.includes('juling'));assert.equal(s.player.equipped.charm,'juling');assert.equal(api.gearHp(),16);assert.equal(api.gearQi(),8);
          const matsBefore=s.player.beastMaterials;for(let i=0;i<30&&api.getState().player.beastMaterials===matsBefore;i++)api.onGearCombatWin({kind:'妖兽',realm:4,name:'测试妖兽'});s=api.getState();assert(s.player.beastMaterials>matsBefore,'妖兽战利品未掉落');
          const legacy=api.getState();for(const k of ['beastMaterials','gearOwned','equipped'])delete legacy.player[k];dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));assert(api.load());s=api.getState();assert.equal(s.player.beastMaterials,0);assert.deepEqual(s.player.gearOwned,[]);assert.equal(s.player.equipped.weapon,null);assert.equal(s.player.equipped.armor,null);assert.equal(s.player.equipped.charm,null);
          console.log('V07_GEAR_PASS');
          JS
          set +e
          node test-v07.mjs > V07_PRE_DEBUG.txt 2>&1
          rc=$?
          set -e
          cat V07_PRE_DEBUG.txt
          test "$rc" -eq 0
          echo 'gameplay-pass' > V07_PRE_STAGE.txt

      - name: Record prerelease PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.7.0\",\"milestone\":\"gear-prerelease\",\"stage\":\"$(cat V07_PRE_STAGE.txt)\",\"checks\":[\"V0.2->V0.3->V0.4->V0.5->V0.6->V0.7 chain\",\"V0.7 syntax\",\"weapon attack bonus\",\"armor defense bonus\",\"charm hp/qi bonus\",\"gear forging consumes resources\",\"beast material drop\",\"legacy gear migration\"]}" > PUBLIC_V07_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V07_PRE_STATUS.json
          git commit -m 'chore: record V0.7 prerelease verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record prerelease FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V07_PRE_STAGE.txt 2>/dev/null || echo 'unknown')
          debug=$(tail -c 3000 V07_PRE_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.7.0\",\"milestone\":\"gear-prerelease\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V07_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V07_PRE_STATUS.json
          git commit -m 'chore: record V0.7 prerelease failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
