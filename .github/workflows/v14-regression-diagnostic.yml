name: V1.4 regression diagnostic

on:
  push:
    branches: ["main"]
    paths: ["V14_REGRESSION_DIAG.trigger"]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run regression and record exact result
        shell: bash
        run: |
          set -uo pipefail
          rm -f V14_REGRESSION_DIAG_PASS.json V14_REGRESSION_DIAG_FAIL.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          set +e
          node tests/regression-v14.mjs > /tmp/v14-regression-diag.log 2>&1
          rc=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' '{"status":"PASS","stage":"unified-regression","build":"1401"}' > V14_REGRESSION_DIAG_PASS.json
            git add V14_REGRESSION_DIAG_PASS.json
            git commit -m 'test: V1.4 unified regression diagnostic PASS [skip ci]'
            git push origin HEAD:main
          else
            { echo 'V1.4 UNIFIED REGRESSION DIAGNOSTIC FAIL'; echo; cat /tmp/v14-regression-diag.log; } > V14_REGRESSION_DIAG_FAIL.txt
            git add V14_REGRESSION_DIAG_FAIL.txt
            git commit -m 'chore: record V1.4 regression diagnostic failure [skip ci]'
            git push origin HEAD:main
            exit "$rc"
          fi
