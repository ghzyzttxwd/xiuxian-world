name: Deploy TaiXuan World to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build TaiXuan app icons
        shell: bash
        run: |
          set -euo pipefail
          base64 -d icon-192-v2.b64 > icon-192-v2.jpg
          base64 -d icon-512-v2.b64 > icon-512-v2.jpg
          python3 - <<'PY'
          from pathlib import Path
          import struct

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if not data.startswith(b'\xff\xd8'):
                  raise SystemExit(f'{path}: not JPEG')
              i = 2
              while i < len(data) - 9:
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += length
              raise SystemExit(f'{path}: no JPEG SOF')

          expected = {'icon-192-v2.jpg': (192,192), 'icon-512-v2.jpg': (512,512)}
          for path, dims in expected.items():
              actual = jpeg_size(path)
              if actual != dims:
                  raise SystemExit(f'{path}: {actual} != {dims}')
              if Path(path).stat().st_size < 5000:
                  raise SystemExit(f'{path}: suspiciously small')
              print(path, actual, Path(path).stat().st_size)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
