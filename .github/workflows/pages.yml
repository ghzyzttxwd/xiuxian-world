name: Deploy TaiXuan World to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source PWA
        shell: bash
        run: |
          set -euo pipefail
          test -s icon-v3.svg
          grep -q '<title id="title">太玄界</title>' icon-v3.svg
          grep -q 'icon-v3.svg' manifest.webmanifest
          grep -q '"short_name": "太玄界"' manifest.webmanifest
          grep -q 'taixuan-v0.2.2-icon-v3' sw.js
          grep -q 'icon-v3.svg?v=3' index.html
          test -s app.js
          test -s bundle2/c01.b64
          test -s bundle2/c24.b64

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment end-to-end
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          nonce="${GITHUB_SHA}"

          for n in $(seq 1 15); do
            ok=1
            curl -fsSL --max-time 20 "${base}?v=${nonce}" -o /tmp/index.html || ok=0
            curl -fsSL --max-time 20 "${base}manifest.webmanifest?v=${nonce}" -o /tmp/manifest.json || ok=0
            curl -fsSL --max-time 20 "${base}icon-v3.svg?v=${nonce}" -o /tmp/icon.svg || ok=0
            curl -fsSL --max-time 20 "${base}sw.js?v=${nonce}" -o /tmp/sw.js || ok=0
            curl -fsSL --max-time 20 "${base}app.js?v=${nonce}" -o /tmp/app.js || ok=0
            curl -fsSL --max-time 20 "${base}bundle2/c01.b64?v=${nonce}" -o /tmp/c01.b64 || ok=0
            curl -fsSL --max-time 20 "${base}bundle2/c24.b64?v=${nonce}" -o /tmp/c24.b64 || ok=0

            if [ "$ok" -eq 1 ] && \
               grep -q 'icon-v3.svg?v=3' /tmp/index.html && \
               grep -q 'icon-v3.svg' /tmp/manifest.json && \
               grep -q '"short_name": "太玄界"' /tmp/manifest.json && \
               grep -q '<title id="title">太玄界</title>' /tmp/icon.svg && \
               grep -q 'taixuan-v0.2.2-icon-v3' /tmp/sw.js && \
               test -s /tmp/app.js && test -s /tmp/c01.b64 && test -s /tmp/c24.b64; then
              echo 'PUBLIC_PWA_V3=PASS'
              echo "URL=${base}"
              exit 0
            fi

            if [ "$n" -eq 15 ]; then
              echo 'Public Pages did not converge to PWA v3 within verification window' >&2
              exit 1
            fi
            sleep 5
          done

      - name: Record terminal verification
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/PUBLIC_V3_STATUS.json <<JSON
          {
            "status": "PASS",
            "verified_url": "${PAGE_URL}",
            "trigger_sha": "${GITHUB_SHA}",
            "checks": [
              "public index uses icon-v3.svg",
              "public manifest short_name is 太玄界",
              "public manifest uses icon-v3.svg",
              "public SVG contains 太玄界 title",
              "public service worker cache is taixuan-v0.2.2-icon-v3",
              "public app.js is reachable",
              "public runtime chunks c01 and c24 are reachable"
            ]
          }
          JSON

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cp /tmp/PUBLIC_V3_STATUS.json /tmp/gh-pages/PUBLIC_V3_STATUS.json
          cd /tmp/gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V3_STATUS.json
          git commit -m 'chore: record PWA v3 public verification [skip ci]' || true
          git push origin HEAD:gh-pages
