name: Deploy TaiXuan World to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate install icons
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, zlib
          def png(path, size):
              # Simple square app icon generated without external dependencies.
              # Dark jade background + warm-gold inset square.
              rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      inset=size//6 < x < size-size//6 and size//6 < y < size-size//6
                      if inset:
                          rgba=(207,184,119,255)
                      else:
                          rgba=(24,32,25,255)
                      row.extend(rgba)
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=(b'\x89PNG\r\n\x1a\n'+
                    chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+
                    chunk(b'IDAT',zlib.compress(raw,9))+
                    chunk(b'IEND',b''))
              open(path,'wb').write(data)
          png('icon-192.png',192)
          png('icon-512.png',512)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
