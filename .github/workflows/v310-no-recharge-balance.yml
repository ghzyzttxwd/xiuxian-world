name: V3.10 no-recharge balance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V310_BALANCE.trigger"
      - "tools/audit-v310-balance.mjs"
      - "tools/build-v310-balance.cjs"
      - "tools/build-v310-balance-v2.cjs"
      - "tools/build-v310-fullrun-headless.cjs"
      - "tools/fullrun-v310-no-recharge.mjs"
      - "tools/fullrun-v310-no-recharge-v2.mjs"
      - "tools/fullrun-v310-no-recharge-v3.mjs"
      - "tools/fullrun-v310-no-recharge-v4.mjs"
      - "tools/fullrun-v310-no-recharge-v5.mjs"
      - "tools/fullrun-v310-no-recharge-v6.mjs"
      - "tools/fullrun-v310-no-recharge-v7.mjs"
      - "tools/fullrun-v310-no-recharge-v8.mjs"
      - "tools/fullrun-v310-no-recharge-v9.mjs"
      - "tools/fullrun-v310-no-recharge-v10.mjs"
      - "tools/fullrun-v310-no-recharge-v11.mjs"
      - "tools/fullrun-v310-no-recharge-v12.mjs"
      - "tools/fullrun-v310-no-recharge-v13.mjs"
      - "tools/fullrun-v310-no-recharge-v14.mjs"
      - "tools/diagnose-v310-highchain.mjs"
      - "tests/regression-v310.mjs"
      - "tests/regression-v310-premahayana-auction.mjs"
      - ".github/workflows/v310-no-recharge-balance.yml"
  push:
    branches: ["v310-no-recharge-balance-validation"]
    paths:
      - "V310_BALANCE.trigger"
      - "tools/audit-v310-balance.mjs"
      - "tools/build-v310-balance.cjs"
      - "tools/build-v310-balance-v2.cjs"
      - "tools/build-v310-fullrun-headless.cjs"
      - "tools/fullrun-v310-no-recharge.mjs"
      - "tools/fullrun-v310-no-recharge-v2.mjs"
      - "tools/fullrun-v310-no-recharge-v3.mjs"
      - "tools/fullrun-v310-no-recharge-v4.mjs"
      - "tools/fullrun-v310-no-recharge-v5.mjs"
      - "tools/fullrun-v310-no-recharge-v6.mjs"
      - "tools/fullrun-v310-no-recharge-v7.mjs"
      - "tools/fullrun-v310-no-recharge-v8.mjs"
      - "tools/fullrun-v310-no-recharge-v9.mjs"
      - "tools/fullrun-v310-no-recharge-v10.mjs"
      - "tools/fullrun-v310-no-recharge-v11.mjs"
      - "tools/fullrun-v310-no-recharge-v12.mjs"
      - "tools/fullrun-v310-no-recharge-v13.mjs"
      - "tools/fullrun-v310-no-recharge-v14.mjs"
      - "tools/diagnose-v310-highchain.mjs"
      - "tests/regression-v310.mjs"
      - "tests/regression-v310-premahayana-auction.mjs"
      - ".github/workflows/v310-no-recharge-balance.yml"

permissions:
  contents: read

jobs:
  highchain-non-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare current candidate for NON-PROOF diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tools/build-v310-balance-v2.cjs
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tools/build-v310-fullrun-headless.cjs
          node --check src/game-v310.js
      - name: Run realm33+ NON-PROOF diagnostic
        shell: bash
        env:
          V310_DAO_PATH: sword
          V310_FULLRUN_SEED: "31006701"
          V310_FULLRUN_MAX_ACTIONS: "120000"
          V310_FULLRUN_MAX_FARM_ACTIONS: "2400"
        run: |
          set -euo pipefail
          node tools/diagnose-v310-highchain.mjs
          node -e "const r=require('./V310_FULLRUN_RESULT.json');if(!r.nonProofDiagnostic)throw new Error('diagnostic result missing NON-PROOF marker');if(r.proof?.freshSave!==false||!r.proof?.diagnosticOnly)throw new Error('diagnostic attempted to masquerade as full-run proof')"
      - name: Upload NON-PROOF highchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-highchain-non-proof-diagnostic
          path: V310_FULLRUN_RESULT.json
          if-no-files-found: ignore
          retention-days: 7

  audit-v310:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact V3.9 finalized baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
          node -e "const s=require('./PUBLIC_V39_STATUS.json');if(s.status!=='PASS'||s.game_version!=='3.9.0'||s.build!=='3901'||s.save_schema_version!==36||s.verified_commit!=='168f308cfed758e3385e2b9ead5a6e0d44d8a9c6')throw new Error('V3.9 baseline mismatch')"
      - name: Probe real runtime balance surface
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tools/audit-v310-balance.mjs
          test -s /tmp/V310_AUDIT.json
      - name: Build deterministic V3.10 direct source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v310-balance-v2.cjs
          node --check src/game-v310.js
          first=$(sha256sum src/game-v310.js | awk '{print $1}')
          cp src/game-v310.js /tmp/game-v310-first.js
          node tools/build-v310-balance-v2.cjs >/tmp/v310-build-second.log
          second=$(sha256sum src/game-v310.js | awk '{print $1}')
          test "$first" = "$second"
          cmp -s /tmp/game-v310-first.js src/game-v310.js
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.argv[1])throw new Error('V3.10 report mismatch')" "$first"
          echo "V310_SOURCE_SHA=$first"
      - name: Run V3.10 balance regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
      - name: Prepare gameplay-neutral headless full-run copy
        shell: bash
        run: |
          set -euo pipefail
          cp src/game-v310.js /tmp/game-v310-release-candidate.js
          original=$(sha256sum src/game-v310.js | awk '{print $1}')
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.source_sha256!==process.argv[1])throw new Error('candidate changed before headless transform')" "$original"
          node tools/build-v310-fullrun-headless.cjs
          node --check src/game-v310.js
          node -e "const r=require('/tmp/V310_HEADLESS.json');if(r.status!=='PASS'||r.mode!=='fullrun-headless-ui-persistence-only'||r.replacements!==3||r.original_sha256!==process.argv[1])throw new Error('headless transform proof mismatch')" "$original"
      - name: Run legal no-recharge sword full-run
        shell: bash
        env:
          V310_DAO_PATH: sword
          V310_FULLRUN_SEED: "31006701"
          V310_FULLRUN_MAX_ACTIONS: "180000"
          V310_FULLRUN_MAX_FARM_ACTIONS: "2400"
        run: |
          set -euo pipefail
          node tools/fullrun-v310-no-recharge-v14.mjs
          node -e "const r=require('./V310_FULLRUN_RESULT.json');if(r.status!=='PASS'||r.final.realmIndex!==39||!r.final.ascended||!r.proof?.freshSave||!r.proof?.noRecharge||!r.proof?.legalGameplayCallsOnly||r.forbiddenCalls?.length)throw new Error('legal full-run proof incomplete')"
      - name: Upload V3.10 full-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-no-recharge-fullrun-sword
          path: V310_FULLRUN_RESULT.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Frozen V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"
