name: V3.1 manual spell expansion

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V31_MANUAL_SPELL_EXPANSION.trigger"
      - "content/v31-manuals.json"
      - "content/v31-spells.json"
      - "tools/v31-manual-spell-runtime.txt"
      - "tools/build-v31-manual-spell-expansion.cjs"
      - "tools/release-v31-assets.cjs"
      - "tools/verify-v31-public.sh"
      - "tests/regression-v31.mjs"
      - ".github/workflows/v31-manual-spell-expansion.yml"

permissions:
  contents: read

concurrency:
  group: taixuan-v31-manual-spell-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V3.0 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node -e "const b=require('./BUILD_V30_GROWTH_FOUNDATION.json');if(b.status!=='PASS'||b.gameplay_version!=='3.0.0'||b.build!=='3001'||b.source_sha256!=='5d2cf4cd48e9a485457546fbed222ed21b70a7258895dfde8965bffb08f9979d'||b.save_schema_version!==27)throw new Error('V3.0 baseline mismatch')"
          test "$(sha256sum src/game-v30.js | awk '{print $1}')" = "5d2cf4cd48e9a485457546fbed222ed21b70a7258895dfde8965bffb08f9979d"
          test "$(node -e "const s=require('./PUBLIC_V30_STATUS.json');process.stdout.write(s.status+' '+s.game_version+' '+s.build)")" = "PASS 3.0.0 3001"

      - name: Build deterministic V3.1 source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v31-manual-spell-expansion.cjs
          node --check src/game-v31.js
          first=$(sha256sum src/game-v31.js | awk '{print $1}')
          node tools/build-v31-manual-spell-expansion.cjs >/tmp/v31-build-second.log
          second=$(sha256sum src/game-v31.js | awk '{print $1}')
          test "$first" = "$second"
          test "$first" = "492a2808ba69727ab6232e753ed25f388cc324cff0a8032a1ccc35f8549180e7"
          node -e "const b=require('./BUILD_V31_MANUAL_SPELL_EXPANSION.json');if(b.status!=='PASS'||b.gameplay_version!=='3.1.0'||b.build!=='3101'||b.milestone!=='manual-spell-expansion'||b.save_schema_version!==28||b.content_registry_version!==2||b.counts.manuals!==28||b.counts.spells!==60||b.counts.active_slots!==6||b.counts.passive_slots!==1)throw new Error('V3.1 report mismatch')"
          test "$(node -e "const b=require('./BUILD_V31_MANUAL_SPELL_EXPANSION.json');process.stdout.write(b.source_sha256)")" = "$first"
          grep -q "const VERSION='3.1.0'" src/game-v31.js
          grep -q 'const SAVE_SCHEMA_VERSION=28' src/game-v31.js
          grep -q 'V31_MANUAL_CATALOG' src/game-v31.js
          grep -q 'V31_SPELL_CATALOG' src/game-v31.js
          grep -q 'useV31CombatSkill' src/game-v31.js

      - name: Run V2.9 V3.0 and V3.1 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs

      - name: Validate V3.1 release assets and public shell
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/release-v31-assets.cjs
          bash -n tools/verify-v31-public.sh
          node tools/release-v31-assets.cjs
          grep -q 'V3.1 · 功法术法大扩容' index.html
          grep -q 'app.js?v=3101' index.html
          grep -q "gameplayVersion:'3.1.0'" app.js
          grep -q 'src/game-v31.js?v=3101' app.js
          grep -q 'taixuan-v3.1.0-manual-spell-expansion-3101' sw.js
          grep -q 'src/game-v31.js?v=3101' sw.js
          ! grep -q 'eval' app.js
          ! grep -q 'bundle2' app.js

      - name: Frozen V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"
