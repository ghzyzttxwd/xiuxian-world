name: V3.10 V38 pill effect candidate

on:
  push:
    branches: ["v310-v38-pill-effect-fix"]
    paths:
      - ".github/workflows/v310-v38-pill-effect-candidate.yml"
      - "tools/build-v310-balance-v6.cjs"
      - "tests/regression-v310-v38-pill-effects.mjs"
      - "V310_V38_PILL.trigger"

permissions:
  contents: read

concurrency:
  group: v310-v38-pill-effect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable V3.9 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
      - name: Validate V6 pill repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v310-balance-v6.cjs
          node --check tests/regression-v310-v38-pill-effects.mjs
          node tests/regression-v310-v38-pill-effects.mjs
          node --check src/game-v310.js
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tools/build-v310-balance-v6.cjs >/tmp/v310-v6-resource-build.log
          node tests/regression-v310-resource-utility.mjs
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||!b.changes?.some(x=>String(x).includes('V38 high-tier pill effects')))throw new Error('V6 build report mismatch')"
      - name: Upload V6 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v310-v38-pill-effect-candidate
          path: |
            BUILD_V310_BALANCE.json
            V310_RESOURCE_UTILITY_AUDIT.json
          if-no-files-found: error
          retention-days: 14
