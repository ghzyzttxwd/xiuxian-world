name: V3.10 no-recharge final release fallback

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V310_RELEASE_FINAL.trigger"
      - ".github/workflows/v310-release-fallback.yml"
      - "tools/release-v310-assets.cjs"
      - "tools/verify-v310-public.sh"
      - "tools/aggregate-v310-fullrun-gate.mjs"

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: taixuan-v310-release-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  V39_BASE_SHA: 62db848091ce7686c85357a8c963820a9d27f24c
  PROOF_HEAD: 967bd0dc3ae5969e329af9c8a30377013773e24c
  PROOF_RUN_ID: "33189407456"
  LOCKED_SOURCE_SHA: bef81ede62e1c208bbca737c23092878da7734f3cd9f7864f4fb359b84393744

jobs:
  validate-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable V3.9 base and exact V3.10 proof run
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$V39_BASE_SHA"
          run_head=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.head_sha')
          run_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.status')
          run_conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.conclusion')
          test "$run_head" = "$PROOF_HEAD"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}/jobs?per_page=100")
          for name in no-recharge-sword no-recharge-flame no-recharge-body no-recharge-spirit; do
            echo "$jobs" | jq -e --arg n "$name" '.jobs[] | select(.name==$n and .status=="completed" and .conclusion=="success")' >/dev/null
          done

      - name: Rebuild and lock the exact proof source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PROOF_HEAD^{commit}"
          rm -rf /tmp/v310-proof
          git worktree add --detach /tmp/v310-proof "$PROOF_HEAD"
          (
            cd /tmp/v310-proof
            node tools/build-v310-balance-v3.cjs
            node --check src/game-v310.js
            test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$LOCKED_SOURCE_SHA"
          )
          node tools/build-v310-balance-v3.cjs
          node --check src/game-v310.js
          test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$LOCKED_SOURCE_SHA"
          cmp -s src/game-v310.js /tmp/v310-proof/src/game-v310.js
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.env.LOCKED_SOURCE_SHA)throw new Error('V3.10 locked report mismatch')"

      - name: Download and aggregate the exact four-path proof evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf V310_FULLRUN_EVIDENCE
          mkdir -p V310_FULLRUN_EVIDENCE
          for dao in sword flame body spirit; do
            mkdir -p "V310_FULLRUN_EVIDENCE/$dao"
            gh run download "$PROOF_RUN_ID" -n "v310-no-recharge-fullrun-$dao" -D "V310_FULLRUN_EVIDENCE/$dao"
          done
          node tools/aggregate-v310-fullrun-gate.mjs V310_FULLRUN_EVIDENCE

      - name: Run stable and V3.10 regression surface
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs
          node tests/regression-v32.mjs
          node tests/regression-v33.mjs
          node tests/regression-v34.mjs
          node tests/regression-v35.mjs
          node tests/regression-v36.mjs
          node tests/regression-v37.mjs
          node tests/regression-v38.mjs
          node tests/regression-v39.mjs
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs

      - name: Validate V3.10 release transform
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/release-v310-assets.cjs
          bash -n tools/verify-v310-public.sh
          node --check tools/aggregate-v310-fullrun-gate.mjs
          node tools/release-v310-assets.cjs
          node --check app.js
          grep -q "gameplayVersion:'3.10.0'" app.js
          grep -q 'src/game-v310.js?v=31001' app.js
          grep -q 'V3.10 · 无充值全流程总平衡篇' index.html
          grep -q 'taixuan-v3.10.0-no-recharge-full-run-balance-31001' sw.js
          ! grep -q 'eval' app.js
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

      - name: Upload final-gate validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v310-final-gate-validation
          path: |
            V310_FINAL_GATE_SUMMARY.json
            BUILD_V310_BALANCE.json
          if-no-files-found: error
          retention-days: 14

  release-v310-final:
    if: github.head_ref == 'v310-release-final-run'
    needs: validate-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact validated release head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconfirm main, proof, source lock and build release runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main gh-pages
          test "$PR_BASE_SHA" = "$V39_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$V39_BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.head_sha')" = "$PROOF_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.conclusion')" = "success"
          node tools/build-v310-balance-v3.cjs
          node --check src/game-v310.js
          test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$LOCKED_SOURCE_SHA"
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.env.LOCKED_SOURCE_SHA)throw new Error('V3.10 release report mismatch')"
          node tools/release-v310-assets.cjs
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

      - name: Rehydrate exact four-path evidence and create durable release proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf V310_FULLRUN_EVIDENCE evidence/v310
          mkdir -p V310_FULLRUN_EVIDENCE evidence/v310
          for dao in sword flame body spirit; do
            mkdir -p "V310_FULLRUN_EVIDENCE/$dao"
            gh run download "$PROOF_RUN_ID" -n "v310-no-recharge-fullrun-$dao" -D "V310_FULLRUN_EVIDENCE/$dao"
            cp "V310_FULLRUN_EVIDENCE/$dao/V310_FULLRUN_RESULT.json" "evidence/v310/fullrun-$dao.json"
          done
          node tools/aggregate-v310-fullrun-gate.mjs V310_FULLRUN_EVIDENCE
          cp V310_FINAL_GATE_SUMMARY.json evidence/v310/final-gate-summary.json
          PROOF_HEAD="$PROOF_HEAD" PROOF_RUN_ID="$PROOF_RUN_ID" SOURCE_SHA="$LOCKED_SOURCE_SHA" node -e "const fs=require('fs');const crypto=require('crypto');const files=['sword','flame','body','spirit'].map(x=>'evidence/v310/fullrun-'+x+'.json');const hashes=Object.fromEntries(files.map(f=>[f,crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex')]));fs.writeFileSync('V310_RELEASE_SOURCE_LOCK.json',JSON.stringify({status:'PASS',gameplay_version:'3.10.0',build:'31001',proof_head:process.env.PROOF_HEAD,proof_run_id:Number(process.env.PROOF_RUN_ID),source_sha256:process.env.SOURCE_SHA,save_schema_version:36,content_registry_version:10,evidence_sha256:hashes})+'\n')"

      - name: Commit exact V3.10 runtime and durable proof to main
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v310-release-files
          mkdir -p /tmp/v310-release-files
          cp --parents \
            src/game-v310.js BUILD_V310_BALANCE.json app.js index.html sw.js \
            V310_FINAL_GATE_SUMMARY.json V310_RELEASE_SOURCE_LOCK.json \
            tools/build-v310-balance.cjs tools/build-v310-balance-v2.cjs tools/build-v310-balance-v3.cjs \
            tools/build-v310-fullrun-headless.cjs tools/audit-v310-balance.mjs \
            tools/release-v310-assets.cjs tools/verify-v310-public.sh tools/aggregate-v310-fullrun-gate.mjs \
            tests/regression-v310.mjs tests/regression-v310-premahayana-auction.mjs tests/regression-v310-core-market.mjs \
            evidence/v310/fullrun-sword.json evidence/v310/fullrun-flame.json evidence/v310/fullrun-body.json evidence/v310/fullrun-spirit.json evidence/v310/final-gate-summary.json \
            /tmp/v310-release-files/
          git checkout -B main origin/main
          cp -a /tmp/v310-release-files/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v310.js BUILD_V310_BALANCE.json app.js index.html sw.js V310_FINAL_GATE_SUMMARY.json V310_RELEASE_SOURCE_LOCK.json tools/build-v310-balance.cjs tools/build-v310-balance-v2.cjs tools/build-v310-balance-v3.cjs tools/build-v310-fullrun-headless.cjs tools/audit-v310-balance.mjs tools/release-v310-assets.cjs tools/verify-v310-public.sh tools/aggregate-v310-fullrun-gate.mjs tests/regression-v310.mjs tests/regression-v310-premahayana-auction.mjs tests/regression-v310-core-market.mjs evidence/v310
          git commit -m "feat: V3.10 no-recharge full-run balance [skip ci]"
          git push origin HEAD:main
          echo "runtime_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish exact V3.10 runtime to gh-pages
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src /tmp/pages/evidence/v310
          cp index.html app.js sw.js BUILD_V310_BALANCE.json V310_FINAL_GATE_SUMMARY.json V310_RELEASE_SOURCE_LOCK.json /tmp/pages/
          cp src/game-v310.js /tmp/pages/src/game-v310.js
          cp evidence/v310/*.json /tmp/pages/evidence/v310/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js sw.js BUILD_V310_BALANCE.json V310_FINAL_GATE_SUMMARY.json V310_RELEASE_SOURCE_LOCK.json src/game-v310.js evidence/v310
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish V3.10 no-recharge balance ${RUNTIME_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Verify actual GitHub Pages V3.10 runtime
        id: public
        shell: bash
        env:
          BASE_SHA: ${{ steps.runtime.outputs.runtime_sha }}
          EXPECT_GAME: ${{ env.LOCKED_SOURCE_SHA }}
        run: |
          set +e
          ATTEMPTS=36 bash tools/verify-v310-public.sh
          rc=$?
          set -e
          public_ok=$(cat /tmp/V310_PUBLIC_OK 2>/dev/null || echo false)
          echo "public_ok=$public_ok" >> "$GITHUB_OUTPUT"
          echo "verifier_rc=$rc"
          cat /tmp/V310_PUBLIC_DIAGNOSTIC.txt || true
          exit 0

      - name: Persist V3.10 public diagnostic on failure
        if: steps.public.outputs.public_ok != 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          cp /tmp/V310_PUBLIC_DIAGNOSTIC.txt /tmp/pages/PUBLIC_V310_DIAGNOSTIC.txt
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V310_DIAGNOSTIC.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: record V3.10 public diagnostic ${RUNTIME_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Stop failed V3.10 public release
        if: steps.public.outputs.public_ok != 'true'
        shell: bash
        run: exit 1

      - name: Record V3.10 public PASS on gh-pages
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          cd /tmp/pages
          git rm -f --ignore-unmatch PUBLIC_V310_DIAGNOSTIC.txt >/dev/null 2>&1 || true
          RUNTIME_SHA="$RUNTIME_SHA" PROOF_HEAD="$PROOF_HEAD" PROOF_RUN_ID="$PROOF_RUN_ID" SOURCE_SHA="$LOCKED_SOURCE_SHA" node -e "const fs=require('fs');const gate=JSON.parse(fs.readFileSync('V310_FINAL_GATE_SUMMARY.json','utf8'));const lock=JSON.parse(fs.readFileSync('V310_RELEASE_SOURCE_LOCK.json','utf8'));const s={status:'PASS',game_version:'3.10.0',build:'31001',milestone:'no-recharge-full-run-balance',verified_commit:process.env.RUNTIME_SHA,source_sha256:process.env.SOURCE_SHA,save_schema_version:36,content_registry_version:10,proof_head:process.env.PROOF_HEAD,proof_run_id:Number(process.env.PROOF_RUN_ID),four_paths_complete:gate.fourPathsComplete,action_spread_ratio:gate.actionSpreadRatio,terminal_manual_variety:gate.terminalManualVariety,evidence_sha256:lock.evidence_sha256,stage:'public-pass',checks:['exact V3.9 finalized base','exact V3.10 proof head and successful four-path Actions run','four fresh-save no-recharge legal paths to 真仙','no direct-state mutation and no forbidden calls','high-realm time growth','scarce stock-1 auction recovery with dangerous map sources preserved','same-schema V3.9 save preservation','future schema37 protection','deterministic source lock','public HTTP 200','public source SHA equality','public V3.10 headless regressions','standalone manifest','V6 icon hash regression']};fs.writeFileSync('PUBLIC_V310_STATUS.json',JSON.stringify(s)+'\n')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V310_STATUS.json
          git commit -m "chore: record V3.10 public PASS ${RUNTIME_SHA} [skip ci]"
          git push origin HEAD:gh-pages

      - name: Verify V3.10 PASS is actually reachable from Pages
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          visible=0
          for i in $(seq 1 60); do
            if curl -fsSL "https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V310_STATUS.json?verify=${RUNTIME_SHA}-${i}" -o /tmp/live-v310-status.json; then
              if RUNTIME_SHA="$RUNTIME_SHA" SOURCE_SHA="$LOCKED_SOURCE_SHA" PROOF_HEAD="$PROOF_HEAD" PROOF_RUN_ID="$PROOF_RUN_ID" node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/live-v310-status.json','utf8'));if(s.status!=='PASS'||s.stage!=='public-pass'||s.game_version!=='3.10.0'||s.build!=='31001'||s.save_schema_version!==36||s.verified_commit!==process.env.RUNTIME_SHA||s.source_sha256!==process.env.SOURCE_SHA||s.proof_head!==process.env.PROOF_HEAD||s.proof_run_id!==Number(process.env.PROOF_RUN_ID)||!s.four_paths_complete)process.exit(1)" && cmp -s /tmp/live-v310-status.json /tmp/pages/PUBLIC_V310_STATUS.json; then visible=1; break; fi
            fi
            sleep 5
          done
          test "$visible" = 1

      - name: Sync exact V3.10 PASS to main
        if: steps.public.outputs.public_ok == 'true'
        id: final_main
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RUNTIME_SHA"
          git checkout -B main origin/main
          cp /tmp/pages/PUBLIC_V310_STATUS.json PUBLIC_V310_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V310_STATUS.json
          git commit -m "chore: record V3.10 public PASS ${RUNTIME_SHA} [skip ci]"
          git push origin HEAD:main
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Final V3.10 public delta guard
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
          FINAL_SHA: ${{ steps.final_main.outputs.final_sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$RUNTIME_SHA" "$FINAL_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'PUBLIC_V310_STATUS.json'
          cmp -s PUBLIC_V310_STATUS.json /tmp/pages/PUBLIC_V310_STATUS.json
          echo "V310_PUBLIC_TERMINAL_PASS $RUNTIME_SHA -> $FINAL_SHA"
