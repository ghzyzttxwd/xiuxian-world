name: V3.10 four-path no-recharge proof

concurrency:
  group: v310-four-paths-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["v310-no-recharge-balance-validation"]
    paths:
      - ".github/workflows/v310-no-recharge-four-paths.yml"
      - "tools/audit-v310-balance.mjs"
      - "tools/build-v310-balance.cjs"
      - "tools/build-v310-balance-v2.cjs"
      - "tools/build-v310-balance-v3.cjs"
      - "tools/build-v310-fullrun-headless.cjs"
      - "tools/fullrun-v310-no-recharge*.mjs"
      - "tests/regression-v310.mjs"
      - "tests/regression-v310-premahayana-auction.mjs"
      - "tests/regression-v310-core-market.mjs"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/v310-no-recharge-four-paths.yml"
      - "tools/audit-v310-balance.mjs"
      - "tools/build-v310-balance.cjs"
      - "tools/build-v310-balance-v2.cjs"
      - "tools/build-v310-balance-v3.cjs"
      - "tools/build-v310-fullrun-headless.cjs"
      - "tools/fullrun-v310-no-recharge*.mjs"
      - "tests/regression-v310.mjs"
      - "tests/regression-v310-premahayana-auction.mjs"
      - "tests/regression-v310-core-market.mjs"

permissions:
  contents: read

jobs:
  proof:
    name: no-recharge-${{ matrix.dao }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dao: sword
            seed: "31006701"
          - dao: flame
            seed: "31006702"
          - dao: body
            seed: "31006703"
          - dao: spirit
            seed: "31006704"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact V3.9 finalized baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
          node -e "const s=require('./PUBLIC_V39_STATUS.json');if(s.status!=='PASS'||s.game_version!=='3.9.0'||s.build!=='3901'||s.save_schema_version!==36||s.verified_commit!=='168f308cfed758e3385e2b9ead5a6e0d44d8a9c6')throw new Error('V3.9 baseline mismatch')"
      - name: Install headless dependency
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
      - name: Probe and build deterministic V3.10
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-v310-balance.mjs
          test -s /tmp/V310_AUDIT.json
          node tools/build-v310-balance-v3.cjs
          node --check src/game-v310.js
          first=$(sha256sum src/game-v310.js | awk '{print $1}')
          cp src/game-v310.js /tmp/game-v310-first.js
          node tools/build-v310-balance-v3.cjs >/tmp/v310-build-second.log
          second=$(sha256sum src/game-v310.js | awk '{print $1}')
          test "$first" = "$second"
          cmp -s /tmp/game-v310-first.js src/game-v310.js
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.argv[1])throw new Error('V3.10 report mismatch')" "$first"
      - name: Run V3.10 regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
      - name: Prepare gameplay-neutral headless copy
        shell: bash
        run: |
          set -euo pipefail
          original=$(sha256sum src/game-v310.js | awk '{print $1}')
          node tools/build-v310-fullrun-headless.cjs
          node --check src/game-v310.js
          node -e "const r=require('/tmp/V310_HEADLESS.json');if(r.status!=='PASS'||r.mode!=='fullrun-headless-ui-persistence-only'||r.replacements!==3||r.original_sha256!==process.argv[1])throw new Error('headless transform proof mismatch')" "$original"
      - name: Run legal fresh-save no-recharge ${{ matrix.dao }} full-run
        shell: bash
        env:
          V310_DAO_PATH: ${{ matrix.dao }}
          V310_FULLRUN_SEED: ${{ matrix.seed }}
          V310_FULLRUN_MAX_ACTIONS: "300000"
          V310_FULLRUN_MAX_FARM_ACTIONS: "2400"
        run: |
          set -euo pipefail
          set +e
          node tools/fullrun-v310-no-recharge-v51.mjs 2>&1 | tee V310_FULLRUN_LOG.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "V310_FULLRUN_PROCESS_EXIT=$rc"
            exit "$rc"
          fi
          node -e "const r=require('./V310_FULLRUN_RESULT.json');if(r.status!=='PASS'||r.daoPath!==process.argv[1]||r.final.realmIndex!==39||!r.final.ascended||!r.proof?.freshSave||!r.proof?.noRecharge||!r.proof?.legalGameplayCallsOnly||!r.proof?.ascensionComplete||r.forbiddenCalls?.length)throw new Error('four-path legal full-run proof incomplete')" "${{ matrix.dao }}"
      - name: Upload path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-no-recharge-fullrun-${{ matrix.dao }}
          path: |
            V310_FULLRUN_RESULT.json
            V310_FULLRUN_LOG.txt
          if-no-files-found: error
          retention-days: 7
      - name: Frozen V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"
