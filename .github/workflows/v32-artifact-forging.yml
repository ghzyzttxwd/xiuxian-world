name: V3.2 artifact forging system

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V32_ARTIFACT_FORGING.trigger"
      - "content/v32-equipment.cjs"
      - "tools/v32-artifact-runtime.txt"
      - "tools/build-v32-artifact-forging.cjs"
      - "tests/regression-v32.mjs"
      - ".github/workflows/v32-artifact-forging.yml"

permissions:
  contents: read

concurrency:
  group: taixuan-v32-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V3.1 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node -e "const b=require('./BUILD_V31_MANUAL_SPELL_EXPANSION.json');if(b.status!=='PASS'||b.gameplay_version!=='3.1.0'||b.build!=='3101'||b.source_sha256!=='492a2808ba69727ab6232e753ed25f388cc324cff0a8032a1ccc35f8549180e7'||b.save_schema_version!==28)throw new Error('V3.1 baseline mismatch')"
          test "$(sha256sum src/game-v31.js | awk '{print $1}')" = "492a2808ba69727ab6232e753ed25f388cc324cff0a8032a1ccc35f8549180e7"
          test "$(node -e "const s=require('./PUBLIC_V31_STATUS.json');process.stdout.write(s.status+' '+s.game_version+' '+s.build)")" = "PASS 3.1.0 3101"

      - name: Build deterministic V3.2 source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v32-artifact-forging.cjs
          node --check src/game-v32.js
          first=$(sha256sum src/game-v32.js | awk '{print $1}')
          node tools/build-v32-artifact-forging.cjs >/tmp/v32-build-second.log
          second=$(sha256sum src/game-v32.js | awk '{print $1}')
          test "$first" = "$second"
          node -e "const b=require('./BUILD_V32_ARTIFACT_FORGING.json');if(b.status!=='PASS'||b.gameplay_version!=='3.2.0'||b.build!=='3201'||b.milestone!=='artifact-forging-system'||b.save_schema_version!==29||b.content_registry_version!==3||b.counts.equipment!==60||b.counts.true_artifacts!==24||b.counts.active_artifacts<12||b.counts.build_passive_artifacts<12||b.counts.base_slots!==3||b.counts.artifact_slots!==4)throw new Error('V3.2 report mismatch')"
          test "$(node -e "const b=require('./BUILD_V32_ARTIFACT_FORGING.json');process.stdout.write(b.source_sha256)")" = "$first"
          grep -q "const VERSION='3.2.0'" src/game-v32.js
          grep -q 'const SAVE_SCHEMA_VERSION=29' src/game-v32.js
          grep -q 'V32_EQUIPMENT_CATALOG' src/game-v32.js
          grep -q 'makeNatalV32Artifact' src/game-v32.js
          grep -q 'repairV32Artifact' src/game-v32.js
          grep -q 'useV32ArtifactActive' src/game-v32.js

      - name: Run V2.9 through V3.2 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs
          node tests/regression-v32.mjs

      - name: Frozen V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"
