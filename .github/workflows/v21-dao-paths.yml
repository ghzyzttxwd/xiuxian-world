name: V2.1 dao paths validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V21_DAO_PATHS.trigger"
      - "tools/build-v21-dao-paths.cjs"
      - "tests/regression-v21.mjs"
      - ".github/workflows/v21-dao-paths.yml"
  push:
    branches: ["main"]
    paths: ["V21_DAO_PATHS.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v21-dao-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v21:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V2.0 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V20_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='2001'||s.game_version!=='2.0.0'||s.realm_count!==26||s.location_count!==12||s.route_count!==20||s.save_schema_version!==17) throw new Error('V2.0 baseline is not verified');
          JS
      - name: Build V2.1 source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v21-dao-paths.cjs
          node tools/build-v21-dao-paths.cjs
          node --check src/game-v21.js
          node - <<'JS'
          const b=require('./BUILD_V21_DAO_PATHS.json');
          if(b.status!=='PASS'||b.gameplay_version!=='2.1.0'||b.build!=='2101'||b.realm_count!==26||b.location_count!==12||b.route_count!==20||b.save_schema_version!==18) throw new Error('V2.1 build report mismatch');
          JS
          grep -q "const VERSION='2.1.0'" src/game-v21.js
          grep -q '青云剑道' src/game-v21.js
          grep -q '赤霞火道' src/game-v21.js
          grep -q '万兽炼体' src/game-v21.js
          grep -q '太虚神道' src/game-v21.js
          grep -q 'daoSignatureMultiplier' src/game-v21.js
      - name: Run V2.1 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v21.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v21:
    if: github.event_name == 'push'
    needs: validate-v21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v21-dao-paths.cjs
          node tools/build-v21-dao-paths.cjs
          node --check src/game-v21.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v21.mjs
      - name: Switch runtime shell to V2.1 build 2101
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V2.1 四大道途加载器 · build 2101
          (()=>{
            const fail=(e)=>{console.error(e);document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>'};
            try{window.__TAIXUAN_BUILD__={engineeringVersion:'2.1.0',gameplayVersion:'2.1.0',build:'2101',milestone:'dao-path-specialization',source:'src/game-v21.js',legacyPatchChain:false};document.title='太玄界 · 修仙大世界 V2.1';const script=document.createElement('script');script.src='./src/game-v21.js?v=2101';script.async=false;script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V2.1 直接源码运行时未完成初始化'))};script.onerror=()=>fail(new Error('V2.1 游戏核心加载失败：src/game-v21.js'));document.head.appendChild(script)}catch(e){fail(e)}})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V2.0','太玄界 · 修仙大世界 V2.1'),
            ('修仙大世界 · V2.0','修仙大世界 · V2.1'),
            ('V2.0 · 高阶修炼生态','V2.1 · 四大道途与流派分化'),
            ('./app.js?v=2001','./app.js?v=2101'),
            ('境界长线已贯通至化神后期。V2.0 开始补足高境界日常循环：高阶敌人与秘境产出高阶灵材，可用于金元丹、养魂丹和金丹至化神法宝；法宝属性与法术增幅直接进入战斗公式。','境界长线已贯通至化神后期，高阶丹药与法宝循环继续保留。V2.1 从结丹境开始开放四条主修道途：剑修、火法、体修、神识流拥有不同属性取舍与专属战斗绝学；转修需要额外悟道并折损道途熟练度。')]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v2.1.0-dao-paths-2101';
          const CORE=['./','./index.html?v=2101','./style.css','./app.js?v=2101','./src/game-v21.js?v=2101','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=2101'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V2.1.0 · 四大道途与流派分化（build 2101）**

          正式运行结构：`index.html -> app.js -> src/game-v21.js`。浏览器直接加载可读源码，不使用历史补丁链或 `eval`。

          ## V2.1
          - 保留凡人至化神后期 26 境界、12 地域、20 路线以及 V2.0 高阶丹药/法宝循环；
          - 结丹境起可正式选择四条主修道途：青云剑道、赤霞火道、万兽炼体、太虚神道；
          - 四条道途拥有真实属性取舍：剑修重近战与御剑爆发，火法法术最高但更脆，体修气血/减伤最强但法术削弱，神识流灵力与控制最强但肉身较弱；
          - 每条道途拥有专属功法与绝学：御剑连斩、焚脉真火、崩山式、摄魂印；
          - 专属绝学直接进入实际战斗循环，包括连斩、持续灼烧、炼体护架、神魂封压；
          - 道途熟练度由专属绝学和实战增长，并直接提高招牌绝学倍率；
          - 主修允许转修，但额外消耗悟道、折损一半道途熟练度；旧技能保留，不删除旧档内容；
          - 在与当前道途匹配的秘境通关会触发道途共鸣，额外提高熟练度；
          - 青云剑道与宗门贡献挂钩，其他三道分别绑定赤霞谷、万兽山脉、古河遗迹/玄阴禁地，使地图与传承来源产生实际区别。

          ## 存档
          V2.1 使用 `saveSchemaVersion = 18`，新增 `daoPath`、`daoMastery`、`daoSwitches`。V2.0 schema17 自动迁移；未来 schema19+ 拒绝覆盖。

          V6 App 图标保持固定 SHA-256，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v21.js?v=2101' app.js
          grep -q 'src/game-v21.js?v=2101' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'eval' app.js
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v21.mjs
      - name: Commit V2.1 runtime to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v21.js BUILD_V21_DAO_PATHS.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then git commit -m 'feat: V2.1 dao path specialization [skip ci]'; git push origin HEAD:main; fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V2.1 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v21.js /tmp/pages/src/game-v21.js
          cp BUILD_V21_DAO_PATHS.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v21.js BUILD_V21_DAO_PATHS.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then git commit -m "feat: publish V2.1 dao paths ${RELEASE_SHA} [skip ci]"; git push origin HEAD:gh-pages; fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=2101&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=2101&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v21.js?v=2101&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=2101&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" = 1 ] && grep -q "src/game-v21.js?v=2101" /tmp/public-app.js && grep -q "const VERSION='2.1.0'" /tmp/public-game.js && grep -q '青云剑道' /tmp/public-game.js; then break; fi
            if [ "$i" = 60 ]; then echo 'public assets did not converge to V2.1' >&2; exit 1; fi
            sleep 2
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          test "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512"
          test "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192"
          node - <<'JS'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/public-manifest.json','utf8'));
          if(m.display!=='standalone')throw new Error('manifest display is not standalone');
          if(!Array.isArray(m.icons)||!m.icons.some(x=>String(x.src).includes('icon-v6-192.png'))||!m.icons.some(x=>String(x.src).includes('icon-v6-512.png')))throw new Error('manifest V6 icons missing');
          JS
          LOCAL_SHA="$(sha256sum src/game-v21.js | awk '{print $1}')"
          PUBLIC_SHA="$(sha256sum /tmp/public-game.js | awk '{print $1}')"
          test "$LOCAL_SHA" = "$PUBLIC_SHA"
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v21.mjs
      - name: Record V2.1 public PASS on gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum src/game-v21.js | awk '{print $1}')"
          cat > /tmp/status.json <<JSON
          {"status":"PASS","game_version":"2.1.0","build":"2101","milestone":"dao-path-specialization","verified_commit":"${RELEASE_SHA}","source_sha256":"${SHA}","realm_count":26,"location_count":12,"route_count":20,"save_schema_version":18,"stage":"public-pass","checks":["V2.0 public baseline PASS","V2.1 source build","four differentiated dao paths","path-exclusive signature combat","path switching cost/mastery loss","secret realm path resonance","V2.0 system regression","schema 17 to 18 migration","future-save overwrite guard","public asset HTTP 200","public source hash equality","public headless regression","standalone manifest","V6 icon hash regression"]}
          JSON
          cd /tmp/pages
          cp /tmp/status.json PUBLIC_V21_STATUS.json
          git add PUBLIC_V21_STATUS.json
          git commit -m 'chore: record V2.1 public PASS [skip ci]'
          git push origin HEAD:gh-pages
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V21_STATUS.json'
          for i in $(seq 1 60); do
            if curl -fsSL "${BASE}?x=${RELEASE_SHA}-${i}" -o /tmp/public-status.json && node -e "const s=require('/tmp/public-status.json');if(s.status!=='PASS'||s.stage!=='public-pass'||s.verified_commit!=='${RELEASE_SHA}'||s.build!=='2101')process.exit(1)"; then exit 0; fi
            sleep 2
          done
          echo 'PUBLIC_V21_STATUS did not become visible' >&2
          exit 1
      - name: Sync verified public PASS to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/status.json PUBLIC_V21_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V21_STATUS.json
          git commit -m 'chore: sync verified V2.1 public PASS to main [skip ci]'
          git push origin HEAD:main
