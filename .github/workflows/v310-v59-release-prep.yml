name: V3.10 V59 non-publishing release prep

on:
  push:
    branches: ["v310-release-prep-nonpublish"]
    paths:
      - ".github/workflows/v310-v59-release-prep.yml"
      - "tools/aggregate-v310-fullrun-gate.mjs"

permissions:
  contents: read

concurrency:
  group: v310-v59-release-prep-${{ github.ref }}
  cancel-in-progress: true

env:
  V39_BASE_SHA: 62db848091ce7686c85357a8c963820a9d27f24c
  V59_HEAD: 96a0aa7be41de1877dbc13b9a8fa8c4eeeaed63c

jobs:
  validate-v59-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable base and exact V59 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v310-natal-origin-id-fix
          test "$(git rev-parse origin/main)" = "$V39_BASE_SHA"
          git cat-file -e "$V59_HEAD^{commit}"
          git merge-base --is-ancestor "$V59_HEAD" origin/v310-natal-origin-id-fix
          rm -rf /tmp/v310-v59
          git worktree add --detach /tmp/v310-v59 "$V59_HEAD"
          test "$(git -C /tmp/v310-v59 rev-parse HEAD)" = "$V59_HEAD"

      - name: Rebuild deterministic V59 source twice
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v310-v59
          node --check tools/build-v310-balance-v4.cjs
          node --check tools/build-v310-balance-v5.cjs
          node tools/build-v310-balance-v5.cjs
          node --check src/game-v310.js
          first=$(sha256sum src/game-v310.js | awk '{print $1}')
          cp src/game-v310.js /tmp/v310-v59-first.js
          node tools/build-v310-balance-v5.cjs >/tmp/v310-v59-second.log
          second=$(sha256sum src/game-v310.js | awk '{print $1}')
          test "$first" = "$second"
          cmp -s src/game-v310.js /tmp/v310-v59-first.js
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.argv[1]||!b.changes?.some(x=>String(x).includes('natal-artifact combat scaling'))||!b.changes?.some(x=>String(x).includes('万劫真髓 now has a normal endgame sink')))throw new Error('V59 deterministic report mismatch')" "$first"
          echo "$first" > /tmp/V310_V59_SOURCE_SHA

      - name: Run V59 regression surface
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v310-v59
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tools/build-v310-balance-v5.cjs >/tmp/v310-v59-resource-build.log
          node tests/regression-v310-resource-utility.mjs
          node -e "const a=require('./V310_RESOURCE_UTILITY_AUDIT.json');if(a.status!=='PASS'||a.unused?.length||a.highUnused?.length||a.namedMaterials!==86||a.highTierMaterials!==46)throw new Error('V59 resource utility gate mismatch')"

      - name: Verify release-prep aggregate gate matches V59 candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/aggregate-v310-fullrun-gate.mjs
          node --check /tmp/v310-v59/tools/aggregate-v310-fullrun-gate.mjs
          cmp -s tools/aggregate-v310-fullrun-gate.mjs /tmp/v310-v59/tools/aggregate-v310-fullrun-gate.mjs

      - name: Upload non-publishing V59 prep evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V310_V59_PREP
          cp /tmp/v310-v59/BUILD_V310_BALANCE.json V310_V59_PREP/
          cp /tmp/v310-v59/V310_RESOURCE_UTILITY_AUDIT.json V310_V59_PREP/
          cp /tmp/V310_V59_SOURCE_SHA V310_V59_PREP/SOURCE_SHA.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v310-v59-release-prep
          path: V310_V59_PREP
          if-no-files-found: error
          retention-days: 14
