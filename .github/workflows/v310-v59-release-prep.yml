name: V3.10 V59 non-publishing release prep

on:
  push:
    branches: ["v310-release-prep-nonpublish"]
    paths:
      - ".github/workflows/v310-v59-release-prep.yml"
      - "tools/aggregate-v310-fullrun-gate.mjs"
      - "tools/verify-v310-v60-evidence.mjs"
      - "tools/release-v310-assets.cjs"
      - "tools/verify-v310-public.sh"
      - "tests/regression-v310-v60-tribulation-gear.mjs"

permissions:
  contents: read

concurrency:
  group: v310-v59-release-prep-${{ github.ref }}
  cancel-in-progress: true

env:
  V39_BASE_SHA: 62db848091ce7686c85357a8c963820a9d27f24c
  V59_HEAD: 96a0aa7be41de1877dbc13b9a8fa8c4eeeaed63c
  V59_SOURCE_SHA: aa78a4d9d1983bb59832ba83ead8b39bd7c2e20316ca41e84d74df9ae0393e71

jobs:
  validate-v59-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable base and exact V59 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v310-natal-origin-id-fix
          test "$(git rev-parse origin/main)" = "$V39_BASE_SHA"
          git cat-file -e "$V59_HEAD^{commit}"
          git merge-base --is-ancestor "$V59_HEAD" origin/v310-natal-origin-id-fix
          rm -rf /tmp/v310-v59
          git worktree add --detach /tmp/v310-v59 "$V59_HEAD"
          test "$(git -C /tmp/v310-v59 rev-parse HEAD)" = "$V59_HEAD"

      - name: Rebuild deterministic V59 source twice
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v310-v59
          node --check tools/build-v310-balance-v4.cjs
          node --check tools/build-v310-balance-v5.cjs
          node tools/build-v310-balance-v5.cjs
          node --check src/game-v310.js
          first=$(sha256sum src/game-v310.js | awk '{print $1}')
          test "$first" = "$V59_SOURCE_SHA"
          cp src/game-v310.js /tmp/v310-v59-first.js
          node tools/build-v310-balance-v5.cjs >/tmp/v310-v59-second.log
          second=$(sha256sum src/game-v310.js | awk '{print $1}')
          test "$first" = "$second"
          cmp -s src/game-v310.js /tmp/v310-v59-first.js
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.argv[1]||!b.changes?.some(x=>String(x).includes('natal-artifact combat scaling'))||!b.changes?.some(x=>String(x).includes('万劫真髓 now has a normal endgame sink')))throw new Error('V59 deterministic report mismatch')" "$first"
          echo "$first" > /tmp/V310_V59_SOURCE_SHA

      - name: Run V59 regression surface
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v310-v59
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tools/build-v310-balance-v5.cjs >/tmp/v310-v59-resource-build.log
          node tests/regression-v310-resource-utility.mjs
          node -e "const a=require('./V310_RESOURCE_UTILITY_AUDIT.json');if(a.status!=='PASS'||a.unused?.length||a.highUnused?.length||a.namedMaterials!==86||a.highTierMaterials!==46)throw new Error('V59 resource utility gate mismatch')"
          cp "$GITHUB_WORKSPACE/tests/regression-v310-v60-tribulation-gear.mjs" tests/regression-v310-v60-tribulation-gear.mjs
          node --check tests/regression-v310-v60-tribulation-gear.mjs
          node tests/regression-v310-v60-tribulation-gear.mjs

      - name: Verify hardened release aggregate gate
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/aggregate-v310-fullrun-gate.mjs
          node --check tools/verify-v310-v60-evidence.mjs
          grep -q 'uniqueFastestByRealm' tools/aggregate-v310-fullrun-gate.mjs
          grep -q 'dominanceHardLimit=6' tools/aggregate-v310-fullrun-gate.mjs
          grep -q 'route dominance detected' tools/aggregate-v310-fullrun-gate.mjs
          grep -q 'Named-material utility is independently fail-closed' tools/aggregate-v310-fullrun-gate.mjs
          grep -q 'actionSpreadRatio>3' tools/aggregate-v310-fullrun-gate.mjs
          grep -q 'V310_FULLRUN_V60_TRIBULATION_GEAR' tools/verify-v310-v60-evidence.mjs
          grep -q 'item-v39-thunder-umbrella' tools/verify-v310-v60-evidence.mjs
          grep -q 'item-v39-tribulation-array-disc' tools/verify-v310-v60-evidence.mjs

      - name: Validate release transform against exact V59 source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/release-v310-assets.cjs
          bash -n tools/verify-v310-public.sh
          mkdir -p src
          cp /tmp/v310-v59/src/game-v310.js src/game-v310.js
          cp /tmp/v310-v59/BUILD_V310_BALANCE.json BUILD_V310_BALANCE.json
          test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$V59_SOURCE_SHA"
          node tools/release-v310-assets.cjs
          node --check app.js
          grep -q "gameplayVersion:'3.10.0'" app.js
          grep -q 'src/game-v310.js?v=31001' app.js
          grep -q 'V3.10 · 无充值全流程总平衡篇' index.html
          grep -q 'taixuan-v3.10.0-no-recharge-full-run-balance-31001' sw.js
          ! grep -q 'eval' app.js
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

      - name: Upload non-publishing V59 prep evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V310_V59_PREP
          cp /tmp/v310-v59/BUILD_V310_BALANCE.json V310_V59_PREP/
          cp /tmp/v310-v59/V310_RESOURCE_UTILITY_AUDIT.json V310_V59_PREP/
          cp /tmp/V310_V59_SOURCE_SHA V310_V59_PREP/SOURCE_SHA.txt
          cp app.js index.html sw.js V310_V59_PREP/

      - uses: actions/upload-artifact@v4
        with:
          name: v310-v59-release-prep
          path: V310_V59_PREP
          if-no-files-found: error
          retention-days: 14
