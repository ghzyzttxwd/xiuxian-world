name: Phase8 R10I Breakthrough Wiring

on:
  push:
    branches: ["phase8-r10-growth-diagnostic"]
    paths: ["PHASE8_R10I_BREAK.trigger"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: phase8-r10-growth-diagnostic, fetch-depth: 0}
      - name: Extract breakthrough functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('src/game-v39.js').read_text();out={}
          for name in ['breakthroughChance','attemptBreakthrough','realm']:
            m=re.search(r'function\s+'+name+r'\s*\([^)]*\)\s*\{',s)
            if not m: out[name]=None;continue
            b=s.find('{',m.start());d=0;j=b
            while j<len(s):
              if s[j]=='{':d+=1
              elif s[j]=='}':
                d-=1
                if d==0:j+=1;break
              j+=1
            out[name]=s[m.start():j]
          Path('PHASE8_R10I_BREAKTHROUGH_WIRING.json').write_text(json.dumps({'phase':'8-round10i-breakthrough-wiring','coreBuild':3903,'functions':out},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit inspect
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE8_R10I_BREAKTHROUGH_WIRING.json
          git commit -m 'test: record phase8 r10i breakthrough wiring [skip ci]'
          git push origin HEAD:phase8-r10-growth-diagnostic
