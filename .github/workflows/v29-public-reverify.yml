name: V2.9 public terminal reverify

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V29_PUBLIC_REVERIFY.trigger"
      - ".github/workflows/v29-public-reverify.yml"
  push:
    branches: ["main"]
    paths: ["V29_PUBLIC_REVERIFY.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v29-public-reverify-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact V2.9 repository baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const b=require('./BUILD_V29_PAST_LIFE_BONDS.json');
          if(b.status!=='PASS'||b.gameplay_version!=='2.9.0'||b.build!=='2901'||b.milestone!=='past-life-bonds'||b.source_sha256!=='b5dd8a4b4842beea0bbce2117312a1c02e1030642141a0c337104c1e93693c99'||b.save_schema_version!==26) throw new Error('V2.9 build baseline mismatch');
          JS
          grep -q "gameplayVersion:'2.9.0'" app.js
          grep -q "src/game-v29.js?v=2901" app.js
          grep -q "const VERSION='2.9.0'" src/game-v29.js
          grep -q 'const SAVE_SCHEMA_VERSION=26' src/game-v29.js
          test "$(sha256sum src/game-v29.js | awk '{print $1}')" = "b5dd8a4b4842beea0bbce2117312a1c02e1030642141a0c337104c1e93693c99"
          ! grep -q 'eval' app.js
          ! grep -q 'bundle2' app.js

      - name: Re-run exact V2.9 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node --check src/game-v29.js
          node tests/regression-v29.mjs

      - name: V6 frozen icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  public-reverify:
    if: github.event_name == 'push'
    needs: validate-reverify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main trigger state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconfirm local runtime before public verification
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const b=require('./BUILD_V29_PAST_LIFE_BONDS.json');
          if(b.source_sha256!=='b5dd8a4b4842beea0bbce2117312a1c02e1030642141a0c337104c1e93693c99'||b.save_schema_version!==26) throw new Error('local V2.9 build report drift');
          JS
          test "$(sha256sum src/game-v29.js | awk '{print $1}')" = "b5dd8a4b4842beea0bbce2117312a1c02e1030642141a0c337104c1e93693c99"
          grep -q "src/game-v29.js?v=2901" app.js
          grep -q 'V2.9 · 前尘旧缘' index.html
          grep -q 'taixuan-v2.9.0-past-life-bonds-2901' sw.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs

      - name: Prepare gh-pages worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages

      - name: Diagnose and verify actual GitHub Pages
        id: public
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -u
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT_GAME='b5dd8a4b4842beea0bbce2117312a1c02e1030642141a0c337104c1e93693c99'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          public_ok=false
          : > /tmp/V29_PUBLIC_DIAGNOSTIC.txt
          for i in $(seq 1 24); do
            index_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}?v=2901&diag=${BASE_SHA}-${i}" -o /tmp/public-index.html 2>/tmp/curl-index.err || echo 000)
            app_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}app.js?v=2901&diag=${BASE_SHA}-${i}" -o /tmp/public-app.js 2>/tmp/curl-app.err || echo 000)
            game_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}src/game-v29.js?v=2901&diag=${BASE_SHA}-${i}" -o /tmp/public-game.js 2>/tmp/curl-game.err || echo 000)
            sw_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}sw.js?v=2901&diag=${BASE_SHA}-${i}" -o /tmp/public-sw.js 2>/tmp/curl-sw.err || echo 000)
            manifest_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}manifest-v6.webmanifest?v=6&diag=${BASE_SHA}-${i}" -o /tmp/public-manifest.json 2>/tmp/curl-manifest.err || echo 000)
            icon512_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}icon-v6-512.png?diag=${BASE_SHA}-${i}" -o /tmp/public-icon512.png 2>/tmp/curl-icon512.err || echo 000)
            icon192_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -w '%{http_code}' "${BASE}icon-v6-192.png?diag=${BASE_SHA}-${i}" -o /tmp/public-icon192.png 2>/tmp/curl-icon192.err || echo 000)

            index_v29=0; app_v29=0; game_v29=0; sw_v29=0; game_sha='missing'; game_sha_ok=0; icon512_sha='missing'; icon512_ok=0; icon192_sha='missing'; icon192_ok=0; manifest_ok=0; regression_ok=0
            [ -f /tmp/public-index.html ] && grep -q 'V2.9' /tmp/public-index.html && index_v29=1
            [ -f /tmp/public-app.js ] && grep -q 'src/game-v29.js?v=2901' /tmp/public-app.js && app_v29=1
            [ -f /tmp/public-game.js ] && grep -q "const VERSION='2.9.0'" /tmp/public-game.js && game_v29=1
            [ -f /tmp/public-sw.js ] && grep -q 'taixuan-v2.9.0-past-life-bonds-2901' /tmp/public-sw.js && sw_v29=1
            if [ -f /tmp/public-game.js ]; then game_sha=$(sha256sum /tmp/public-game.js | awk '{print $1}'); [ "$game_sha" = "$EXPECT_GAME" ] && game_sha_ok=1; fi
            if [ -f /tmp/public-icon512.png ]; then icon512_sha=$(sha256sum /tmp/public-icon512.png | awk '{print $1}'); [ "$icon512_sha" = "$EXPECT512" ] && icon512_ok=1; fi
            if [ -f /tmp/public-icon192.png ]; then icon192_sha=$(sha256sum /tmp/public-icon192.png | awk '{print $1}'); [ "$icon192_sha" = "$EXPECT192" ] && icon192_ok=1; fi
            if [ -f /tmp/public-manifest.json ]; then node -e "const m=require('/tmp/public-manifest.json');if(m.display!=='standalone'||!Array.isArray(m.icons)||m.icons.length<2)process.exit(1)" >/dev/null 2>&1 && manifest_ok=1; fi
            if [ "$index_v29" = 1 ] && [ "$game_v29" = 1 ] && [ "$game_sha_ok" = 1 ]; then INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v29.mjs >/tmp/public-regression.log 2>&1 && regression_ok=1; fi

            cat > /tmp/V29_PUBLIC_DIAGNOSTIC.txt <<EOF
status=$([ "$index_code" = 200 ] && [ "$app_code" = 200 ] && [ "$game_code" = 200 ] && [ "$sw_code" = 200 ] && [ "$manifest_code" = 200 ] && [ "$icon512_code" = 200 ] && [ "$icon192_code" = 200 ] && [ "$index_v29" = 1 ] && [ "$app_v29" = 1 ] && [ "$game_v29" = 1 ] && [ "$sw_v29" = 1 ] && [ "$game_sha_ok" = 1 ] && [ "$icon512_ok" = 1 ] && [ "$icon192_ok" = 1 ] && [ "$manifest_ok" = 1 ] && [ "$regression_ok" = 1 ] && echo PASS || echo FAIL)
attempt=$i
base_sha=$BASE_SHA
index_http=$index_code
app_http=$app_code
game_http=$game_code
sw_http=$sw_code
manifest_http=$manifest_code
icon512_http=$icon512_code
icon192_http=$icon192_code
index_v29=$index_v29
app_v29=$app_v29
game_v29=$game_v29
sw_v29=$sw_v29
game_sha=$game_sha
game_sha_expected=$EXPECT_GAME
game_sha_ok=$game_sha_ok
icon512_sha=$icon512_sha
icon512_ok=$icon512_ok
icon192_sha=$icon192_sha
icon192_ok=$icon192_ok
manifest_ok=$manifest_ok
regression_ok=$regression_ok
EOF
            if [ "$index_code" = 200 ] && [ "$app_code" = 200 ] && [ "$game_code" = 200 ] && [ "$sw_code" = 200 ] && [ "$manifest_code" = 200 ] && [ "$icon512_code" = 200 ] && [ "$icon192_code" = 200 ] && [ "$index_v29" = 1 ] && [ "$app_v29" = 1 ] && [ "$game_v29" = 1 ] && [ "$sw_v29" = 1 ] && [ "$game_sha_ok" = 1 ] && [ "$icon512_ok" = 1 ] && [ "$icon192_ok" = 1 ] && [ "$manifest_ok" = 1 ] && [ "$regression_ok" = 1 ]; then
              public_ok=true
              break
            fi
            sleep 5
          done
          cat /tmp/V29_PUBLIC_DIAGNOSTIC.txt
          echo "public_ok=$public_ok" >> "$GITHUB_OUTPUT"

      - name: Record terminal diagnostic when public verification fails
        if: steps.public.outputs.public_ok != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp /tmp/V29_PUBLIC_DIAGNOSTIC.txt /tmp/pages/PUBLIC_V29_DIAGNOSTIC.txt
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V29_DIAGNOSTIC.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: record V2.9 public diagnostic ${BASE_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Fail explicitly if terminal verification did not pass
        if: steps.public.outputs.public_ok != 'true'
        shell: bash
        run: exit 1

      - name: Record V2.9 public PASS on gh-pages
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -f /tmp/pages/PUBLIC_V29_DIAGNOSTIC.txt
          node - "$BASE_SHA" <<'JS'
          const fs=require('fs');const base=process.argv[2];const s={status:'PASS',game_version:'2.9.0',build:'2901',milestone:'past-life-bonds',verified_commit:base,source_sha256:'b5dd8a4b4842beea0bbce2117312a1c02e1030642141a0c337104c1e93693c99',realm_count:26,location_count:12,route_count:20,save_schema_version:26,stage:'public-pass',checks:['PR23 V2.9 validation PASS and closed unmerged','V2.9 runtime already published to gh-pages','exact repository source hash equality','actual GitHub Pages HTTP 200 for all release assets','public V2.9 version markers','public source SHA equality','public V2.9 headless regression','standalone manifest','V6 icon hash regression','cross-life bond regression','old favor debt and pending request reset']};fs.writeFileSync('/tmp/pages/PUBLIC_V29_STATUS.json',JSON.stringify(s)+'\n');
          JS
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A PUBLIC_V29_STATUS.json PUBLIC_V29_DIAGNOSTIC.txt
          git commit -m "chore: record clean V2.9 public PASS ${BASE_SHA} [skip ci]"
          git push origin HEAD:gh-pages

      - name: Verify public PASS is actually reachable
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          visible=0
          for i in $(seq 1 60); do
            if curl -fsSL "${BASE}PUBLIC_V29_STATUS.json?verify=${BASE_SHA}-${i}" -o /tmp/live-v29-status.json; then
              node - "$BASE_SHA" <<'JS'
              const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/live-v29-status.json','utf8'));const base=process.argv[2];if(s.status!=='PASS'||s.stage!=='public-pass'||s.game_version!=='2.9.0'||s.build!=='2901'||s.save_schema_version!==26||s.verified_commit!==base)process.exit(1);
              JS
              if cmp -s /tmp/live-v29-status.json /tmp/pages/PUBLIC_V29_STATUS.json; then visible=1; break; fi
            fi
            sleep 5
          done
          test "$visible" = 1

      - name: Sync exact public PASS to main
        if: steps.public.outputs.public_ok == 'true'
        id: final_main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/pages/PUBLIC_V29_STATUS.json PUBLIC_V29_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V29_STATUS.json
          git commit -m 'chore: sync clean verified V2.9 public PASS to main [skip ci]'
          git push origin HEAD:main
          echo "final_main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Final trigger-to-main compare
        if: steps.public.outputs.public_ok == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
          FINAL_MAIN_SHA: ${{ steps.final_main.outputs.final_main_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$FINAL_MAIN_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'PUBLIC_V29_STATUS.json'
          node - "$BASE_SHA" <<'JS'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync('PUBLIC_V29_STATUS.json','utf8'));if(s.verified_commit!==process.argv[2]||s.status!=='PASS'||s.stage!=='public-pass')throw new Error('final main PASS mismatch');
          JS
