name: V3.10 highchain NON-PROOF diagnostic

concurrency:
  group: v310-highchain-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Trigger revision 7: validate v19 tribulation-prep return travel.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/fullrun-v310-no-recharge-v17.mjs"
      - "tools/fullrun-v310-no-recharge-v18.mjs"
      - "tools/fullrun-v310-no-recharge-v19.mjs"
      - "tools/diagnose-v310-highchain.mjs"
      - "tools/diagnose-v310-highchain-v19.mjs"
      - "tools/build-v310-balance-v2.cjs"
      - "tests/regression-v310-premahayana-auction.mjs"
      - ".github/workflows/v310-highchain-diagnostic.yml"

permissions:
  contents: read

jobs:
  highchain-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen V3.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
      - name: Prepare current V3.10 candidate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tools/build-v310-balance-v2.cjs
          node --check src/game-v310.js
          candidate=$(sha256sum src/game-v310.js | awk '{print $1}')
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.source_sha256!==process.argv[1])throw new Error('candidate report mismatch')" "$candidate"
          echo "V310_DIAGNOSTIC_CANDIDATE_SHA=$candidate"
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tools/build-v310-fullrun-headless.cjs
          node --check src/game-v310.js
      - name: Run realm34+ diagnostic only
        shell: bash
        env:
          V310_DAO_PATH: sword
          V310_FULLRUN_SEED: "31006701"
          V310_FULLRUN_MAX_ACTIONS: "120000"
          V310_FULLRUN_MAX_FARM_ACTIONS: "2400"
        run: |
          set -euo pipefail
          node tools/diagnose-v310-highchain-v19.mjs
          node -e "const r=require('./V310_FULLRUN_RESULT.json');if(!r.nonProofDiagnostic)throw new Error('diagnostic result missing NON-PROOF marker');if(r.proof?.freshSave!==false||!r.proof?.diagnosticOnly)throw new Error('diagnostic attempted to masquerade as full-run proof')"
      - name: Upload NON-PROOF highchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-highchain-non-proof-diagnostic
          path: V310_FULLRUN_RESULT.json
          if-no-files-found: ignore
          retention-days: 7
