name: Phase8 R10C Growth Diagnostic

on:
  push:
    branches: ["phase8-r10-growth-diagnostic"]
    paths: ["PHASE8_R10C_GROWTH.trigger"]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-r10-growth-diagnostic
          fetch-depth: 0

      - name: Extract manual formula effects without acquisition cost
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src/game-v39.js|awk '{print $1}')" = '1dc5860e93aab32d9dd14fe6fda1d34bd5004ab97198f57c73231a0bb5d5756c'
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs'),{JSDOM}=require('jsdom');const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]+src=["'][^"']*app\.js[^"']*["'][^>]*><\/script>/i,'');const source=fs.readFileSync('src/game-v39.js','utf8');
          function make(name){const d=new JSDOM(html,{url:'https://growth-diag-c.test/',runScripts:'outside-only',pretendToBeVisual:true});const w=d.window;w.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});w.scrollTo=()=>{};w.console={log(){},warn(){},error(){}};w.eval(source);const a=w.__TAIXUAN_TEST__;a.newGame(name);return a}
          function n(v){if(typeof v==='number')return v;if(v&&typeof v==='object'){for(const k of ['gain','progress','cultivation','value','total'])if(typeof v[k]==='number')return v[k]}return NaN}
          function avg(a,days,samples){let sum=0,c=0;for(let i=0;i<samples;i++){const v=n(a.cultivationGainForDays(days));if(Number.isFinite(v)){sum+=v;c++}}return c?Number((sum/c).toFixed(2)):null}
          function forceManual(a,id,name){const p=a.getState().player;p.manual=name;p.manualProf=0;if(Array.isArray(p.manualLibraryIds)&&id&&!p.manualLibraryIds.includes(id))p.manualLibraryIds.push(id);return {manual:p.manual,manualProf:p.manualProf,effects:typeof a.v31CurrentManualEffects==='function'?a.v31CurrentManualEffects():null,breakthroughBonus:typeof a.v31BreakthroughBonus==='function'?a.v31BreakthroughBonus():null}}
          function scenario(id,name){const a=make('诊断C-'+name),setup=forceManual(a,id,name),curve=a.realmBalance(),rows=[];for(let i=0;i<=13;i++){a.v39SetPlayerForTest({realmIndex:i,location:'青石村'});const p=a.getState().player;p.progress=0;p.manual=name;p.manualProf=0;const g1=avg(a,1,240),g7=avg(a,7,100),g30=avg(a,30,50),need=Number(curve[i]?.need)||null;p.progress=need;let chance=null;try{chance=a.breakthroughChance()}catch{}rows.push({index:i,name:curve[i]?.name||null,need,manual:p.manual,meanGain1:g1,meanGain7:g7,meanGain30:g30,theoreticalPureCultivationDays:g1&&need?Number((need/g1).toFixed(1)):null,breakthroughChance:chance})}return {id,name,setup,rows}}
          const report={phase:'8-round10c-growth-diagnostic',gameplay:'3.9.0',coreBuild:3903,sourceSha256:'1dc5860e93aab32d9dd14fe6fda1d34bd5004ab97198f57c73231a0bb5d5756c',schema:36,diagnosticOverride:'manual acquisition prerequisites bypassed; core manual effects unchanged',scenarios:[scenario(null,'基础吐纳诀'),scenario('manual-five-elements-return','五元归息功'),scenario('manual-mystic-water','玄水纳灵篇')]};fs.writeFileSync('PHASE8_R10C_GROWTH_DIAGNOSTIC.json',JSON.stringify(report,null,2)+'\n');console.log('R10C',JSON.stringify(report.scenarios.map(s=>({name:s.name,setup:s.setup,qi:s.rows.slice(1,10).map(r=>({i:r.index,need:r.need,g:r.meanGain1,days:r.theoreticalPureCultivationDays,chance:r.breakthroughChance}))}))));
          NODE
          node - <<'NODE'
          const x=require('./PHASE8_R10C_GROWTH_DIAGNOSTIC.json');if(x.scenarios.some(s=>s.rows.length!==14))throw Error('shape');for(const s of x.scenarios)if(s.rows.some(r=>r.manual!==s.name))throw Error('manual injection failed '+s.name);console.log('R10C_OK')
          NODE

      - name: Commit corrected formula diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE8_R10C_GROWTH_DIAGNOSTIC.json
          git commit -m 'test: record phase8 r10c manual formula diagnostic [skip ci]'
          git push origin HEAD:phase8-r10-growth-diagnostic
