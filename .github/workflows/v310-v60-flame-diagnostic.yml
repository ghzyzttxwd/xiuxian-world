name: V3.10 V60 flame tribulation diagnostic

on:
  push:
    branches: ["v310-v60-tribulation-strategy"]
    paths:
      - ".github/workflows/v310-v60-flame-diagnostic.yml"
      - "tools/fullrun-v310-no-recharge-v60.mjs"

permissions:
  contents: read

concurrency:
  group: v310-v60-flame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flame:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable V3.9 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "62db848091ce7686c85357a8c963820a9d27f24c"
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
      - name: Install headless dependency
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
      - name: Build deterministic V59 gameplay source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v310-balance-v5.cjs
          node --check src/game-v310.js
          sha=$(sha256sum src/game-v310.js | awk '{print $1}')
          node tools/build-v310-balance-v5.cjs >/tmp/v60-build-second.log
          test "$sha" = "$(sha256sum src/game-v310.js | awk '{print $1}')"
          node tests/regression-v310.mjs
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tools/build-v310-balance-v5.cjs >/tmp/v60-build-resource.log
          node tests/regression-v310-resource-utility.mjs
          echo "V310_V60_SOURCE_SHA=$sha"
      - name: Prepare gameplay-neutral headless copy
        shell: bash
        run: |
          set -euo pipefail
          original=$(sha256sum src/game-v310.js | awk '{print $1}')
          node tools/build-v310-fullrun-headless.cjs
          node --check src/game-v310.js
          node -e "const r=require('/tmp/V310_HEADLESS.json');if(r.status!=='PASS'||r.mode!=='fullrun-headless-ui-persistence-only'||r.replacements!==3||r.original_sha256!==process.argv[1])throw new Error('headless transform mismatch')" "$original"
      - name: Run legal flame V60 diagnostic
        shell: bash
        env:
          V310_DAO_PATH: flame
          V310_FULLRUN_SEED: "31006702"
          V310_FULLRUN_MAX_ACTIONS: "300000"
          V310_FULLRUN_MAX_FARM_ACTIONS: "2400"
        run: |
          set -euo pipefail
          set +e
          node tools/fullrun-v310-no-recharge-v60.mjs 2>&1 | tee V310_FULLRUN_LOG.txt
          rc=${PIPESTATUS[0]}
          set -e
          grep -q 'V310_FULLRUN_V60_FINAL_RUNNER_PASS' V310_FULLRUN_LOG.txt
          grep -q 'V310_FULLRUN_V60_TRIBULATION_GEAR' V310_FULLRUN_LOG.txt || true
          grep -q 'V310_FULLRUN_V57_GEAR_CALL' V310_FULLRUN_LOG.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -q 'V310_FULLRUN_V60_TRIBULATION_GEAR' V310_FULLRUN_LOG.txt
          node -e "const r=require('./V310_FULLRUN_RESULT.json');if(r.status!=='PASS'||r.daoPath!=='flame'||r.final.realmIndex!==39||!r.final.ascended||!r.proof?.freshSave||!r.proof?.noRecharge||!r.proof?.legalGameplayCallsOnly||r.forbiddenCalls?.length)throw new Error('V60 flame proof incomplete')"
      - name: Upload V60 flame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-v60-flame-diagnostic
          path: |
            V310_FULLRUN_RESULT.json
            V310_FULLRUN_LOG.txt
            BUILD_V310_BALANCE.json
          if-no-files-found: ignore
          retention-days: 7
