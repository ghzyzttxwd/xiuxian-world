name: V2.6 sect life validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V26_SECT_LIFE.trigger"
      - "tools/build-v26-sect-life.cjs"
      - "tools/v26-sect-life-block.txt"
      - "tests/regression-v26.mjs"
      - ".github/workflows/v26-sect-life.yml"
  push:
    branches: ["main"]
    paths: ["V26_SECT_LIFE.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v26-sect-life-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V2.5 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V25_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='2501'||s.game_version!=='2.5.0'||s.realm_count!==26||s.location_count!==12||s.route_count!==20||s.save_schema_version!==22) throw new Error('V2.5 baseline is not verified');
          JS
      - name: Build V2.6 source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v26-sect-life.cjs
          node tools/build-v26-sect-life.cjs
          node --check src/game-v26.js
          node - <<'JS'
          const b=require('./BUILD_V26_SECT_LIFE.json');
          if(b.status!=='PASS'||b.gameplay_version!=='2.6.0'||b.build!=='2601'||b.realm_count!==26||b.location_count!==12||b.route_count!==20||b.save_schema_version!==23) throw new Error('V2.6 build report mismatch');
          JS
          grep -q "const VERSION='2.6.0'" src/game-v26.js
          grep -q 'SECT_MENTOR_LIFE_DEFAULTS' src/game-v26.js
          grep -q 'SECT_PEER_DEFAULTS' src/game-v26.js
          grep -q 'sectInternalDuel' src/game-v26.js
          grep -q '秘库配额评议' src/game-v26.js
          grep -q '诸峰讲法会' src/game-v26.js
          ! grep -q '天道酬勤' src/game-v26.js
      - name: Run V2.5 and V2.6 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v25.mjs
          node tests/regression-v26.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v26:
    if: github.event_name == 'push'
    needs: validate-v26
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v26-sect-life.cjs
          node tools/build-v26-sect-life.cjs
          node --check src/game-v26.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v25.mjs
          node tests/regression-v26.mjs
      - name: Switch runtime shell to V2.6 build 2601
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V2.6 宗门人物生态加载器 · build 2601
          (()=>{
            const fail=(e)=>{console.error(e);document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>'};
            try{window.__TAIXUAN_BUILD__={engineeringVersion:'2.6.0',gameplayVersion:'2.6.0',build:'2601',milestone:'sect-life-rivalry',source:'src/game-v26.js',legacyPatchChain:false};document.title='太玄界 · 修仙大世界 V2.6';const script=document.createElement('script');script.src='./src/game-v26.js?v=2601';script.async=false;script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V2.6 直接源码运行时未完成初始化'))};script.onerror=()=>fail(new Error('V2.6 游戏核心加载失败：src/game-v26.js'));document.head.appendChild(script)}catch(e){fail(e)}})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V2.5','太玄界 · 修仙大世界 V2.6'),
            ('修仙大世界 · V2.5','修仙大世界 · V2.6'),
            ('V2.5 · 青云宗门生涯','V2.6 · 宗门人物与内部生态'),
            ('./app.js?v=2501','./app.js?v=2601'),
            ('V2.4 的凡修生存重平衡继续保留。V2.5 深化青云宗门生涯：外门、内门、真传、执事、长老逐级展开，拜师、晋升考核、高阶差事、月俸与资源配额会长期影响成长。','V2.4 的凡修生存重平衡和 V2.5 的五级宗门生涯继续保留。V2.6 让宗门人物真正随时间变化：师父会闭关、突破、寿尽，同门会修炼晋升，并形成长期竞争与周期性的宗门内部事件。'),
            ('青云宗现在拥有完整长期生涯：外门→内门→真传→执事→长老。晋升要看境界、任务、贡献、师承与真实战斗考核；高身份解锁高阶差事、月俸与宗门资源配额。','青云宗不再只有身份和任务：四位师父拥有年龄、境界、闭关、突破与寿元；主要同门会自行修炼晋升。内门以后还会形成长期竞争对手，参与论剑、秘库配额与诸峰讲法等内部事件。')
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v2.6.0-sect-life-2601';
          const CORE=['./','./index.html?v=2601','./style.css','./app.js?v=2601','./src/game-v26.js?v=2601','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=2601'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V2.6.0 · 宗门人物与内部生态（build 2601）**

          正式运行结构：`index.html -> app.js -> src/game-v26.js`。浏览器直接加载可读源码，不使用历史补丁链或 `eval`。

          ## V2.6
          - 完整保留 V2.5 的外门→内门→真传→执事→长老宗门生涯、师承、晋升考核与高阶差事；
          - 四位青云宗长老拥有独立年龄、境界、修炼进度、闭关状态、突破记录与寿元，会随世界时间真正变化；
          - 师父闭关期间无法请教；师父寿尽坐化后原师承失效，可改投仍在世的长老，但师徒情分折半；
          - 新增六名持久化主要同门，他们会自行修炼、积累功绩、突破并在外门/内门/真传/执事/长老之间晋升，也会寿尽；
          - 内门以后自动形成长期竞争对手；青云论剑使用真实战斗系统，但属于非致命切磋，不计击杀、不掉高阶灵材、失败不死亡也不掉灵石；
          - 宗门内部事件按时间轮转：青云论剑小比、秘库配额评议、诸峰讲法会；参与结果会改变宗门资历、贡献、资源、师徒情分与同门竞争关系。

          ## 存档
          V2.6 使用 `saveSchemaVersion = 23`，新增师父生命状态、同门人物、长期竞争对手、宗门资历与内部事件记录。V2.5 schema22 自动迁移；未来 schema24+ 拒绝覆盖。

          V6 App 图标保持固定 SHA-256，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v26.js?v=2601' app.js
          grep -q 'src/game-v26.js?v=2601' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'eval' app.js
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v26.mjs
      - name: Commit V2.6 runtime to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v26.js BUILD_V26_SECT_LIFE.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then git commit -m 'feat: V2.6 sect life and rivalry [skip ci]'; git push origin HEAD:main; fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V2.6 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v26.js /tmp/pages/src/game-v26.js
          cp BUILD_V26_SECT_LIFE.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v26.js BUILD_V26_SECT_LIFE.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then git commit -m "feat: publish V2.6 sect life ${RELEASE_SHA} [skip ci]"; git push origin HEAD:gh-pages; fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          EXPECT_GAME="$(node -p "require('./BUILD_V26_SECT_LIFE.json').source_sha256")"
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=2601&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=2601&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v26.js?v=2601&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=2601&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" = 1 ] && grep -q 'V2.6' /tmp/public-index.html && grep -q 'src/game-v26.js?v=2601' /tmp/public-app.js && grep -q "const VERSION='2.6.0'" /tmp/public-game.js && [ "$(sha256sum /tmp/public-game.js | awk '{print $1}')" = "$EXPECT_GAME" ]; then break; fi
            if [ "$i" = 60 ]; then echo 'V2.6 public assets did not converge' >&2; exit 1; fi
            sleep 2
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v26.mjs
          node - <<'JS'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/public-manifest.json','utf8'));if(!['standalone','fullscreen'].includes(m.display))throw new Error('manifest display is not standalone/fullscreen');
          JS
          test "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512"
          test "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192"
      - name: Record V2.6 public PASS on gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SHA="$(node -p "require('./BUILD_V26_SECT_LIFE.json').source_sha256")"
          node - "$RELEASE_SHA" "$SHA" <<'JS' >/tmp/v26-status.json
          const [release,sha]=process.argv.slice(2);const s={status:'PASS',game_version:'2.6.0',build:'2601',milestone:'sect-life-rivalry',verified_commit:release,source_sha256:sha,realm_count:26,location_count:12,route_count:20,save_schema_version:23,stage:'public-pass',checks:['V2.5 public baseline PASS','V2.6 source build','living mentor states','mentor retreat breakthrough and lifespan death','six persistent sect peers','peer cultivation and rank progression','long-term sect rival','real nonlethal rival duel','rotating internal sect events','dead-mentor transfer with bond loss','V2.5 system regression','schema 22 to 23 migration','future-save overwrite guard','public asset HTTP 200','public source hash equality','public headless regression','standalone manifest','V6 icon hash regression']};process.stdout.write(JSON.stringify(s)+'\n');
          JS
          cd /tmp/pages
          cp /tmp/v26-status.json PUBLIC_V26_STATUS.json
          git add PUBLIC_V26_STATUS.json
          git commit -m 'chore: record V2.6 public PASS [skip ci]'
          git push origin HEAD:gh-pages
      - name: Verify public PASS visibility
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          URL="https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V26_STATUS.json"
          for i in $(seq 1 60); do
            if curl -fsSL "${URL}?x=${RELEASE_SHA}-${i}" -o /tmp/public-v26-status.json && node - "$RELEASE_SHA" <<'JS'
          const fs=require('fs'),release=process.argv[2],s=JSON.parse(fs.readFileSync('/tmp/public-v26-status.json','utf8'));if(s.status!=='PASS'||s.stage!=='public-pass'||s.verified_commit!==release||s.build!=='2601'||s.save_schema_version!==23)process.exit(1);
          JS
            then exit 0; fi
            sleep 2
          done
          echo 'PUBLIC_V26_STATUS did not become visible' >&2
          exit 1
      - name: Sync verified V2.6 PASS to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/v26-status.json PUBLIC_V26_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V26_STATUS.json
          git commit -m 'chore: sync verified V2.6 public PASS to main [skip ci]'
          git push origin main
