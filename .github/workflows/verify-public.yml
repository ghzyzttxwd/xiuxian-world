name: Verify public GitHub Pages

on:
  push:
    branches: ["gh-pages"]
    paths-ignore:
      - "PUBLIC_STATUS.json"
      - "PUBLIC_V3_STATUS.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -s icon-v3.svg
          grep -q '<title id="title">太玄界</title>' icon-v3.svg
          grep -q 'icon-v3.svg' manifest.webmanifest
          grep -q '"short_name": "太玄界"' manifest.webmanifest
          grep -q 'taixuan-v0.2.3-icon-v3-svg' sw.js
          grep -q 'icon-v3.svg?v=3' index.html
          test -s app.js
          test -s bundle2/c01.b64
          test -s bundle2/c24.b64

      - name: Wait for Pages and verify terminal resources
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ghzyzttxwd.github.io/xiuxian-world/"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/public-index.html -w '%{http_code}' "${BASE}?verify=${GITHUB_SHA}" || true)
            curl -fsSL "${BASE}manifest.webmanifest?verify=${GITHUB_SHA}" -o /tmp/manifest.webmanifest 2>/dev/null || true
            curl -fsSL "${BASE}icon-v3.svg?verify=${GITHUB_SHA}" -o /tmp/icon-v3.svg 2>/dev/null || true
            curl -fsSL "${BASE}sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js 2>/dev/null || true
            if [ "$code" = "200" ] && \
               grep -q 'icon-v3.svg?v=3' /tmp/public-index.html 2>/dev/null && \
               grep -q 'icon-v3.svg' /tmp/manifest.webmanifest 2>/dev/null && \
               grep -q '"short_name": "太玄界"' /tmp/manifest.webmanifest 2>/dev/null && \
               grep -q '<title id="title">太玄界</title>' /tmp/icon-v3.svg 2>/dev/null && \
               grep -q 'taixuan-v0.2.3-icon-v3-svg' /tmp/sw.js 2>/dev/null; then
              ok=1
              break
            fi
            echo "Attempt $i: HTTP $code; waiting for V3 propagation..."
            sleep 10
          done
          test "$ok" = "1"

          curl -fsSL "${BASE}app.js?verify=${GITHUB_SHA}" -o /tmp/app.js
          curl -fsSL "${BASE}bundle2/c01.b64?verify=${GITHUB_SHA}" -o /tmp/c01.b64
          curl -fsSL "${BASE}bundle2/c24.b64?verify=${GITHUB_SHA}" -o /tmp/c24.b64

          python3 - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('/tmp/manifest.webmanifest').read_text())
          assert m.get('display') == 'standalone', m
          assert m.get('short_name') == '太玄界', m
          icons=m.get('icons', [])
          assert any(x.get('src') == './icon-v3.svg' and x.get('sizes') == '192x192' for x in icons), icons
          assert any(x.get('src') == './icon-v3.svg' and x.get('sizes') == '512x512' for x in icons), icons
          svg=pathlib.Path('/tmp/icon-v3.svg').read_text()
          assert '<title id="title">太玄界</title>' in svg
          assert '仙山云海' in svg
          assert b'bundle2' in pathlib.Path('/tmp/app.js').read_bytes()
          assert pathlib.Path('/tmp/c01.b64').stat().st_size > 1000
          assert pathlib.Path('/tmp/c24.b64').stat().st_size > 1000
          PY

          grep -q '太玄界 · 修仙大世界 V0.2' /tmp/public-index.html

      - name: Record machine-verifiable V3 success
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, datetime
          data={
            'status':'PASS',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'verified_url':'https://ghzyzttxwd.github.io/xiuxian-world/',
            'source_branch':'gh-pages',
            'trigger_sha':os.environ['GITHUB_SHA'],
            'icon_version':'v3-svg',
            'checks':[
              'HTTP 200', 'V0.2 index rendered', 'manifest standalone',
              'short_name 太玄界', 'icon-v3.svg public',
              '192 and 512 manifest icon declarations', 'service worker v0.2.3',
              'app loader reachable', 'runtime chunk c01', 'runtime chunk c24'
            ]
          }
          open('PUBLIC_V3_STATUS.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V3_STATUS.json
          git commit -m 'chore: record PWA V3 public verification [skip ci]' || exit 0
          git push origin HEAD:gh-pages
