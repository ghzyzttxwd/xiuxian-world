name: Build and verify TaiXuan V5 exact icon

on:
  push:
    branches: ["gh-pages"]
    paths:
      - "BUILD_V5.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Rebuild exact V5 icon from approved sample
        shell: bash
        run: |
          set -euo pipefail
          cat v5src/part*.b64 > /tmp/icon-v5.b64
          test "$(wc -c < /tmp/icon-v5.b64)" -eq 89960
          base64 -d /tmp/icon-v5.b64 > icon-v5-512.png
          echo '73f85c80f62899d37b5d5848a6679c74de3e88b6d1cd433b7621f4910e171600  icon-v5-512.png' | sha256sum -c -

          python3 - <<'PY'
          import struct
          b=open('icon-v5-512.png','rb').read()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', b[16:24]) == (512,512)
          PY

          if command -v magick >/dev/null 2>&1; then
            magick icon-v5-512.png -filter Lanczos -resize 192x192 icon-v5-192.png
          elif command -v convert >/dev/null 2>&1; then
            convert icon-v5-512.png -filter Lanczos -resize 192x192 icon-v5-192.png
          else
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            convert icon-v5-512.png -filter Lanczos -resize 192x192 icon-v5-192.png
          fi

          python3 - <<'PY'
          import struct
          b=open('icon-v5-192.png','rb').read()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', b[16:24]) == (192,192)
          PY

          cat > manifest.webmanifest <<'EOF'
          {
            "id": "./",
            "name": "太玄界 · 修仙大世界",
            "short_name": "太玄界",
            "description": "低美术、高事件、高数值、持续世界演化的修仙沙盒 RPG。",
            "lang": "zh-CN",
            "start_url": "./index.html?v=5",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait-primary",
            "background_color": "#0d110c",
            "theme_color": "#10150f",
            "icons": [
              {"src":"./icon-v5-192.png?v=5","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icon-v5-512.png?v=5","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<link rel="icon" href="[^"]+" />','<link rel="icon" href="./icon-v5-192.png?v=5" />',s)
          s=re.sub(r'<link rel="apple-touch-icon" href="[^"]+" />','<link rel="apple-touch-icon" href="./icon-v5-192.png?v=5" />',s)
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r"const CACHE='[^']+';", "const CACHE='taixuan-v0.2.5-exact-sample-v5';", s)
          s=re.sub(r"'\./icon-[^']+'", "'./icon-v5-192.png'", s, count=1)
          if "'./icon-v5-512.png'" not in s:
              s=s.replace("'./icon-v5-192.png',", "'./icon-v5-192.png','./icon-v5-512.png',",1)
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-v5-512.png icon-v5-192.png manifest.webmanifest index.html sw.js
          git commit -m 'fix: publish exact approved TaiXuan sample icon V5' || true
          git push origin HEAD:gh-pages

      - name: Verify public V5 end-to-end
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          for i in $(seq 1 30); do
            ok=1
            curl -fsSL "${BASE}?v=5&verify=${GITHUB_RUN_ID}-${i}" -o /tmp/index.html || ok=0
            curl -fsSL "${BASE}manifest.webmanifest?v=5&verify=${GITHUB_RUN_ID}-${i}" -o /tmp/manifest.json || ok=0
            curl -fsSL "${BASE}icon-v5-512.png?v=5&verify=${GITHUB_RUN_ID}-${i}" -o /tmp/public512.png || ok=0
            curl -fsSL "${BASE}icon-v5-192.png?v=5&verify=${GITHUB_RUN_ID}-${i}" -o /tmp/public192.png || ok=0
            curl -fsSL "${BASE}sw.js?v=5&verify=${GITHUB_RUN_ID}-${i}" -o /tmp/sw.js || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'icon-v5-512.png' /tmp/manifest.json && grep -q 'taixuan-v0.2.5-exact-sample-v5' /tmp/sw.js; then
              break
            fi
            test "$i" -lt 30 || exit 1
            sleep 10
          done

          echo '73f85c80f62899d37b5d5848a6679c74de3e88b6d1cd433b7621f4910e171600  /tmp/public512.png' | sha256sum -c -
          python3 - <<'PY'
          import json,struct
          for p,expect in [('/tmp/public512.png',(512,512)),('/tmp/public192.png',(192,192))]:
              b=open(p,'rb').read(); assert b[:8]==b'\x89PNG\r\n\x1a\n'; assert struct.unpack('>II',b[16:24])==expect
          m=json.load(open('/tmp/manifest.json'))
          assert m['display']=='standalone'
          assert m['short_name']=='太玄界'
          assert all(x.get('purpose')=='any' for x in m['icons'])
          PY

      - name: Record V5 PASS
        shell: bash
        run: |
          python3 - <<'PY'
          import json,datetime,hashlib
          p='icon-v5-192.png'
          data={
            'status':'PASS',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'verified_url':'https://ghzyzttxwd.github.io/xiuxian-world/',
            'icon_version':'v5-exact-approved-sample',
            'icon_512_sha256':'73f85c80f62899d37b5d5848a6679c74de3e88b6d1cd433b7621f4910e171600',
            'icon_192_sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),
            'checks':['approved PNG bytes exact at 512','192 generated only by Lanczos scale','manifest V5','purpose any','service worker V5','public 512 hash exact','public 192 dimensions']
          }
          open('PUBLIC_V5_STATUS.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git add PUBLIC_V5_STATUS.json
          git commit -m 'chore: record V5 exact icon public verification [skip ci]' || exit 0
          git push origin HEAD:gh-pages
