name: Verify public GitHub Pages

on:
  push:
    branches: ["gh-pages"]
    paths-ignore:
      - "PUBLIC_STATUS.json"
      - "PUBLIC_V3_STATUS.json"
      - "PUBLIC_V4_STATUS.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Verify V4 public resources
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ghzyzttxwd.github.io/xiuxian-world/"
          for i in $(seq 1 30); do
            ok=1
            curl -fsSL "${BASE}?v=4&verify=${GITHUB_SHA}" -o /tmp/index.html || ok=0
            curl -fsSL "${BASE}manifest.webmanifest?v=4&verify=${GITHUB_SHA}" -o /tmp/manifest.json || ok=0
            curl -fsSL "${BASE}sw.js?v=4&verify=${GITHUB_SHA}" -o /tmp/sw.js || ok=0
            curl -fsSL "${BASE}icon-v4-192.jpg?v=4&verify=${GITHUB_SHA}" -o /tmp/icon192.jpg || ok=0
            curl -fsSL "${BASE}icon-v4-512.jpg?v=4&verify=${GITHUB_SHA}" -o /tmp/icon512.jpg || ok=0
            curl -fsSL "${BASE}app.js?v=4&verify=${GITHUB_SHA}" -o /tmp/app.js || ok=0
            curl -fsSL "${BASE}bundle2/c01.b64?v=4&verify=${GITHUB_SHA}" -o /tmp/c01.b64 || ok=0
            curl -fsSL "${BASE}bundle2/c24.b64?v=4&verify=${GITHUB_SHA}" -o /tmp/c24.b64 || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'icon-v4-192.jpg' /tmp/manifest.json && grep -q 'icon-v4-512.jpg' /tmp/manifest.json && grep -q 'taixuan-v0.2.4-sample-icon-v4' /tmp/sw.js; then break; fi
            test "$i" -lt 30 || exit 1
            sleep 10
          done
          echo '754e9722757c431dae3e1ad4f43731c0ae6046c148663fd517ee6a3ba3ad59fc  /tmp/icon192.jpg' | sha256sum -c -
          echo '3a4f61555eabc7952589c67f2e2eec2e9ded278a11b5949274426687c5a06efd  /tmp/icon512.jpg' | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          import json
          assert Image.open('/tmp/icon192.jpg').size == (192,192)
          assert Image.open('/tmp/icon512.jpg').size == (512,512)
          m=json.load(open('/tmp/manifest.json'))
          assert m['display']=='standalone'
          assert m['short_name']=='太玄界'
          sizes={x['sizes'] for x in m['icons']}
          assert {'192x192','512x512'} <= sizes
          PY
          grep -q '太玄界 · 修仙大世界 V0.2' /tmp/index.html
          test -s /tmp/app.js
          test -s /tmp/c01.b64
          test -s /tmp/c24.b64

      - name: Record V4 PASS
        shell: bash
        run: |
          python3 - <<'PY'
          import json,datetime,os
          data={
            'status':'PASS',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'verified_url':'https://ghzyzttxwd.github.io/xiuxian-world/',
            'source_branch':'gh-pages',
            'trigger_sha':os.environ['GITHUB_SHA'],
            'icon_version':'v4-sample-raster',
            'icon_192_sha256':'754e9722757c431dae3e1ad4f43731c0ae6046c148663fd517ee6a3ba3ad59fc',
            'icon_512_sha256':'3a4f61555eabc7952589c67f2e2eec2e9ded278a11b5949274426687c5a06efd',
            'checks':['HTTP 200','V0.2 index','manifest standalone','short_name 太玄界','sample-derived 192 icon','sample-derived 512 icon','service worker v0.2.4','app loader','runtime c01','runtime c24']
          }
          open('PUBLIC_V4_STATUS.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V4_STATUS.json
          git commit -m 'chore: record V4 sample icon public verification [skip ci]' || exit 0
          git push origin HEAD:gh-pages
