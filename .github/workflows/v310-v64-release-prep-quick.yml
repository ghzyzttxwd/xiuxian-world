name: V3.10 V64 non-publishing release prep quick

on:
  push:
    branches: ["v310-release-prep-nonpublish"]
    paths:
      - ".github/workflows/v310-v64-release-prep-quick.yml"
      - "tools/build-v310-balance-v4.cjs"
      - "tools/build-v310-balance-v5.cjs"
      - "tools/build-v310-balance-v6.cjs"
      - "tools/verify-v310-v64-evidence.mjs"
      - "tools/verify-v310-v66-evidence.mjs"
      - "tools/release-v310-assets.cjs"
      - "tools/verify-v310-public.sh"
      - "tools/aggregate-v310-fullrun-gate.mjs"
      - "tests/regression-v310-natal-origin-id.mjs"
      - "tests/regression-v310-tribulation-essence.mjs"
      - "tests/regression-v310-resource-utility.mjs"
      - "tests/regression-v310-v38-pill-effects.mjs"
      - "tests/regression-v310-domain-sand-source.mjs"
      - "tests/regression-v310-v64-evidence-verifier.mjs"
      - "tests/regression-v310-v66-evidence-verifier.mjs"
      - "tests/regression-v310-aggregate-gate.mjs"
      - "V310_V64_RELEASE_PREP_QUICK.trigger"

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install jsdom
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
      - name: Rebuild exact V6 and run all staged V3.10 repair gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" != "62db848091ce7686c85357a8c963820a9d27f24c"
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tests/regression-v310-v38-pill-effects.mjs
          node tools/build-v310-balance-v6.cjs
          node --check src/game-v310.js
          test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "af83bcef5657ccf17372e51038ea8f1709da6623a4739b8e9267a902ffd47f63"
          node tests/regression-v310-resource-utility.mjs
          node tests/regression-v310-domain-sand-source.mjs
          node --check tools/verify-v310-v64-evidence.mjs
          node tests/regression-v310-v64-evidence-verifier.mjs
          node --check tools/verify-v310-v66-evidence.mjs
          node tests/regression-v310-v66-evidence-verifier.mjs
          node --check tools/aggregate-v310-fullrun-gate.mjs
          node tests/regression-v310-aggregate-gate.mjs
          node --check tools/release-v310-assets.cjs
          bash -n tools/verify-v310-public.sh
          node tools/release-v310-assets.cjs
          node --check app.js
          grep -q "gameplayVersion:'3.10.0'" app.js
          grep -q 'src/game-v310.js?v=31001' app.js
          grep -q 'V3.10 · 无充值全流程总平衡篇' index.html
          grep -q 'taixuan-v3.10.0-no-recharge-full-run-balance-31001' sw.js
          ! grep -q 'eval' app.js
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"
          echo 'V310_V64_RELEASE_PREP_QUICK_PASS'
