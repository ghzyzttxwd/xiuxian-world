name: V2.0 high-tier ecosystem validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V20_HIGH_TIER_ECOSYSTEM.trigger"
      - "tools/build-v20-high-tier-ecosystem.cjs"
      - "tests/regression-v20.mjs"
      - ".github/workflows/v20-high-tier-ecosystem.yml"
  push:
    branches: ["main"]
    paths: ["V20_HIGH_TIER_ECOSYSTEM.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v20-ecosystem-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V1.9 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V19_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='1901'||s.game_version!=='1.9.0'||s.realm_count!==26||s.save_schema_version!==16) throw new Error('V1.9 baseline is not verified');
          JS
      - name: Build V2.0 source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v20-high-tier-ecosystem.cjs
          node --check src/game-v20.js
          node - <<'JS'
          const b=require('./BUILD_V20_HIGH_TIER_ECOSYSTEM.json');
          if(b.status!=='PASS'||b.gameplay_version!=='2.0.0'||b.build!=='2001'||b.realm_count!==26||b.location_count!==12||b.route_count!==20||b.save_schema_version!==17) throw new Error('V2.0 build report mismatch');
          JS
          grep -q "const VERSION='2.0.0'" src/game-v20.js
          grep -q '高阶灵材' src/game-v20.js
          grep -q '金元丹' src/game-v20.js
          grep -q '养魂丹' src/game-v20.js
          grep -q '太虚神剑' src/game-v20.js
          grep -q 'gearSpellMultiplier' src/game-v20.js
      - name: Run V2.0 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v20.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v20:
    if: github.event_name == 'push'
    needs: validate-v20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v20-high-tier-ecosystem.cjs
          node --check src/game-v20.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v20.mjs
      - name: Switch runtime shell to V2.0 build 2001
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V2.0 高阶修炼生态加载器 · build 2001
          (()=>{
            const fail=(e)=>{console.error(e);document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>'};
            try{window.__TAIXUAN_BUILD__={engineeringVersion:'2.0.0',gameplayVersion:'2.0.0',build:'2001',milestone:'high-tier-ecosystem',source:'src/game-v20.js',legacyPatchChain:false};document.title='太玄界 · 修仙大世界 V2.0';const script=document.createElement('script');script.src='./src/game-v20.js?v=2001';script.async=false;script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V2.0 直接源码运行时未完成初始化'))};script.onerror=()=>fail(new Error('V2.0 游戏核心加载失败：src/game-v20.js'));document.head.appendChild(script)}catch(e){fail(e)}})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V1.9','太玄界 · 修仙大世界 V2.0'),
            ('修仙大世界 · V1.9','修仙大世界 · V2.0'),
            ('V1.9 · 元婴圆满与化神长线','V2.0 · 高阶修炼生态'),
            ('./app.js?v=1901','./app.js?v=2001'),
            ('修为圆满后仍需主动破境。元婴圆满后的【炼神化神】需要化婴灵胎、化神道种、悟道点和 30 日闭关；失败会濒死并损失大量寿元。踏入化神后还能获得真正进入战斗公式的神念攻防能力。','境界长线已贯通至化神后期。V2.0 开始补足高境界日常循环：高阶敌人与秘境产出高阶灵材，可用于金元丹、养魂丹和金丹至化神法宝；法宝属性与法术增幅直接进入战斗公式。'),
            ('采来的灵草和坊市资源可以炼成丹药。每炉真实消耗材料与 1 天时间，失败也会积累炼丹经验。','低阶丹药继续保留；金丹后可炼金元丹，元婴后可炼养魂丹。高阶丹药会消耗高阶灵材和对应境界资源，失败同样真实损失材料。'),
            ('击败妖兽有机会剥取兽材。兽材与灵石可锻造法器；装备后的属性会直接进入战斗公式。','法器体系已扩展到金丹、元婴、化神。高阶法宝需要兽材、高阶灵材与境界资源；武器与佩饰的法术增幅会直接进入攻伐法术伤害公式。')]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v2.0.0-high-tier-ecosystem-2001';
          const CORE=['./','./index.html?v=2001','./style.css','./app.js?v=2001','./src/game-v20.js?v=2001','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=2001'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V2.0.0 · 高阶修炼生态（build 2001）**

          正式运行结构：`index.html -> app.js -> src/game-v20.js`。浏览器直接加载可读源码，不使用历史补丁链或 `eval`。

          ## V2.0
          - 暂停机械追加境界，保留凡人至化神后期 26 境界长线；
          - 新增【高阶灵材】，金丹以上敌人与高境界秘境会进入真实产出循环；
          - 新增金元丹、养魂丹：炼制有真实材料、时间、成功率与失败损耗，服用后产生实际修为/灵力/伤势/悟道效果；
          - 法器从三件低阶装备扩展到赤霄丹剑、玄龟灵甲、元神玉佩、太虚神剑；
          - 高阶法宝需要兽材、高阶灵材以及结丹灵髓/化婴灵胎/化神道种等对应资源；
          - 法宝法术增幅真实进入火弹术、金焰剑诀、神念斩伤害公式；
          - 秘境核心在金丹以上会额外产出高阶灵材，使探索、战斗、炼丹、炼器形成闭环；
          - V1.9 的 26 境界、12 地域、20 路线、宗门、洞府、NPC、秘境、轮回、宗门大战、结丹/化婴/化神体系全部保留。

          ## 存档
          V2.0 使用 `saveSchemaVersion = 17`，新增 `rareMaterials`、`goldenPills`、`soulPills`。V1.9 schema16 自动迁移；未来 schema18+ 拒绝覆盖。

          V6 App 图标保持固定 SHA-256，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v20.js?v=2001' app.js
          grep -q 'src/game-v20.js?v=2001' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'eval' app.js
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v20.mjs
      - name: Commit V2.0 runtime to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v20.js BUILD_V20_HIGH_TIER_ECOSYSTEM.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then git commit -m 'feat: V2.0 high-tier cultivation ecosystem [skip ci]'; git push origin HEAD:main; fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V2.0 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v20.js /tmp/pages/src/game-v20.js
          cp BUILD_V20_HIGH_TIER_ECOSYSTEM.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v20.js BUILD_V20_HIGH_TIER_ECOSYSTEM.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then git commit -m "feat: publish V2.0 ecosystem ${RELEASE_SHA} [skip ci]"; git push origin HEAD:gh-pages; fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=2001&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=2001&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v20.js?v=2001&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=2001&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'V2.0' /tmp/public-index.html && grep -q 'src/game-v20.js?v=2001' /tmp/public-app.js && grep -q "const VERSION='2.0.0'" /tmp/public-game.js && grep -q '金元丹' /tmp/public-game.js && grep -q '太虚神剑' /tmp/public-game.js && grep -q 'gearSpellMultiplier' /tmp/public-game.js && grep -q 'src/game-v20.js?v=2001' /tmp/public-sw.js && ! grep -q 'bundle2' /tmp/public-app.js && ! grep -q 'eval' /tmp/public-app.js && [ "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512" ] && [ "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192" ]; then break; fi
            test "$i" -lt 60 || { echo 'public V2.0 assets did not converge'; exit 1; }
            sleep 5
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/public-manifest.json'))
          assert m['display']=='standalone' and m['short_name']=='太玄界'
          assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          assert all(x['purpose']=='any' for x in m['icons'])
          PY
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v20.mjs
          LOCAL_SHA=$(node -p "require('./BUILD_V20_HIGH_TIER_ECOSYSTEM.json').source_sha256")
          PUBLIC_SHA=$(sha256sum /tmp/public-game.js | awk '{print $1}')
          test "$LOCAL_SHA" = "$PUBLIC_SHA"
      - name: Record and serve V2.0 public PASS
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(node -p "require('./BUILD_V20_HIGH_TIER_ECOSYSTEM.json').source_sha256")
          cd /tmp/pages
          cat > PUBLIC_V20_STATUS.json <<JSON
          {"status":"PASS","game_version":"2.0.0","build":"2001","milestone":"high-tier-ecosystem","verified_commit":"${RELEASE_SHA}","source_sha256":"${SOURCE_SHA}","realm_count":26,"location_count":12,"route_count":20,"save_schema_version":17,"stage":"public-pass","checks":["V1.9 public baseline PASS","V2.0 source build","high-tier material combat/secret-realm loop","金元丹 and 养魂丹 real alchemy/use effects","four high-tier artifacts","artifact spell amplification in combat","V1.9 system regression","schema 16 to 17 migration","future-save overwrite guard","public asset HTTP 200","public source hash equality","public headless regression","standalone manifest","V6 icon hash regression"]}
          JSON
          git add PUBLIC_V20_STATUS.json
          git commit -m 'chore: record V2.0 public PASS [skip ci]'
          git push origin HEAD:gh-pages
          for i in $(seq 1 60); do
            if curl -fsSL "https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V20_STATUS.json?x=${RELEASE_SHA}-${i}" -o /tmp/public-v20-status.json && RELEASE_SHA="$RELEASE_SHA" node -e "const s=require('/tmp/public-v20-status.json');if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='2001'||s.realm_count!==26||s.save_schema_version!==17||s.verified_commit!==process.env.RELEASE_SHA)process.exit(1)"; then break; fi
            test "$i" -lt 60 || { echo 'PUBLIC_V20_STATUS not served'; exit 1; }
            sleep 5
          done
      - name: Sync verified V2.0 PASS back to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/public-v20-status.json PUBLIC_V20_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V20_STATUS.json
          git commit -m 'chore: sync verified V2.0 public PASS to main [skip ci]'
          git push origin HEAD:main
