name: One-shot V1.5 builder brace fix

on:
  push:
    branches: ["main"]
    paths: ["FIX_V15_BUILDER.trigger"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove extra simulateNPCs closing brace and verify builder syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v15-world.cjs')
          s=p.read_text(encoding='utf-8')
          anchor="""if(rand()<.035)n.location=npcMoveTarget(n);if(rand()<.006&&n.realmIndex===0&&n.age>50){n.alive=false;if(n.known)addWorld(\\`${'${n.name}'}寿终，修真路上又少了一位旧人。\\`)}}\n }\n}`;"""
          replacement="""if(rand()<.035)n.location=npcMoveTarget(n);if(rand()<.006&&n.realmIndex===0&&n.age>50){n.alive=false;if(n.known)addWorld(\\`${'${n.name}'}寿终，修真路上又少了一位旧人。\\`)}}\n}`;"""
          if s.count(anchor)!=1:
              raise SystemExit(f'expected exactly one simulateNPCs brace anchor, found {s.count(anchor)}')
          p.write_text(s.replace(anchor,replacement,1),encoding='utf-8')
          PY
          node --check tools/build-v15-world.cjs
          node tools/build-v15-world.cjs
          node --check src/game-v15.js
      - name: Commit root fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-v15-world.cjs
          git commit -m 'fix: correct V1.5 NPC simulation builder braces [skip ci]'
          git push origin HEAD:main
