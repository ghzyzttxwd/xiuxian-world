name: V3.10 V64 proof-bound non-publishing release prep

on:
  push:
    branches: ["v310-release-prep-nonpublish"]
    paths:
      - "V310_V64_BOUND_PREP.trigger"

permissions:
  contents: read
  actions: read

env:
  V39_BASE_SHA: 62db848091ce7686c85357a8c963820a9d27f24c
  PROOF_HEAD: a08096d3073ca1939f6a7e615ae78ec4b3fd05e0
  PROOF_RUN_ID: "33228933364"
  LOCKED_SOURCE_SHA: af83bcef5657ccf17372e51038ea8f1709da6623a4739b8e9267a902ffd47f63

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable base and exact successful V64 proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$V39_BASE_SHA"
          run_head=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.head_sha')
          run_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.status')
          run_conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" --jq '.conclusion')
          test "$run_head" = "$PROOF_HEAD"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}/jobs?per_page=100")
          for name in no-recharge-sword no-recharge-flame no-recharge-body no-recharge-spirit; do
            echo "$jobs" | jq -e --arg n "$name" '.jobs[] | select(.name==$n and .status=="completed" and .conclusion=="success")' >/dev/null
          done

      - name: Rebuild and lock exact V64 gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PROOF_HEAD"
          git cat-file -e "$PROOF_HEAD^{commit}"
          rm -rf /tmp/v310-v64-proof
          git worktree add --detach /tmp/v310-v64-proof "$PROOF_HEAD"
          (
            cd /tmp/v310-v64-proof
            node tools/build-v310-balance-v6.cjs
            node --check src/game-v310.js
            test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$LOCKED_SOURCE_SHA"
          )
          node tools/build-v310-balance-v6.cjs
          node --check src/game-v310.js
          test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$LOCKED_SOURCE_SHA"
          cmp -s src/game-v310.js /tmp/v310-v64-proof/src/game-v310.js
          node -e "const b=require('./BUILD_V310_BALANCE.json');if(b.status!=='PASS'||b.gameplay_version!=='3.10.0'||b.build!=='31001'||b.save_schema_version!==36||b.content_registry_version!==10||b.source_sha256!==process.env.LOCKED_SOURCE_SHA)throw new Error('V64 exact build report mismatch')"

      - name: Download and verify durable V64 four-path evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf V310_FULLRUN_EVIDENCE
          mkdir -p V310_FULLRUN_EVIDENCE
          for dao in sword flame body spirit; do
            mkdir -p "V310_FULLRUN_EVIDENCE/$dao"
            gh run download "$PROOF_RUN_ID" -n "v310-v64-fullrun-$dao" -D "V310_FULLRUN_EVIDENCE/$dao"
          done
          node tools/verify-v310-v64-evidence.mjs V310_FULLRUN_EVIDENCE
          node tools/aggregate-v310-fullrun-gate.mjs V310_FULLRUN_EVIDENCE

      - name: Run complete regression and repair surface
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs
          node tests/regression-v32.mjs
          node tests/regression-v33.mjs
          node tests/regression-v34.mjs
          node tests/regression-v35.mjs
          node tests/regression-v36.mjs
          node tests/regression-v37.mjs
          node tests/regression-v38.mjs
          node tests/regression-v39.mjs
          node tests/regression-v310.mjs
          node tests/regression-v310-premahayana-auction.mjs
          node tests/regression-v310-core-market.mjs
          node tests/regression-v310-natal-origin-id.mjs
          node tests/regression-v310-tribulation-essence.mjs
          node tests/regression-v310-v38-pill-effects.mjs
          node tools/build-v310-balance-v6.cjs >/tmp/v64-bound-resource-build.log
          node tests/regression-v310-resource-utility.mjs
          node tests/regression-v310-domain-sand-source.mjs
          node tests/regression-v310-v64-evidence-verifier.mjs
          node tests/regression-v310-aggregate-gate.mjs

      - name: Validate V64 release transform without publishing
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-v310-balance-v6.cjs
          test "$(sha256sum src/game-v310.js | awk '{print $1}')" = "$LOCKED_SOURCE_SHA"
          node --check tools/release-v310-assets.cjs
          bash -n tools/verify-v310-public.sh
          node tools/release-v310-assets.cjs
          node --check app.js
          grep -q "gameplayVersion:'3.10.0'" app.js
          grep -q 'src/game-v310.js?v=31001' app.js
          grep -q 'V3.10 · 无充值全流程总平衡篇' index.html
          grep -q 'taixuan-v3.10.0-no-recharge-full-run-balance-31001' sw.js
          ! grep -q 'eval' app.js
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

      - name: Upload bound validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v310-v64-bound-release-prep
          path: |
            V310_FINAL_GATE_SUMMARY.json
            V310_V64_EVIDENCE_VERIFICATION.json
            BUILD_V310_BALANCE.json
          if-no-files-found: error
          retention-days: 14
