name: V2.4 mortal balance validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V24_MORTAL_BALANCE.trigger"
      - "tools/build-v24-mortal-balance.cjs"
      - "tests/regression-v24.mjs"
      - ".github/workflows/v24-mortal-balance.yml"
  push:
    branches: ["main"]
    paths: ["V24_MORTAL_BALANCE.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v24-mortal-balance-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V2.3 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V23_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='2301'||s.game_version!=='2.3.0'||s.realm_count!==26||s.location_count!==12||s.route_count!==20||s.save_schema_version!==20) throw new Error('V2.3 baseline is not verified');
          JS
      - name: Build V2.4 source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v24-mortal-balance.cjs
          node tools/build-v24-mortal-balance.cjs
          node --check src/game-v24.js
          node - <<'JS'
          const b=require('./BUILD_V24_MORTAL_BALANCE.json');
          if(b.status!=='PASS'||b.gameplay_version!=='2.4.0'||b.build!=='2401'||b.realm_count!==26||b.location_count!==12||b.route_count!==20||b.save_schema_version!==21) throw new Error('V2.4 build report mismatch');
          JS
          grep -q "const VERSION='2.4.0'" src/game-v24.js
          grep -q 'majorRealmStage' src/game-v24.js
          grep -q 'finalizeLifespanDeath' src/game-v24.js
          grep -q '1300000' src/game-v24.js
          ! grep -q '天道酬勤' src/game-v24.js
      - name: Run V2.4 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v24.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v24:
    if: github.event_name == 'push'
    needs: validate-v24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v24-mortal-balance.cjs
          node tools/build-v24-mortal-balance.cjs
          node --check src/game-v24.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v24.mjs
      - name: Switch runtime shell to V2.4 build 2401
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V2.4 凡修生存重平衡加载器 · build 2401
          (()=>{
            const fail=(e)=>{console.error(e);document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>'};
            try{window.__TAIXUAN_BUILD__={engineeringVersion:'2.4.0',gameplayVersion:'2.4.0',build:'2401',milestone:'mortal-balance-lifespan',source:'src/game-v24.js',legacyPatchChain:false};document.title='太玄界 · 修仙大世界 V2.4';const script=document.createElement('script');script.src='./src/game-v24.js?v=2401';script.async=false;script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V2.4 直接源码运行时未完成初始化'))};script.onerror=()=>fail(new Error('V2.4 游戏核心加载失败：src/game-v24.js'));document.head.appendChild(script)}catch(e){fail(e)}})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V2.3','太玄界 · 修仙大世界 V2.4'),
            ('修仙大世界 · V2.3','修仙大世界 · V2.4'),
            ('V2.3 · 三方势力与长期立场','V2.4 · 凡修生存重平衡'),
            ('./app.js?v=2301','./app.js?v=2401'),
            ('<span>勤勉</span>','<span>历练</span>'),
            ('四大道途与道途世界反馈继续保留。V2.3 增加青云宗、玄水帮、血刀门三方长期势力关系：完成真实战斗委托或参与宗门大战会改变立场；友善/敌对会进一步影响路线风险、临江坊市价格与NPC态度。','V2.4 重做普通修士的生存难度：移除天道酬勤额外修炼收益，境界需求越往后增长越快；跨大境界战斗会产生强烈压制；寿元耗尽会永久结束本世。丹药、洞府、功法、秘境与势力系统继续保留。'),
            ('身死或寿尽后，本世成果会凝成传承点。世界和修真界人物继续前行，但新的一世会重置本世资产与人际恩怨。','身死或寿尽后，本世会被永久锁死并凝成传承点；不能继续用这一世行动。只有进入轮回才能开启新的角色，世界和修真界人物仍会继续前行。')]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          pattern=r'<section class="panel cheat"><h2>穿越者外挂</h2>.*?</section>'
          replacement='<section class="panel cheat"><h2>修行参悟</h2><div class="cheat-name">【凡修之路】</div><div class="cheat-desc">本世没有额外修炼外挂。灵根、功法、洞府、丹药、机缘与时间共同决定修炼速度；越往高境需求越大。修行历练只记录你真正投入过的行动，不会自动赠送悟道点。悟道点需要通过论道、遗迹、秘境、丹药或特殊机缘获得。</div><div class="cheat-points"><span class="pill" id="diligencePill"></span><span class="pill" id="insightPill"></span></div><div class="cheat-buttons"><button id="insightCultivate">顿悟修为</button><button id="insightManual">顿悟功法</button><button id="insightSpell">顿悟法术</button></div></section>'
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('cheat panel anchor missing')
          if '天道酬勤' in s: raise SystemExit('index still contains 天道酬勤')
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v2.4.0-mortal-balance-2401';
          const CORE=['./','./index.html?v=2401','./style.css','./app.js?v=2401','./src/game-v24.js?v=2401','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=2401'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V2.4.0 · 凡修生存重平衡（build 2401）**

          正式运行结构：`index.html -> app.js -> src/game-v24.js`。浏览器直接加载可读源码，不使用历史补丁链或 `eval`。

          ## V2.4
          - 保留凡人至化神后期 26 境界、12 地域、20 路线，以及 V2.0–V2.3 的高阶生态、四大道途、世界反馈、三方势力关系与真实委托；
          - 完整移除“天道酬勤”修炼 ×1.5 和勤勉满 20 自动送悟道点两层外挂；修行历练仅作为实际行动记录；
          - 重做 26 境界修为需求：前期仍可推进，筑基后明显变慢，金丹进入几十年级，元婴/化神逐步进入百年级长期成长；
          - schema20 旧档迁移时按原境界完成百分比等比例映射到新需求，避免直接清零或凭空倒退；
          - 大境界压制按凡人/炼气/筑基/金丹系/元婴/化神六个层级计算：跨一大境已经是显著压制，跨两到三大境接近不可正面对抗；
          - 高境压低境同时提高战斗伤害，低境逆伐高境会显著减伤，高境敌人造成的战败死亡风险也同步上升；
          - 普通小境界突破率随境界提高而下降；结丹、金丹、化婴、化神原有大突破材料和失败惩罚继续保留；
          - 洞府七日闭关改为按真实七日修炼收益结算，不再按当前境界需求百分比直接跳大量进度；
          - NPC 修炼速度同步放慢，避免玩家进入百年长线后 NPC 在数年内集体冲到顶境；
          - 寿元耗尽会立即写入死亡原因、年龄、境界和日期并锁死本世，刷新/继续存档都不能恢复行动；只能轮回开启下一世；
          - 剩余寿元 ≤10 年时首页开始预警，≤3 年和最后 1 年会进一步升级警告。

          ## 存档
          V2.4 使用 `saveSchemaVersion = 21`。V2.3 schema20 自动迁移并按原进度比例重算修为；未来 schema22+ 拒绝覆盖。

          V6 App 图标保持固定 SHA-256，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v24.js?v=2401' app.js
          grep -q 'src/game-v24.js?v=2401' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'eval' app.js
          ! grep -q '天道酬勤' index.html
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v24.mjs
      - name: Commit V2.4 runtime to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v24.js BUILD_V24_MORTAL_BALANCE.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then git commit -m 'feat: V2.4 mortal cultivation and lifespan balance [skip ci]'; git push origin HEAD:main; fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V2.4 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v24.js /tmp/pages/src/game-v24.js
          cp BUILD_V24_MORTAL_BALANCE.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v24.js BUILD_V24_MORTAL_BALANCE.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then git commit -m "feat: publish V2.4 mortal balance ${RELEASE_SHA} [skip ci]"; git push origin HEAD:gh-pages; fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=2401&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=2401&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v24.js?v=2401&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=2401&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" = 1 ] && grep -q "src/game-v24.js?v=2401" /tmp/public-app.js && grep -q "const VERSION='2.4.0'" /tmp/public-game.js && grep -q 'finalizeLifespanDeath' /tmp/public-game.js && ! grep -q '天道酬勤' /tmp/public-game.js && ! grep -q '天道酬勤' /tmp/public-index.html; then break; fi
            if [ "$i" = 60 ]; then echo 'public assets did not converge to V2.4' >&2; exit 1; fi
            sleep 2
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          test "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512"
          test "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192"
          node - <<'JS'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/public-manifest.json','utf8'));
          if(m.display!=='standalone')throw new Error('manifest display is not standalone');
          if(!Array.isArray(m.icons)||!m.icons.some(x=>String(x.src).includes('icon-v6-192.png'))||!m.icons.some(x=>String(x.src).includes('icon-v6-512.png')))throw new Error('manifest V6 icons missing');
          JS
          LOCAL_SHA="$(sha256sum src/game-v24.js | awk '{print $1}')"
          PUBLIC_SHA="$(sha256sum /tmp/public-game.js | awk '{print $1}')"
          test "$LOCAL_SHA" = "$PUBLIC_SHA"
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v24.mjs
      - name: Record V2.4 public PASS on gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum src/game-v24.js | awk '{print $1}')"
          cat > /tmp/status.json <<JSON
          {"status":"PASS","game_version":"2.4.0","build":"2401","milestone":"mortal-balance-lifespan","verified_commit":"${RELEASE_SHA}","source_sha256":"${SHA}","realm_count":26,"location_count":12,"route_count":20,"save_schema_version":21,"stage":"public-pass","checks":["V2.3 public baseline PASS","V2.4 source build","removed cultivation and diligence cheats","exponential cultivation curve","percentage-preserving schema20 to21 migration","major-realm combat suppression","later breakthrough difficulty","balanced seven-day retreat","terminal lifespan death lock","lifespan warning UI","slower NPC cultivation","V2.3 system regression","future-save overwrite guard","public asset HTTP 200","public source hash equality","public headless regression","standalone manifest","V6 icon hash regression"]}
          JSON
          cd /tmp/pages
          cp /tmp/status.json PUBLIC_V24_STATUS.json
          git add PUBLIC_V24_STATUS.json
          git commit -m 'chore: record V2.4 public PASS [skip ci]'
          git push origin HEAD:gh-pages
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V24_STATUS.json'
          for i in $(seq 1 60); do
            if curl -fsSL "${BASE}?x=${RELEASE_SHA}-${i}" -o /tmp/public-status.json && node -e "const s=require('/tmp/public-status.json');if(s.status!=='PASS'||s.stage!=='public-pass'||s.verified_commit!=='${RELEASE_SHA}'||s.build!=='2401')process.exit(1)"; then exit 0; fi
            sleep 2
          done
          echo 'PUBLIC_V24_STATUS did not become visible' >&2
          exit 1
      - name: Sync verified public PASS to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/status.json PUBLIC_V24_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V24_STATUS.json
          git commit -m 'chore: sync verified V2.4 public PASS to main [skip ci]'
          git push origin HEAD:main
