name: V3.7 taskbook finalize

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V37_TASKBOOK_FINALIZE.trigger"
      - "tools/finalize-v37-taskbook.cjs"
      - ".github/workflows/v37-taskbook-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-v37-taskbook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact V3.7 terminal baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "811ddfb140caae2389ae37fbe933610f901d1abb"
          test "$(git show ${BASE_SHA}:src/game-v37.js | sha256sum | awk '{print $1}')" = "16e5d00143d5c860671cf46b033a3cb9673c8e2ec06ae468850a13a366f74321"
          git show ${BASE_SHA}:PUBLIC_V37_STATUS.json >/tmp/v37-status.json
          node -e "const s=require('/tmp/v37-status.json');if(s.status!=='PASS'||s.game_version!=='3.7.0'||s.build!=='3701'||s.save_schema_version!==34||s.content_registry_version!==8||s.verified_commit!=='9a28756f23a378b0bfcc636160e74e0948bb4b67'||s.source_sha256!=='16e5d00143d5c860671cf46b033a3cb9673c8e2ec06ae468850a13a366f74321')throw new Error('V3.7 terminal baseline mismatch')"
      - name: Generate and validate taskbook
        shell: bash
        run: |
          set -euo pipefail
          node tools/finalize-v37-taskbook.cjs
          grep -q '当前正式基线：V3.7.0 · 合体法则与高阶战争篇 · build 3701 · save schema 34' docs/PROJECT_TASKBOOK.md
          grep -q '| V3.7 合体篇 | DONE |' docs/PROJECT_TASKBOOK.md
          grep -q '| V3.8 大乘篇 | TODO / CURRENT |' docs/PROJECT_TASKBOOK.md
          grep -q '\- \[x\] 合体完整' docs/PROJECT_TASKBOOK.md
          grep -q '正式 runtime commit：`9a28756f23a378b0bfcc636160e74e0948bb4b67`' docs/PROJECT_TASKBOOK.md
          grep -q 'PUBLIC_V37_STATUS.json = PASS' docs/PROJECT_TASKBOOK.md
          grep -q '下一阶段：V3.8 人界终局：大乘' docs/PROJECT_TASKBOOK.md
          cp docs/PROJECT_TASKBOOK.md /tmp/PROJECT_TASKBOOK_V37.md
      - name: Commit only finalized taskbook to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --hard
          git checkout -B main "$BASE_SHA"
          cp /tmp/PROJECT_TASKBOOK_V37.md docs/PROJECT_TASKBOOK.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_TASKBOOK.md
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'docs/PROJECT_TASKBOOK.md'
          git diff --cached --check
          git commit -m "docs: mark V3.7 unity law complete [skip ci]"
          git push origin HEAD:main
