name: Playable UI V3.9.1

on:
  push:
    branches: ["main"]
    paths:
      - "UI_PLAYABLE_RELEASE.trigger"

permissions:
  contents: write

concurrency:
  group: taixuan-playable-ui-v3910
  cancel-in-progress: false

jobs:
  validate-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate frozen V3.9 core and UI contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src/game-v39.js | awk '{print $1}')" = "99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37"
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"
          node --check app.js
          node --check src/game-v39.js
          grep -q 'data-ui-shell="playable-v3910"' index.html
          grep -q 'TAIXUAN_PLAYABLE_UI_V3910' style.css
          grep -q 'taixuan-v3.9.0-playable-ui-3910' sw.js
          grep -q 'src/game-v39.js?v=3901' app.js
          grep -q 'V3.9 · 渡劫飞升与真仙终局篇' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=['startScreen','nameInput','newGameBtn','continueBtn','installStartBtn','installStatus','gameApp','dateTop','installBtn','saveBtn','heroName','heroSub','realmName','cultivationText','cultivationBar','spiritStoneQuick','herbQuick','hpQuick','repQuick','diligenceQuick','insightQuick','urgentBox','breakthroughBox','legacyBox','homeLog','diligencePill','insightPill','insightCultivate','insightManual','insightSpell','characterStats','rootInfo','legacyInfo','legacyActions','sectInfo','sectActions','dwellingInfo','dwellingActions','alchemyInfo','alchemyActions','gearInfo','gearActions','manualList','spellList','mapList','marketInfo','marketActions','eventBadge','majorEvents','worldLog','npcList','navBadge','modalWrap','modal']
          missing=[]; dup=[]
          for x in required:
              n=len(re.findall(r'id=["\']'+re.escape(x)+r'["\']',html))
              if n==0: missing.append(x)
              if n>1: dup.append(x)
          assert not missing, f'missing IDs: {missing}'
          assert not dup, f'duplicate IDs: {dup}'
          for action in ['cultivate','gather','work','explore','rumor','rest']:
              assert f'data-action="{action}"' in html, action
          for page in ['home','character','map','events','relations']:
              assert f'data-page="{page}"' in html, page
          print('UI_DOM_CONTRACT_OK')
          PY

      - name: Run V2.9 through V3.9 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v29.mjs
          node tests/regression-v30.mjs
          node tests/regression-v31.mjs
          node tests/regression-v32.mjs
          node tests/regression-v33.mjs
          node tests/regression-v34.mjs
          node tests/regression-v35.mjs
          node tests/regression-v36.mjs
          node tests/regression-v37.mjs
          node tests/regression-v38.mjs
          node tests/regression-v39.mjs

      - name: Publish UI shell to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp index.html style.css app.js sw.js /tmp/pages/
          cp src/game-v39.js /tmp/pages/src/game-v39.js
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css app.js sw.js src/game-v39.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish playable UI v3910 ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Verify actual GitHub Pages terminal result
        id: public
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT_GAME='99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37'
          success=0
          for i in $(seq 1 60); do
            bust="ui3910-${GITHUB_SHA}-${i}"
            ok=1
            curl -fsSL "${BASE}?${bust}" -o /tmp/live-index.html || ok=0
            curl -fsSL "${BASE}style.css?${bust}" -o /tmp/live-style.css || ok=0
            curl -fsSL "${BASE}sw.js?${bust}" -o /tmp/live-sw.js || ok=0
            curl -fsSL "${BASE}app.js?${bust}" -o /tmp/live-app.js || ok=0
            curl -fsSL "${BASE}src/game-v39.js?${bust}" -o /tmp/live-game.js || ok=0
            if [ "$ok" -eq 1 ]; then
              hgame=$(sha256sum /tmp/live-game.js | awk '{print $1}')
              if [ "$hgame" = "$EXPECT_GAME" ] \
                && grep -q 'data-ui-shell="playable-v3910"' /tmp/live-index.html \
                && grep -q 'TAIXUAN_PLAYABLE_UI_V3910' /tmp/live-style.css \
                && grep -q 'taixuan-v3.9.0-playable-ui-3910' /tmp/live-sw.js \
                && grep -q 'src/game-v39.js?v=3901' /tmp/live-app.js; then
                success=1
                break
              fi
            fi
            sleep 5
          done
          test "$success" -eq 1
          echo "PUBLIC_PLAYABLE_UI_HTTP_AND_HASH_OK"

      - name: Record public PASS on gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pages
          GITHUB_SHA="$GITHUB_SHA" node - <<'NODE'
          const fs=require('fs');
          const s={
            status:'PASS',
            ui_version:'playable-v3910',
            gameplay_version:'3.9.0',
            verified_commit:process.env.GITHUB_SHA,
            source_sha256:'99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37',
            save_schema_version:36,
            checks:['required DOM contract','V2.9-V3.9 headless regression','V6 icon hashes unchanged','actual GitHub Pages HTTP 200','public UI marker','public CSS marker','public service-worker cache marker','public V3.9 source SHA equality']
          };
          fs.writeFileSync('PUBLIC_UI_STATUS.json',JSON.stringify(s,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_UI_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record playable UI public PASS ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:gh-pages
          fi

      - name: Verify public PASS file is reachable
        shell: bash
        run: |
          set -euo pipefail
          visible=0
          for i in $(seq 1 60); do
            if curl -fsSL "https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_UI_STATUS.json?verify=${GITHUB_SHA}-${i}" -o /tmp/live-ui-status.json; then
              if GITHUB_SHA="$GITHUB_SHA" node -e "const s=require('/tmp/live-ui-status.json');if(s.status!=='PASS'||s.ui_version!=='playable-v3910'||s.verified_commit!==process.env.GITHUB_SHA||s.source_sha256!=='99b3d4f0ce0b8a1cc77d9fb0706e05a856d26b3aa9b19034474d742de4962c37')process.exit(1)"; then visible=1; break; fi
            fi
            sleep 5
          done
          test "$visible" -eq 1

      - name: Sync public PASS to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/pages/PUBLIC_UI_STATUS.json PUBLIC_UI_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_UI_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record playable UI public PASS ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi
