name: V2.2 dao world reactivity validation and release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "V22_DAO_WORLD.trigger"
      - "tools/build-v22-dao-world.cjs"
      - "tests/regression-v22.mjs"
      - ".github/workflows/v22-dao-world.yml"
  push:
    branches: ["main"]
    paths: ["V22_DAO_WORLD.trigger"]

permissions:
  contents: write

concurrency:
  group: taixuan-v22-dao-world-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify V2.1 public baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const s=require('./PUBLIC_V21_STATUS.json');
          if(s.status!=='PASS'||s.stage!=='public-pass'||s.build!=='2101'||s.game_version!=='2.1.0'||s.realm_count!==26||s.location_count!==12||s.route_count!==20||s.save_schema_version!==18) throw new Error('V2.1 baseline is not verified');
          JS
      - name: Build V2.2 source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v22-dao-world.cjs
          node tools/build-v22-dao-world.cjs
          node --check src/game-v22.js
          node - <<'JS'
          const b=require('./BUILD_V22_DAO_WORLD.json');
          if(b.status!=='PASS'||b.gameplay_version!=='2.2.0'||b.build!=='2201'||b.realm_count!==26||b.location_count!==12||b.route_count!==20||b.save_schema_version!==19) throw new Error('V2.2 build report mismatch');
          JS
          grep -q "const VERSION='2.2.0'" src/game-v22.js
          grep -q '剑痕问锋' src/game-v22.js
          grep -q '地火潮汐' src/game-v22.js
          grep -q '古兽遗骨' src/game-v22.js
          grep -q '残念回响' src/game-v22.js
          grep -q 'daoAffinity' src/game-v22.js
          grep -q '剑脉认可' src/game-v22.js
      - name: Run V2.2 headless regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v22.mjs
      - name: V6 icon regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum icon-v6-512.png | awk '{print $1}')" = "757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b"
          test "$(sha256sum icon-v6-192.png | awk '{print $1}')" = "a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf"

  release-v22:
    if: github.event_name == 'push'
    needs: validate-v22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and regress exact release source
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-v22-dao-world.cjs
          node tools/build-v22-dao-world.cjs
          node --check src/game-v22.js
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          node tests/regression-v22.mjs
      - name: Switch runtime shell to V2.2 build 2201
        shell: bash
        run: |
          set -euo pipefail
          cat > app.js <<'JS'
          // 太玄界 V2.2 道途世界反馈加载器 · build 2201
          (()=>{
            const fail=(e)=>{console.error(e);document.body.innerHTML='<div style="max-width:680px;margin:40px auto;padding:20px;color:#fff;background:#171a16;border:1px solid #485042;border-radius:14px;font-family:system-ui;line-height:1.7"><h2>太玄界加载失败</h2><div>'+String(e)+'</div><p>请刷新页面；若仍失败，请把这段错误发给我。</p></div>'};
            try{window.__TAIXUAN_BUILD__={engineeringVersion:'2.2.0',gameplayVersion:'2.2.0',build:'2201',milestone:'dao-world-reactivity',source:'src/game-v22.js',legacyPatchChain:false};document.title='太玄界 · 修仙大世界 V2.2';const script=document.createElement('script');script.src='./src/game-v22.js?v=2201';script.async=false;script.onload=()=>{if(!window.__TAIXUAN_TEST__)fail(new Error('V2.2 直接源码运行时未完成初始化'))};script.onerror=()=>fail(new Error('V2.2 游戏核心加载失败：src/game-v22.js'));document.head.appendChild(script)}catch(e){fail(e)}})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('太玄界 · 修仙大世界 V2.1','太玄界 · 修仙大世界 V2.2'),
            ('修仙大世界 · V2.1','修仙大世界 · V2.2'),
            ('V2.1 · 四大道途与流派分化','V2.2 · 道途世界反馈'),
            ('./app.js?v=2101','./app.js?v=2201'),
            ('境界长线已贯通至化神后期，高阶丹药与法宝循环继续保留。V2.1 从结丹境开始开放四条主修道途：剑修、火法、体修、神识流拥有不同属性取舍与专属战斗绝学；转修需要额外悟道并折损道途熟练度。','四大道途的战斗差异继续保留。V2.2 让世界开始识别你的主修路线：共鸣地域可出现专属机缘，同道NPC在论道与切磋时会给出额外反馈，道途名望会持久记录；青云宗也会认可剑修名望。'),
            ('见面后可赠礼、论道、切磋或求助。交情深会带来实际帮助；仇恨太深，对方也可能在同一地点伏击或劫掠你。','见面后可赠礼、论道、切磋或求助。NPC现在拥有稳定的道途倾向；与你同道的人在论道和切磋时会产生额外关系、熟练度与名望反馈。交情深仍会带来实际帮助，深仇也仍可能引发伏击。')]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'index anchor missing: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > sw.js <<'JS'
          const CACHE='taixuan-v2.2.0-dao-world-2201';
          const CORE=['./','./index.html?v=2201','./style.css','./app.js?v=2201','./src/game-v22.js?v=2201','./manifest-v6.webmanifest?v=6','./icon-v6-192.png?v=6','./icon-v6-512.png?v=6'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return res}).catch(()=>caches.match('./index.html?v=2201'))));});
          JS
          cat > README.md <<'MD'
          # 太玄界 · 修仙大世界

          当前正式版本：**V2.2.0 · 道途世界反馈（build 2201）**

          正式运行结构：`index.html -> app.js -> src/game-v22.js`。浏览器直接加载可读源码，不使用历史补丁链或 `eval`。

          ## V2.2
          - 保留凡人至化神后期 26 境界、12 地域、20 路线、V2.0 高阶生态与 V2.1 四大道途战斗差异；
          - 四条道途获得世界共鸣地域：剑道（青云山/落星矿脉）、火道（赤霞谷/黑风岭）、炼体（万兽山脉/黑风岭）、神识（古河遗迹/玄阴禁地）；
          - 共鸣地域的地域事件有 55% 概率转为当前道途专属机缘；每条道途都有稳妥/激进两种真实结算选择；
          - 新增持久化的分道途名望 `daoRenown` 与累计道途机缘 `daoEncounters`，转修不会抹掉旧道途名望；
          - NPC 新增稳定 `daoAffinity` 道途倾向；同道论道会额外提升关系、道途熟练度和名望；同道切磋也会强化这些反馈；
          - 人物关系列表直接显示 NPC 道途倾向以及是否“与你同道”；
          - 地图会对当前主修路线的共鸣地域标记“道途共鸣”；
          - 青云宗月俸会识别青云剑道名望，并按名望追加宗门贡献；
          - V2.1 的四种招牌绝学、转修惩罚、秘境共鸣、属性取舍、全部旧系统继续保留。

          ## 存档
          V2.2 使用 `saveSchemaVersion = 19`，新增 `daoRenown`、`daoEncounters` 与 NPC `daoAffinity`。V2.1 schema18 自动迁移；未来 schema20+ 拒绝覆盖。

          V6 App 图标保持固定 SHA-256，不修改。
          MD
          node --check app.js
          node --check sw.js
          grep -q 'src/game-v22.js?v=2201' app.js
          grep -q 'src/game-v22.js?v=2201' sw.js
          ! grep -q 'bundle2' app.js
          ! grep -q 'eval' app.js
      - name: Regress after shell switch
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression-v22.mjs
      - name: Commit V2.2 runtime to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v22.js BUILD_V22_DAO_WORLD.json app.js index.html sw.js README.md
          if ! git diff --cached --quiet; then git commit -m 'feat: V2.2 dao world reactivity [skip ci]'; git push origin HEAD:main; fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish exact V2.2 assets to gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/src
          cp src/game-v22.js /tmp/pages/src/game-v22.js
          cp BUILD_V22_DAO_WORLD.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png /tmp/pages/
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v22.js BUILD_V22_DAO_WORLD.json app.js index.html sw.js manifest-v6.webmanifest manifest.webmanifest style.css icon-v6-192.png icon-v6-512.png
          if ! git diff --cached --quiet; then git commit -m "feat: publish V2.2 dao world ${RELEASE_SHA} [skip ci]"; git push origin HEAD:gh-pages; fi
      - name: Public terminal verification
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}?v=2201&x=${RELEASE_SHA}-${i}" -o /tmp/public-index.html || ok=0
            curl -fsSL "${BASE}app.js?v=2201&x=${RELEASE_SHA}-${i}" -o /tmp/public-app.js || ok=0
            curl -fsSL "${BASE}src/game-v22.js?v=2201&x=${RELEASE_SHA}-${i}" -o /tmp/public-game.js || ok=0
            curl -fsSL "${BASE}sw.js?v=2201&x=${RELEASE_SHA}-${i}" -o /tmp/public-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?v=6&x=${RELEASE_SHA}-${i}" -o /tmp/public-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?x=${RELEASE_SHA}-${i}" -o /tmp/public-icon192.png || ok=0
            if [ "$ok" = 1 ] && grep -q "src/game-v22.js?v=2201" /tmp/public-app.js && grep -q "const VERSION='2.2.0'" /tmp/public-game.js && grep -q '地火潮汐' /tmp/public-game.js; then break; fi
            if [ "$i" = 60 ]; then echo 'public assets did not converge to V2.2' >&2; exit 1; fi
            sleep 2
          done
          node --check /tmp/public-app.js
          node --check /tmp/public-game.js
          node --check /tmp/public-sw.js
          test "$(sha256sum /tmp/public-icon512.png | awk '{print $1}')" = "$EXPECT512"
          test "$(sha256sum /tmp/public-icon192.png | awk '{print $1}')" = "$EXPECT192"
          node - <<'JS'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/public-manifest.json','utf8'));
          if(m.display!=='standalone')throw new Error('manifest display is not standalone');
          if(!Array.isArray(m.icons)||!m.icons.some(x=>String(x.src).includes('icon-v6-192.png'))||!m.icons.some(x=>String(x.src).includes('icon-v6-512.png')))throw new Error('manifest V6 icons missing');
          JS
          LOCAL_SHA="$(sha256sum src/game-v22.js | awk '{print $1}')"
          PUBLIC_SHA="$(sha256sum /tmp/public-game.js | awk '{print $1}')"
          test "$LOCAL_SHA" = "$PUBLIC_SHA"
          INDEX_PATH=/tmp/public-index.html GAME_PATH=/tmp/public-game.js node tests/regression-v22.mjs
      - name: Record V2.2 public PASS on gh-pages
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum src/game-v22.js | awk '{print $1}')"
          cat > /tmp/status.json <<JSON
          {"status":"PASS","game_version":"2.2.0","build":"2201","milestone":"dao-world-reactivity","verified_commit":"${RELEASE_SHA}","source_sha256":"${SHA}","realm_count":26,"location_count":12,"route_count":20,"save_schema_version":19,"stage":"public-pass","checks":["V2.1 public baseline PASS","V2.2 source build","four path-specific world events","persistent per-path renown","NPC dao affinity","same-path discussion and spar feedback","Qingyun sword recognition","map resonance markers","regional event integration","V2.1 system regression","schema 18 to 19 migration","future-save overwrite guard","public asset HTTP 200","public source hash equality","public headless regression","standalone manifest","V6 icon hash regression"]}
          JSON
          cd /tmp/pages
          cp /tmp/status.json PUBLIC_V22_STATUS.json
          git add PUBLIC_V22_STATUS.json
          git commit -m 'chore: record V2.2 public PASS [skip ci]'
          git push origin HEAD:gh-pages
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/PUBLIC_V22_STATUS.json'
          for i in $(seq 1 60); do
            if curl -fsSL "${BASE}?x=${RELEASE_SHA}-${i}" -o /tmp/public-status.json && node -e "const s=require('/tmp/public-status.json');if(s.status!=='PASS'||s.stage!=='public-pass'||s.verified_commit!=='${RELEASE_SHA}'||s.build!=='2201')process.exit(1)"; then exit 0; fi
            sleep 2
          done
          echo 'PUBLIC_V22_STATUS did not become visible' >&2
          exit 1
      - name: Sync verified public PASS to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/status.json PUBLIC_V22_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V22_STATUS.json
          git commit -m 'chore: sync verified V2.2 public PASS to main [skip ci]'
          git push origin HEAD:main
