name: Fix V1.7 builder comma
on:
  push:
    branches: ["main"]
    paths: ["FIX_V17_BUILDER.trigger"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix high-enemy array separator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v17-core-realm.cjs')
          s=p.read_text(encoding='utf-8')
          old="const highEnemies=`\n {name:'赤霞火猿王'"
          new="const highEnemies=`,\n {name:'赤霞火猿王'"
          if old not in s:
              raise SystemExit('V1.7 builder separator anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-v17-core-realm.cjs
          git commit -m 'fix: correct V1.7 high-enemy builder separator [skip ci]'
          git push origin HEAD:main
