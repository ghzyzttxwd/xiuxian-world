name: Verify V0.4 public sect

on:
  push:
    branches: ["gh-pages"]
    paths:
      - ".github/workflows/verify-v03.yml"
      - "index.html"
      - "app.js"
      - "v04-patch.js"
      - "sw.js"
      - "V04_FINAL.trigger"

permissions:
  contents: write

jobs:
  verify-v04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build and test V0.4 runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V04_FINAL_STAGE.txt
          node --check app.js
          node --check v03-patch.js
          node --check v04-patch.js
          grep -q 'id="sectInfo"' index.html
          grep -q 'id="sectActions"' index.html
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v04.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('v03-patch.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('v04-patch.js','utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');
          src=ctx.window.__TAIXUAN_PATCH_V03__(src);
          src=ctx.window.__TAIXUAN_PATCH_V04__(src);
          for(const s of ["const VERSION='0.4.0'","sectContribution","joinQingyunSect","黑风岭除妖","onSectCombatWin","renderSect"])assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';
          assert(src.includes(needle),'test api hook missing');
          src=src.replace(needle,"combatAction,load,joinQingyunSect,acceptSectTask,completeRoutineSectTask,claimSectStipend,sectExchange,promoteSect,onSectCombatWin};\nboot();");
          fs.writeFileSync('/tmp/v04-test.js',src);
          JS
          node /tmp/apply-v04.cjs
          node --check /tmp/v04-test.js
          echo 'gameplay-start' > V04_FINAL_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v04-final.mjs <<'JS'
          import fs from 'fs';
          import assert from 'assert';
          import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script src="\.\/app\.js[^"]*"><\/script>/,'');
          const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});
          dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});
          dom.window.console=console;
          dom.window.eval(fs.readFileSync('/tmp/v04-test.js','utf8'));
          const api=dom.window.__TAIXUAN_TEST__;assert(api,'test API missing');
          api.newGame('终验弟子');
          let s=api.getState();assert.equal(s.version,'0.4.0');assert.equal(s.player.sect,'散修');
          api.joinQingyunSect();s=api.getState();assert.equal(s.player.sectRank,'外门弟子');
          api.travel('青石镇');api.travel('临江城');api.travel('青云山');
          api.acceptSectTask('chores');api.completeRoutineSectTask();s=api.getState();assert.equal(s.player.sectContribution,6);
          const pay=s.player.spiritStones;api.claimSectStipend();s=api.getState();assert.equal(s.player.spiritStones,pay+3);api.claimSectStipend();assert.equal(api.getState().player.spiritStones,s.player.spiritStones);
          api.acceptSectTask('hunt');api.travel('临江城');api.travel('黑风岭');api.onSectCombatWin({kind:'妖兽',name:'测试妖兽'});api.onSectCombatWin({kind:'妖兽',name:'测试妖兽'});s=api.getState();assert.equal(s.player.sectTask,null);assert.equal(s.player.sectContribution,20);
          const before=s.player.spiritStones;api.sectExchange('stones');s=api.getState();assert.equal(s.player.sectContribution,10);assert.equal(s.player.spiritStones,before+4);
          const legacy=api.getState();for(const k of ['sect','sectRank','sectContribution','sectTasksCompleted','sectTask','sectLastStipend'])delete legacy.player[k];legacy.major.recruit={participated:true,status:'ended'};legacy.player.rootIndex=3;dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));assert(api.load());s=api.getState();assert.equal(s.player.sect,'青云宗');
          assert(dom.window.document.getElementById('sectInfo'));assert(dom.window.document.getElementById('sectActions'));
          console.log('V04_GAMEPLAY_PASS');
          JS
          node test-v04-final.mjs
          echo 'gameplay-pass' > V04_FINAL_STAGE.txt

      - name: Verify exact public Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'public-start' > V04_FINAL_STAGE.txt
          BASE='https://ghzyzttxwd.github.io/xiuxian-world/'
          EXPECT512='757ff87de9b0a763d3de2afcc7e23a3c6655847fee1c9690e29bbb005ce92c7b'
          EXPECT192='a44e68e89072c644c9f19d2c44997ae7c9af6806facc7cc9eaf76b3e0855bdcf'
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL "${BASE}index.html?verify=${GITHUB_SHA}" -o /tmp/pub-index.html || ok=0
            curl -fsSL "${BASE}app.js?verify=${GITHUB_SHA}" -o /tmp/pub-app.js || ok=0
            curl -fsSL "${BASE}v03-patch.js?verify=${GITHUB_SHA}" -o /tmp/pub-v03.js || ok=0
            curl -fsSL "${BASE}v04-patch.js?verify=${GITHUB_SHA}" -o /tmp/pub-v04.js || ok=0
            curl -fsSL "${BASE}sw.js?verify=${GITHUB_SHA}" -o /tmp/pub-sw.js || ok=0
            curl -fsSL "${BASE}manifest-v6.webmanifest?verify=${GITHUB_SHA}" -o /tmp/pub-manifest.json || ok=0
            curl -fsSL "${BASE}icon-v6-512.png?verify=${GITHUB_SHA}" -o /tmp/icon512.png || ok=0
            curl -fsSL "${BASE}icon-v6-192.png?verify=${GITHUB_SHA}" -o /tmp/icon192.png || ok=0
            if [ "$ok" -eq 1 ] && grep -q '__TAIXUAN_PATCH_V04__' /tmp/pub-app.js && grep -q 'id="sectInfo"' /tmp/pub-index.html && grep -q 'SECT_TASKS' /tmp/pub-v04.js && grep -q 'taixuan-v0.4.0-sect-patch0401' /tmp/pub-sw.js && [ "$(sha256sum /tmp/icon512.png|awk '{print $1}')" = "$EXPECT512" ] && [ "$(sha256sum /tmp/icon192.png|awk '{print $1}')" = "$EXPECT192" ]; then break; fi
            test "$i" -lt 60 || exit 1
            sleep 5
          done
          node --check /tmp/pub-app.js
          node --check /tmp/pub-v03.js
          node --check /tmp/pub-v04.js
          rm -f /tmp/public-v02.b64
          for i in $(seq -w 1 24); do curl -fsSL "${BASE}bundle2/c${i}.b64?verify=${GITHUB_SHA}" >> /tmp/public-v02.b64; done
          tr -d '\n\r' < /tmp/public-v02.b64 | base64 -d > /tmp/public-v02.js
          cat > /tmp/apply-public.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('/tmp/pub-v03.js','utf8'),ctx);vm.runInContext(fs.readFileSync('/tmp/pub-v04.js','utf8'),ctx);
          let src=fs.readFileSync('/tmp/public-v02.js','utf8');src=ctx.window.__TAIXUAN_PATCH_V03__(src);src=ctx.window.__TAIXUAN_PATCH_V04__(src);assert(src.includes("const VERSION='0.4.0'"));assert(src.includes('renderSect'));fs.writeFileSync('/tmp/public-v04-runtime.js',src);
          JS
          node /tmp/apply-public.cjs
          node --check /tmp/public-v04-runtime.js
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/pub-manifest.json'))
          assert m['display']=='standalone' and m['short_name']=='太玄界'
          assert {x['sizes'] for x in m['icons']}=={'192x192','512x512'}
          PY
          echo 'public-pass' > V04_FINAL_STAGE.txt

      - name: Record V0.4 PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.4.0\",\"milestone\":\"sect-loop\",\"verified_commit\":\"${GITHUB_SHA}\",\"stage\":\"$(cat V04_FINAL_STAGE.txt)\",\"checks\":[\"real V0.2->V0.3->V0.4 chain\",\"V0.4 syntax\",\"sect UI nodes\",\"sect join\",\"legacy migration\",\"routine task\",\"hunt combat progress\",\"monthly stipend idempotence\",\"contribution exchange\",\"public loader\",\"public patch\",\"public service worker\",\"public runtime rebuild\",\"standalone manifest\",\"V6 icon hash regression\"]}" > PUBLIC_V04_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V04_STATUS.json
          git commit -m 'chore: record V0.4 public verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record V0.4 FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V04_FINAL_STAGE.txt 2>/dev/null || echo 'unknown')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.4.0\",\"milestone\":\"sect-loop\",\"stage\":\"${stage}\"}" > PUBLIC_V04_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V04_STATUS.json
          git commit -m 'chore: record V0.4 public verification failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
