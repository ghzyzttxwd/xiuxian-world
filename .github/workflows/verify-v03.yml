name: Verify V0.4 sect prerelease

on:
  push:
    branches: ["gh-pages"]
    paths:
      - ".github/workflows/verify-v03.yml"
      - "v04-patch.js"
      - "V04_VERIFY.trigger"

permissions:
  contents: write

jobs:
  verify-v04-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V0.4 candidate from real runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-start' > V04_STAGE.txt
          node --check v03-patch.js
          node --check v04-patch.js
          cat bundle2/c*.b64 | tr -d '\n\r' | base64 -d > /tmp/v02.js
          cat > /tmp/apply-v04.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('v03-patch.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('v04-patch.js','utf8'),ctx);
          let src=fs.readFileSync('/tmp/v02.js','utf8');
          src=ctx.window.__TAIXUAN_PATCH_V03__(src);
          src=ctx.window.__TAIXUAN_PATCH_V04__(src);
          for(const s of ["const VERSION='0.4.0'","sectContribution","sectTasksCompleted","joinQingyunSect","黑风岭除妖","onSectCombatWin","renderSect"]) assert(src.includes(s),`missing ${s}`);
          const needle='combatAction};\nboot();';
          assert(src.includes(needle),'test api hook missing');
          src=src.replace(needle,"combatAction,load,joinQingyunSect,acceptSectTask,completeRoutineSectTask,claimSectStipend,sectExchange,promoteSect,onSectCombatWin};\nboot();");
          fs.writeFileSync('/tmp/v04-test.js',src);
          console.log('V04_BUILD_PASS',src.length);
          JS
          node /tmp/apply-v04.cjs
          node --check /tmp/v04-test.js
          echo 'build-pass' > V04_STAGE.txt

      - name: Headless sect gameplay regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'gameplay-start' > V04_STAGE.txt
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cat > test-v04.mjs <<'JS'
          import fs from 'fs';
          import assert from 'assert';
          import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('index.html','utf8').replace(/<script src="\.\/app\.js"><\/script>/,'');
          const dom=new JSDOM(html,{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});
          dom.window.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});
          dom.window.console=console;
          dom.window.eval(fs.readFileSync('/tmp/v04-test.js','utf8'));
          const api=dom.window.__TAIXUAN_TEST__;assert(api,'test API missing');
          api.newGame('宗门测试者');
          let s=api.getState();
          assert.equal(s.version,'0.4.0');
          assert.equal(s.player.sect,'散修');
          assert.equal(s.player.sectContribution,0);

          api.joinQingyunSect();
          s=api.getState();assert.equal(s.player.sect,'青云宗');assert.equal(s.player.sectRank,'外门弟子');
          api.travel('青石镇');api.travel('临江城');api.travel('青云山');
          api.acceptSectTask('chores');
          s=api.getState();assert.equal(s.player.sectTask.id,'chores');
          api.completeRoutineSectTask();
          s=api.getState();assert.equal(s.player.sectContribution,6);assert.equal(s.player.sectTasksCompleted,1);

          const beforePay=s.player.spiritStones;
          api.claimSectStipend();s=api.getState();assert.equal(s.player.spiritStones,beforePay+3);
          api.claimSectStipend();let s2=api.getState();assert.equal(s2.player.spiritStones,s.player.spiritStones,'monthly stipend duplicated');

          api.acceptSectTask('hunt');
          s=api.getState();assert.equal(s.player.sectTask.id,'hunt');
          api.travel('临江城');api.travel('黑风岭');
          api.onSectCombatWin({kind:'妖兽',name:'测试妖兽'});
          s=api.getState();assert.equal(s.player.sectTask.progress,1);
          api.onSectCombatWin({kind:'妖兽',name:'测试妖兽'});
          s=api.getState();assert.equal(s.player.sectTask,null);assert.equal(s.player.sectTasksCompleted,2);assert.equal(s.player.sectContribution,20);

          const beforeExchange=s.player.spiritStones;
          api.sectExchange('stones');s=api.getState();assert.equal(s.player.sectContribution,10);assert.equal(s.player.spiritStones,beforeExchange+4);

          const legacy=api.getState();
          for(const k of ['sect','sectRank','sectContribution','sectTasksCompleted','sectTask','sectLastStipend']) delete legacy.player[k];
          legacy.major.recruit={participated:true,status:'ended'};legacy.player.rootIndex=3;
          dom.window.localStorage.setItem('xiuxian_world_v02',JSON.stringify(legacy));
          assert(api.load(),'legacy load failed');
          s=api.getState();assert.equal(s.player.sect,'青云宗');assert.equal(s.player.sectRank,'外门弟子');
          console.log('V04_GAMEPLAY_PASS',JSON.stringify({sect:s.player.sect,rank:s.player.sectRank,contribution:s.player.sectContribution,tasks:s.player.sectTasksCompleted}));
          JS
          set +e
          node test-v04.mjs > V04_DEBUG.txt 2>&1
          rc=$?
          set -e
          cat V04_DEBUG.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo 'gameplay-pass' > V04_STAGE.txt

      - name: Record prerelease PASS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "{\"status\":\"PASS\",\"game_version\":\"0.4.0\",\"milestone\":\"sect-prerelease\",\"stage\":\"$(cat V04_STAGE.txt)\",\"checks\":[\"V0.2->V0.3->V0.4 patch chain\",\"V0.4 syntax\",\"sect join\",\"legacy sect migration\",\"routine task\",\"hunt progress\",\"monthly stipend idempotence\",\"contribution exchange\"]}" > PUBLIC_V04_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V04_PRE_STATUS.json
          git commit -m 'chore: record V0.4 prerelease verification [skip ci]'
          git push origin HEAD:gh-pages

      - name: Record prerelease FAIL
        if: failure()
        shell: bash
        run: |
          stage=$(cat V04_STAGE.txt 2>/dev/null || echo 'unknown')
          debug=$(tail -c 3000 V04_DEBUG.txt 2>/dev/null | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read(),ensure_ascii=False))' || echo '""')
          printf '%s\n' "{\"status\":\"FAIL\",\"game_version\":\"0.4.0\",\"milestone\":\"sect-prerelease\",\"stage\":\"${stage}\",\"debug\":${debug}}" > PUBLIC_V04_PRE_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_V04_PRE_STATUS.json
          git commit -m 'chore: record V0.4 prerelease failure [skip ci]' || true
          git push origin HEAD:gh-pages || true
