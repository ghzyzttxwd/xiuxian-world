name: Phase8 Round3 Safe Micro

on:
  push:
    branches: ["phase8-round3-safe-micro"]
    paths: ["PHASE8_ROUND3_MICRO.trigger"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-round3-safe-micro
      - name: Run three safer routes
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@24 >/dev/null 2>&1
          cp tests/playtest-phase8-round2.mjs /tmp/base.mjs
          cp /tmp/base.mjs tests/playtest-phase8-round3-micro.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/playtest-phase8-round3-micro.mjs')
          s=p.read_text()
          old="function settleCombat(api){let guard=0;while(api.getCombat?.()&&guard++<40){const c=api.getCombat(),s=api.getState();const ratio=(Number(c.playerHp)||0)/Math.max(1,hpMax(api,s));api.combatAction(ratio<.34?'defend':'attack')}return guard}"
          new="function settleCombat(api){let guard=0;while(api.getCombat?.()&&guard++<40){const c=api.getCombat(),s=api.getState();const ratio=(Number(c.playerHp)||0)/Math.max(1,hpMax(api,s)),diff=(Number(c.enemy?.realm)||0)-(Number(s.player.realmIndex)||0);if(diff>=1||ratio<.62)api.combatAction('flee');else if(ratio<.42)api.combatAction('defend');else api.combatAction('attack')}return guard}"
          assert old in s
          s=s.replace(old,new)
          s=s.replace("const OUT='PHASE8_ROUND2_REPORT.json';","const OUT='PHASE8_ROUND3_MICRO_REPORT.json';")
          s=s.replace('maxActions:560','maxActions:400')
          s=s.replace('for(let i=0;i<2;i++)','for(let i=0;i<1;i++)')
          s=s.replace("phase:'8-round2-human-navigation'","phase:'8-round3-safe-micro'")
          s=s.replace("dead:!!end.flags?.dead,milestones","dead:!!end.flags?.dead,deathCause:end.flags?.deathCause||null,milestones")
          p.write_text(s)
          PY
          node tests/playtest-phase8-round3-micro.mjs
          test -s PHASE8_ROUND3_MICRO_REPORT.json
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE8_ROUND3_MICRO_REPORT.json
          git commit -m 'test: record phase8 round3 safe micro [skip ci]'
          git push origin HEAD:phase8-round3-safe-micro
